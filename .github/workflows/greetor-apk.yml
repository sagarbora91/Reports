name: Build Greetor APK

on:
  push:
    branches: [main, capacitor]
    paths:
      - 'greetor/**'
      - '.github/workflows/greetor-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'greetor/**'
      - '.github/workflows/greetor-apk.yml'
  workflow_dispatch:

# Lets the publish-release step create/update the "latest-greetor" GitHub Release.
permissions:
  contents: write

# If two pushes land back-to-back, only the newest one races to update the
# "latest-greetor" Release — earlier runs are cancelled mid-flight.
# Distinct group from the audit app's "release-latest".
concurrency:
  group: greetor-release-latest
  cancel-in-progress: true

jobs:
  build:
    name: Build Saagar Greetor APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: greetor
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Install fonts for SVG rasterization
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation fonts-dejavu fontconfig
          fc-cache -f

      - name: Rasterize brand SVG sources to PNG
        run: npm run build-assets
        continue-on-error: true

      - name: Add or sync Android platform
        run: |
          if [ ! -d "android" ]; then
            echo "Generating android/ from scratch"
            npx cap add android
          else
            echo "android/ exists, syncing"
            npx cap sync android
          fi

      - name: Generate Android icon & splash variants
        run: npx capacitor-assets generate --android
        continue-on-error: true

      # Decide release vs debug based on whether the keystore secret exists.
      # Until the repo owner follows SIGNING_SETUP.md, secrets are absent and
      # the debug path runs unchanged. The moment secrets are added, the next
      # push auto-switches to a signed release APK.
      - name: Detect signing secrets
        id: signing
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "Signing secrets present → building SIGNED RELEASE APK."
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets not configured — building unsigned debug APK. See greetor/SIGNING_SETUP.md to enable signed releases + permanent download URL."
          fi

      - name: Stamp version code and name from CI run number
        run: |
          BUILD_NUM="${{ github.run_number }}"
          VERSION_NAME="0.1.${BUILD_NUM}"
          echo "Stamping versionCode=${BUILD_NUM}, versionName=${VERSION_NAME}"
          sed -i "s/versionCode 1/versionCode ${BUILD_NUM}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: Sync Capacitor after asset + version updates
        run: npx cap sync android

      - name: Decode keystore and inject signing config
        if: steps.signing.outputs.mode == 'release'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystore
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > android/app/keystore/release.jks
          # Sanity check: a real .jks is ~2KB+. base64-of-garbage decodes tiny.
          SIZE=$(stat -c%s android/app/keystore/release.jks)
          if [ "$SIZE" -lt 1024 ]; then
            echo "::error::Decoded keystore is only ${SIZE} bytes — the SIGNING_KEYSTORE_BASE64 secret is malformed. Re-run the base64 step from greetor/SIGNING_SETUP.md and paste again."
            exit 1
          fi
          # Append signing config to android/app/build.gradle. Idempotent: only
          # if the block isn't already there (the android/ dir is regenerated
          # on every run, so we re-append each time).
          if ! grep -q "greetorRelease" android/app/build.gradle; then
            cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  greetorRelease {
                      storeFile file("keystore/release.jks")
                      storePassword System.getenv("SIGNING_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("SIGNING_KEY_ALIAS")
                      keyPassword System.getenv("SIGNING_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.greetorRelease
                      minifyEnabled false
                  }
              }
          }
          GRADLE
          fi
          echo "Signing config injected (keystore size ${SIZE} bytes)."

      - name: Patch AndroidManifest with CAMERA permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if grep -q "android.permission.CAMERA" "$MANIFEST"; then
            echo "CAMERA permission already declared, skipping."
          else
            python3 - <<'PY'
          import re
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, encoding='utf-8') as f:
              src = f.read()
          inject = (
              '    <uses-permission android:name="android.permission.CAMERA" />\n'
              '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
              '    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n'
          )
          new = re.sub(r'(\s*)<application', inject + r'\1<application', src, count=1)
          with open(path, 'w', encoding='utf-8') as f:
              f.write(new)
          print('Injected CAMERA permission into', path)
          PY
          fi
          echo "--- Final AndroidManifest.xml (top 30 lines) ---"
          head -n 30 "$MANIFEST"

      - name: Build signed release APK
        if: steps.signing.outputs.mode == 'release'
        working-directory: greetor/android
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build debug APK
        if: steps.signing.outputs.mode == 'debug'
        working-directory: greetor/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy APK to known path (saagar-greetor.apk)
        # Runs after whichever build step fired. Handles both release variants
        # (app-release.apk preferred; app-release-unsigned.apk as fallback).
        run: |
          MODE="${{ steps.signing.outputs.mode }}"
          if [ "$MODE" = "release" ]; then
            SRC_DIR="android/app/build/outputs/apk/release"
            if [ -f "${SRC_DIR}/app-release.apk" ]; then
              SRC="${SRC_DIR}/app-release.apk"
            else
              SRC="${SRC_DIR}/app-release-unsigned.apk"
            fi
          else
            SRC_DIR="android/app/build/outputs/apk/debug"
            SRC="${SRC_DIR}/app-debug.apk"
          fi
          DEST="${SRC_DIR}/saagar-greetor.apk"
          cp "$SRC" "$DEST"
          echo "APK_PATH=greetor/${DEST}" >> "$GITHUB_ENV"
          echo "Copied ${SRC} → ${DEST}"

      - name: Upload APK artifact (30-day backup)
        uses: actions/upload-artifact@v4
        with:
          name: saagar-greetor-${{ steps.signing.outputs.mode }}-${{ env.VERSION_NAME }}-${{ github.sha }}
          path: ${{ env.APK_PATH }}
          retention-days: 30

      # Publish the signed release APK to a single rolling "latest-greetor"
      # Release so the download URL never changes. Only fires on capacitor branch.
      - name: Publish APK to "latest-greetor" GitHub Release
        if: steps.signing.outputs.mode == 'release' && github.ref == 'refs/heads/capacitor' && success()
        uses: softprops/action-gh-release@3bb1273dc8b9bbeac84d4f1eaa37ee07bd0f4d8f  # v2.6.2 — pinned to SHA
        with:
          tag_name: latest-greetor
          name: Greetor — latest build (capacitor)
          body: |
            Auto-built from commit ${{ github.sha }} on branch `${{ github.ref_name }}`.
            Version: **${{ env.VERSION_NAME }}** (run ${{ github.run_number }})

            **Install:** download `saagar-greetor.apk` below on your Android phone and tap to install. The first time you install from this Release, your phone will ask to allow "Install unknown apps" for your browser — say yes once and you're set.

            Updates from this signed APK overwrite the previous version in place; app data is preserved.
          make_latest: "false"
          prerelease: false
          files: ${{ env.APK_PATH }}

      - name: Summary
        run: |
          MODE="${{ steps.signing.outputs.mode }}"
          {
            echo "### Saagar Greetor APK ready"
            echo ""
            echo "Mode: **${MODE}** · Version: **${{ env.VERSION_NAME }}** (versionCode ${{ github.run_number }})"
            echo ""
            if [ "$MODE" = "release" ]; then
              echo "Permanent download URL (bookmark this, share via WhatsApp):"
              echo ""
              echo "**https://github.com/${{ github.repository }}/releases/latest/download/saagar-greetor.apk**"
              echo ""
              echo "The Release was also attached to this run's artifacts as a 30-day backup."
            else
              echo "Signing secrets not configured yet — built an UNSIGNED debug APK as a fallback."
              echo ""
              echo "To enable signed releases + the permanent download URL, follow [greetor/SIGNING_SETUP.md](../../blob/${{ github.sha }}/greetor/SIGNING_SETUP.md)."
              echo ""
              echo "Download the debug artifact from the Artifacts panel above. Transfer to your Android phone → enable 'Install from unknown sources' → tap to install."
            fi
          } >> $GITHUB_STEP_SUMMARY
