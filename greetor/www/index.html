<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f3a">
  <title>Saagar Greetor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
<style>
:root {
  --navy: #0b1f3a;
  --navy-mid: #132b4c;
  --navy-light: #1c3a66;
  --gold: #c99a2e;
  --gold-light: #e0b85d;
  --white: #ffffff;
  --gray-50: #f9fafb;
  --gray-100: #f3f4f6;
  --gray-200: #e5e7eb;
  --gray-300: #d1d5db;
  --gray-500: #6b7280;
  --gray-700: #374151;
  --gray-800: #1f2937;
  --green: #168a51;
  --green-pale: #eaf8f1;
  --amber: #c77912;
  --amber-pale: #fff8e1;
  --red: #ba2d2d;
  --red-pale: #fff0f0;
  --shadow-sm: 0 1px 3px rgba(11,31,58,0.08);
  --shadow: 0 4px 12px rgba(11,31,58,0.10);
  --shadow-lg: 0 18px 45px rgba(11,31,58,0.18);
  --radius: 14px;
  --radius-sm: 10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --bnav-height: 64px;
  --topbar-height: 52px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  color: var(--gray-800);
  background: var(--gray-50);
  overscroll-behavior: none;
}
input, select, textarea, button {
  font-family: inherit;
  font-size: 16px; /* prevents iOS zoom on focus */
}

/* ===================== App shell ===================== */
.topbar {
  position: sticky; top: 0; z-index: 10;
  padding: calc(var(--safe-top) + 8px) 16px 8px;
  background: var(--navy);
  color: var(--white);
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.topbar-left { display: flex; align-items: center; gap: 8px; }
.topbar-back {
  background: rgba(255,255,255,0.14);
  border: 0; color: var(--white);
  width: 36px; height: 36px; border-radius: 9px;
  font-size: 22px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.topbar-back:active { background: rgba(255,255,255,0.26); }
.brand { display: flex; align-items: baseline; gap: 8px; cursor: pointer; }
.brand-serif {
  font-family: 'DM Serif Display', Georgia, serif;
  font-size: 24px;
  color: var(--gold-light);
  letter-spacing: 0.3px;
}
.brand-sans {
  font-size: 10px;
  letter-spacing: 2.5px;
  color: var(--white);
  opacity: 0.85;
  font-weight: 700;
}
.user-pill {
  border: 0;
  background: rgba(255,255,255,0.16);
  color: var(--white);
  width: 38px; height: 38px;
  border-radius: 50%;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.5px;
  cursor: pointer;
}
main#screen {
  padding: 14px 14px calc(var(--bnav-height) + var(--safe-bottom) + 14px);
  min-height: calc(100vh - var(--topbar-height) - var(--bnav-height) - var(--safe-top) - var(--safe-bottom));
}
.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-bottom: var(--safe-bottom);
  background: var(--white);
  border-top: 1px solid var(--gray-200);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  z-index: 9;
  box-shadow: 0 -2px 10px rgba(11,31,58,0.06);
}
.bnav-btn {
  background: transparent; border: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 2px;
  color: var(--gray-500);
  cursor: pointer;
  padding: 10px 4px;
  font-size: 11px; font-weight: 700;
  min-height: var(--bnav-height);
  letter-spacing: 0.3px;
}
.bnav-icon { font-size: 22px; line-height: 1; }
.bnav-btn.active { color: var(--navy); }
/* Bottom nav stays visible during the wizard — the save bar stacks above it. */

/* ===================== Sections / cards ===================== */
.card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
}
.card h2, .card h3 { margin: 0 0 8px; color: var(--navy); }
.card h2 { font-family: 'DM Serif Display', Georgia, serif; font-size: 20px; }
.card h3 { font-size: 15px; }
.card-muted { color: var(--gray-500); font-size: 13px; }

/* ===================== Wizard ===================== */
.wizard {
  /* Clear both the stacked save bar (~66px) and the bottom nav below it. */
  padding-bottom: calc(150px + var(--bnav-height) + var(--safe-bottom));
}
.wizard-head {
  background: var(--white);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}
.wizard-progress {
  display: flex; gap: 4px;
  margin-bottom: 10px;
}
.wizard-dot {
  flex: 1; height: 5px;
  background: var(--gray-200);
  border-radius: 999px;
}
.wizard-dot.done { background: var(--green); }
.wizard-dot.current { background: var(--gold); }
.wizard-step-label {
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--gray-500);
}
.wizard-title {
  font-family: 'DM Serif Display', Georgia, serif;
  font-size: 22px;
  color: var(--navy);
  margin: 4px 0 0;
}

/* ===================== Fields ===================== */
.field {
  background: var(--white);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
}
.field-label {
  display: block;
  font-size: 13px;
  color: var(--gray-700);
  font-weight: 700;
  margin-bottom: 8px;
  letter-spacing: 0.2px;
}
.field-label.required::after { content: ' *'; color: var(--red); }
.field-hint {
  font-size: 12px;
  color: var(--gray-500);
  margin-top: 6px;
}
.field input[type="text"],
.field input[type="tel"],
.field input[type="number"],
.field input[type="date"],
.field input[type="time"],
.field input[type="password"],
.field select,
.field textarea {
  width: 100%;
  border: 1px solid var(--gray-300);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  background: var(--white);
  color: var(--gray-800);
  font-size: 16px;
  outline: none;
  min-height: 44px;
}
.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201,154,46,0.15);
}
.field textarea { min-height: 90px; resize: vertical; }

.chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  background: var(--gray-100);
  border: 1px solid var(--gray-200);
  color: var(--gray-700);
  padding: 10px 14px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  min-height: 40px;
  min-width: 56px;
  display: inline-flex; align-items: center; justify-content: center;
  user-select: none;
}
.chip.selected {
  background: var(--navy);
  color: var(--white);
  border-color: var(--navy);
}
.chip-more {
  background: transparent;
  border: 1px dashed var(--gray-300);
  color: var(--gray-500);
}

/* ===================== Save bar ===================== */
.savebar {
  position: fixed; left: 0; right: 0;
  /* Sit directly above the bottom nav so both stay reachable. */
  bottom: calc(var(--bnav-height) + var(--safe-bottom));
  padding: 10px 14px;
  background: var(--white);
  border-top: 1px solid var(--gray-200);
  display: grid; gap: 10px;
  grid-template-columns: 1fr 1fr;
  z-index: 8;
  box-shadow: 0 -4px 16px rgba(11,31,58,0.10);
}
.savebar.single-btn { grid-template-columns: 1fr; }

/* ===================== Buttons ===================== */
.btn {
  border: 0;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.3px;
  cursor: pointer;
  padding: 14px 16px;
  min-height: 48px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-primary {
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  color: #1a1102;
  box-shadow: 0 6px 14px rgba(201,154,46,0.30);
}
.btn-primary:active { transform: translateY(1px); }
.btn-secondary {
  background: var(--white);
  color: var(--navy);
  border: 1px solid var(--gray-300);
}
.btn-ghost {
  background: transparent;
  color: var(--navy);
  border: 0;
}
.btn-danger {
  background: var(--red);
  color: var(--white);
}
.btn-full { width: 100%; }
.btn[disabled] { opacity: 0.45; pointer-events: none; }

/* ===================== Today screen ===================== */
.today-hero {
  background: linear-gradient(135deg, var(--navy), #071529);
  color: var(--white);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  display: flex; align-items: center; justify-content: space-between;
}
.today-count {
  font-family: 'DM Serif Display', Georgia, serif;
  font-size: 48px;
  color: var(--gold-light);
  line-height: 1;
}
.today-label {
  font-size: 11px; letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
  margin-top: 4px;
}
.today-meta { font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 6px; }

.entry-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 8px;
  box-shadow: var(--shadow-sm);
}
.entry-row { display: flex; align-items: center; gap: 10px; }
.entry-name { font-weight: 700; color: var(--navy); flex: 1; font-size: 15px; }
.entry-mobile { font-size: 13px; color: var(--gray-500); font-variant-numeric: tabular-nums; }
.entry-meta {
  margin-top: 6px;
  font-size: 12px;
  color: var(--gray-700);
  display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
}
.entry-actions { display: flex; gap: 6px; margin-top: 10px; }
.entry-action {
  background: var(--gray-100);
  border: 0;
  border-radius: 8px;
  padding: 9px 14px;
  font-size: 13px;
  font-weight: 700;
  color: var(--navy);
  cursor: pointer;
  min-height: 38px;
  flex: 1;
}
.entry-action.wa { background: #25D366; color: var(--white); }
.entry-action.delete { background: var(--red-pale); color: var(--red); flex: 0 0 60px; }

.empty-state {
  text-align: center;
  padding: 40px 16px;
  color: var(--gray-500);
}
.empty-state .icon { font-size: 48px; opacity: 0.4; }
.empty-state h3 { margin: 12px 0 4px; color: var(--navy); }

/* ===================== Pills ===================== */
.pill {
  display: inline-flex; align-items: center;
  border-radius: 999px;
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.3px;
}
.pill-hot { background: var(--red-pale); color: var(--red); }
.pill-warm { background: var(--amber-pale); color: var(--amber); }
.pill-cold, .pill-open { background: var(--gray-100); color: var(--gray-700); }
.pill-converted { background: var(--green-pale); color: var(--green); }
.pill-closed { background: var(--gray-100); color: var(--gray-500); }

/* ===================== Settings ===================== */
.settings-section {
  background: var(--white);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}
.settings-section h3 {
  margin: 0 0 6px;
  font-size: 15px;
  color: var(--navy);
}
.settings-section p { margin: 0 0 12px; font-size: 13px; color: var(--gray-500); }
.settings-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 0;
  border-top: 1px solid var(--gray-100);
}
.settings-row:first-of-type { border-top: 0; }

.role-pill {
  display: inline-block;
  background: var(--navy);
  color: var(--white);
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  margin-left: 6px;
}
.role-pill.OWNER { background: var(--gold); color: #1a1102; }
.role-pill.MANAGER { background: var(--navy); }
.role-pill.GREETOR { background: var(--gray-700); }
.role-pill.inactive { background: var(--gray-300); color: var(--gray-700); }

.user-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0;
  border-top: 1px solid var(--gray-100);
}
.user-row:first-of-type { border-top: 0; }
.user-row .info { flex: 1; }
.user-row .info .name { font-weight: 700; color: var(--navy); }
.user-row .info .meta { font-size: 12px; color: var(--gray-500); margin-top: 2px; }

/* ===================== Modals ===================== */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(11,31,58,0.55);
  backdrop-filter: blur(2px);
  z-index: 1000;
  display: flex; align-items: flex-end;
}
.modal {
  background: var(--white);
  width: 100%;
  border-radius: 20px 20px 0 0;
  padding: 20px 16px calc(16px + var(--safe-bottom));
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: 0 -20px 60px rgba(11,31,58,0.30);
}
.modal-handle {
  width: 40px; height: 4px;
  background: var(--gray-300);
  border-radius: 999px;
  margin: 0 auto 12px;
}
.modal h2 {
  font-family: 'DM Serif Display', Georgia, serif;
  color: var(--navy);
  margin: 0 0 4px;
  font-size: 22px;
}
.modal h3 {
  font-family: 'DM Serif Display', Georgia, serif;
  color: var(--navy);
  margin: 0 0 12px;
  font-size: 18px;
}
.modal-actions {
  display: grid; gap: 10px; grid-template-columns: 1fr 1fr;
  margin-top: 16px;
}
.modal-actions.single { grid-template-columns: 1fr; }

/* ===================== Toast ===================== */
.toast {
  position: fixed;
  left: 50%; transform: translateX(-50%) translateY(80px);
  bottom: calc(var(--bnav-height) + var(--safe-bottom) + 12px);
  background: var(--navy);
  color: var(--white);
  padding: 12px 20px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 8px 24px rgba(11,31,58,0.35);
  opacity: 0;
  transition: all 0.2s ease;
  z-index: 999;
  max-width: 90vw;
  text-align: center;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* ===================== Auth ===================== */
body.locked { overflow: hidden; }
#auth-screen {
  position: fixed; inset: 0;
  background: linear-gradient(180deg, var(--navy), #071529);
  color: var(--white);
  z-index: 5000;
  padding: calc(var(--safe-top) + 24px) 20px calc(var(--safe-bottom) + 20px);
  display: flex; flex-direction: column;
  overflow-y: auto;
}
.auth-brand {
  text-align: center;
  margin-bottom: 24px;
}
.auth-brand .main {
  font-family: 'DM Serif Display', Georgia, serif;
  font-size: 38px;
  color: var(--gold-light);
  line-height: 1;
}
.auth-brand .sub {
  font-size: 11px;
  letter-spacing: 4px;
  opacity: 0.8;
  margin-top: 6px;
  font-weight: 700;
}
.auth-card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 12px;
}
.auth-card h2 {
  margin: 0 0 12px;
  font-family: 'DM Serif Display', Georgia, serif;
  font-size: 22px;
  color: var(--white);
}
.auth-card p { font-size: 13px; opacity: 0.8; margin: 0 0 12px; }
.auth-card label {
  display: block;
  font-size: 11px;
  opacity: 0.7;
  margin-bottom: 4px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  font-weight: 700;
}
.auth-card input, .auth-card select {
  width: 100%;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.20);
  color: var(--white);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 16px;
  margin-bottom: 10px;
  outline: none;
  min-height: 44px;
}
.auth-card select option { background: var(--navy); color: var(--white); }
.pin-dots {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin: 18px 0 14px;
}
.pin-dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid var(--gold-light);
}
.pin-dot.filled { background: var(--gold-light); }
.pin-dots.shake { animation: shake 0.3s; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}
.pin-pad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 12px;
}
.pin-key {
  background: rgba(255,255,255,0.10);
  color: var(--white);
  border: 0;
  border-radius: var(--radius);
  font-size: 24px;
  font-weight: 600;
  padding: 16px;
  cursor: pointer;
  min-height: 58px;
}
.pin-key:active { background: rgba(255,255,255,0.22); transform: translateY(1px); }
.pin-key.action {
  background: rgba(201,154,46,0.18);
  color: var(--gold-light);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.5px;
}
.auth-error {
  background: rgba(186,45,45,0.18);
  border: 1px solid rgba(186,45,45,0.4);
  color: #ffb4b4;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  text-align: center;
  margin-bottom: 10px;
}
.auth-btn-row { display: grid; gap: 10px; margin-top: 12px; }

/* ===================== Dedup ===================== */
.dedup-row {
  background: var(--gray-100);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  margin-bottom: 8px;
  font-size: 13px;
}
.dedup-row strong { color: var(--navy); }
.dedup-row .meta { color: var(--gray-500); font-size: 12px; margin-top: 2px; }

/* ===================== Utility ===================== */
.hidden { display: none !important; }
.muted { color: var(--gray-500); }
.tiny { font-size: 11px; }
.row-spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.spacer-8 { height: 8px; }
.spacer-12 { height: 12px; }
.spacer-24 { height: 24px; }

@media print {
  body { background: white; }
  .topbar, .bottomnav, .savebar, .toast, #modal-root, #auth-screen { display: none !important; }
}
</style>
</head>
<body class="locked">

  <header class="topbar">
    <div class="topbar-left">
      <button class="topbar-back" id="topbarBack" data-action="go-back" aria-label="Back" hidden>←</button>
      <div class="brand" data-action="go-home" role="button" aria-label="Home">
        <span class="brand-serif">Saagar</span>
        <span class="brand-sans">GREETOR</span>
      </div>
    </div>
    <button class="user-pill" id="userPill" data-action="user-pill" aria-label="User menu">
      <span id="userInitials">··</span>
    </button>
  </header>

  <main id="screen"></main>

  <nav class="bottomnav" id="bottomnav">
    <button class="bnav-btn active" data-screen="capture">
      <span class="bnav-icon">＋</span>
      <span data-i18n="nav.capture">CAPTURE</span>
    </button>
    <button class="bnav-btn" data-screen="reports">
      <span class="bnav-icon">📊</span>
      <span data-i18n="nav.reports">REPORTS</span>
    </button>
    <button class="bnav-btn" data-screen="leads">
      <span class="bnav-icon">👥</span>
      <span data-i18n="nav.leads">LEADS</span>
    </button>
    <button class="bnav-btn" data-screen="settings">
      <span class="bnav-icon">⚙</span>
      <span data-i18n="nav.settings">SETTINGS</span>
    </button>
  </nav>

  <div id="auth-screen"></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" hidden></div>

  <script src="shell.js"></script>
  <script src="masters.js"></script>
  <script src="masters-ui.js"></script>
  <script src="customers.js"></script>
  <script src="customers-ui.js"></script>
  <script src="pipeline-ui.js"></script>
  <script src="reports.js"></script>
  <script src="reports-ui.js"></script>
  <script src="comms.js"></script>
  <script src="comms-ui.js"></script>
  <script src="charts.js"></script>
  <script src="targets.js"></script>
  <script src="footfall.js"></script>
  <script src="photo.js"></script>
  <script src="dpdp.js"></script>
  <script src="i18n.js"></script>
  <script>
"use strict";

// =====================================================================
// Constants + helpers
// =====================================================================

function uuid()  { return "g" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function uid()   { return "NP-" + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,4).toUpperCase(); }
function today() { return new Date().toISOString().slice(0, 10); }
function nowTime() {
  const d = new Date();
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}
function fmtDateLong(iso) {
  try {
    return new Date(iso).toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  } catch { return iso; }
}
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}
function initials(name) {
  return String(name || "??").trim().split(/\s+/).slice(0,2).map(w => w[0]?.toUpperCase() || "").join("") || "??";
}
function daysAgo(iso) {
  const t = new Date(iso).getTime();
  if (isNaN(t)) return "";
  const d = Math.round((Date.now() - t) / (24*60*60*1000));
  if (d <= 0) return "today";
  if (d === 1) return "yesterday";
  return d + " days ago";
}
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.hidden = false;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => {
    el.classList.remove("show");
    setTimeout(() => { el.hidden = true; }, 200);
  }, 2200);
}

// Mobile formatter: "98765 43210" while typing, raw is 10 digits
function formatMobile(raw) {
  const d = String(raw || "").replace(/\D/g, "").slice(0, 10);
  if (d.length <= 5) return d;
  return d.slice(0, 5) + " " + d.slice(5);
}
function rawMobile(s) { return String(s || "").replace(/\D/g, "").slice(0, 10); }
function isValidMobile(raw) { return /^[6-9]\d{9}$/.test(raw); }

// =====================================================================
// Storage + migration
// =====================================================================

// In-memory canonical serialized state — the real synchronous working copy.
// The durable Capacitor Filesystem file is the PRIMARY persistence (no ~5MB
// cap; limited only by device storage). localStorage is a best-effort fast
// cache whose write may fail (QuotaExceededError) without breaking the app.
// _stateJson is set at boot from the file (see boot()).
let _stateJson = null;

const Store = {
  load() {
    // Synchronous read from the in-memory canonical copy — fresh parse per call
    // preserves the load→mutate→save isolation the app relies on.
    if (_stateJson != null) {
      try { return JSON.parse(_stateJson); } catch (e) { console.error("state parse", e); }
    }
    // Cold / pre-boot path: try the localStorage cache, then legacy v1, then default.
    try {
      const raw = localStorage.getItem(STATE_KEY);
      if (raw) { _stateJson = raw; return JSON.parse(raw); }
    } catch (e) { console.error("v2 store corrupt", e); }
    let records = [];
    try {
      const legacy = localStorage.getItem(LEGACY_RECORDS_KEY);
      if (legacy) records = JSON.parse(legacy) || [];
    } catch (_) {}
    const def = {
      users: [],
      current_user_id: null,
      my_store: null,
      records: records,
      reminder_enabled: true,
      auditLog: [],
    };
    _stateJson = JSON.stringify(def);
    return def;
  },
  // Adopt a serialized state directly into the in-memory copy (boot hydration).
  _hydrate(json) {
    if (typeof json === "string") {
      try { JSON.parse(json); _stateJson = json; return true; } catch (e) {}
    }
    return false;
  },
  save(s) {
    const json = JSON.stringify(s);
    _stateJson = json;                                 // canonical in-memory truth (uncapped)
    // Durable file = PRIMARY persistence — no ~5MB localStorage ceiling.
    if (window.SaagarShell && window.SaagarShell.durableWrite) window.SaagarShell.durableWrite(json);
    // localStorage = best-effort fast cache. A full cache must never crash a
    // save: the file already has the data and boot prefers the file.
    try { localStorage.setItem(STATE_KEY, json); }
    catch (e) { console.warn("localStorage cache full — relying on durable file", e && e.name); }
  },
  // Serialized byte size of the stored state (Settings storage meter).
  bytes() {
    try { return _stateJson ? new TextEncoder().encode(_stateJson).length : 0; }
    catch (e) { return _stateJson ? _stateJson.length : 0; }
  },
};

// =====================================================================
// Auth — PBKDF2 PIN, users, roles, lockout
// =====================================================================

async function hashPin(pin, salt) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey("raw", enc.encode(pin), { name: "PBKDF2" }, false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: enc.encode(salt), iterations: 100000, hash: "SHA-256" },
    km, 256
  );
  return Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2,"0")).join("");
}
async function verifyPin(pin, salt, expected) { return (await hashPin(pin, salt)) === expected; }
function randomSalt() {
  const a = new Uint8Array(16);
  crypto.getRandomValues(a);
  return Array.from(a).map(b => b.toString(16).padStart(2,"0")).join("");
}

const Users = {
  listAll(s)    { return s.users.slice(); },
  listActive(s) { return s.users.filter(u => u.is_active); },
  byId(s, id)   { return s.users.find(u => u.id === id) || null; },
  async create({ name, role, pin }) {
    const state = Store.load();
    const salt = randomSalt();
    const u = {
      id: uuid(), name, role,
      pin_salt: salt, pin_hash: await hashPin(pin, salt),
      created_at: new Date().toISOString(),
      is_active: true,
    };
    state.users.push(u);
    Store.save(state);
    return u;
  },
  async changePin(userId, newPin) {
    const state = Store.load();
    const u = Users.byId(state, userId);
    if (!u) return false;
    u.pin_salt = randomSalt();
    u.pin_hash = await hashPin(newPin, u.pin_salt);
    Store.save(state);
    return true;
  },
  setActive(userId, active) {
    const state = Store.load();
    const u = Users.byId(state, userId);
    if (!u) return;
    u.is_active = !!active;
    Store.save(state);
  },
  remove(userId) {
    const state = Store.load();
    state.users = state.users.filter(u => u.id !== userId);
    Store.save(state);
  },
};

const AuthSession = {
  current(s) {
    s = s || Store.load();
    if (!s.current_user_id) return null;
    const u = Users.byId(s, s.current_user_id);
    return (u && u.is_active) ? u : null;
  },
  login(userId) {
    const s = Store.load();
    s.current_user_id = userId;
    Store.save(s);
  },
  logout() {
    const s = Store.load();
    s.current_user_id = null;
    Store.save(s);
  },
};

function roleLabel(r) { return { OWNER: "Owner", MANAGER: "Manager", GREETOR: "Greetor" }[r] || r; }
function canManageUsers(auth) { return auth && auth.role === "OWNER"; }
function canEditMasters(auth) { return auth && (auth.role === "OWNER" || auth.role === "MANAGER"); }

// Role capability matrix.
//  GREETOR  → create entries + view own + WhatsApp/call only.
//  MANAGER  → + edit/delete any, convert, move stage, view all, edit masters.
//  OWNER    → + manage users.
const ROLE_PERMS = {
  OWNER:   ["create", "editAny", "deleteAny", "manageLeads", "viewAll", "editMasters", "manageUsers"],
  MANAGER: ["create", "editAny", "deleteAny", "manageLeads", "viewAll", "editMasters"],
  GREETOR: ["create"],
};
// can(perm) — reads the signed-in user. Exposed globally so the UI modules
// (reports-ui / customers-ui / pipeline-ui) can hide privileged buttons.
function can(perm) {
  const auth = AuthSession.current();
  if (!auth) return false;
  return (ROLE_PERMS[auth.role] || []).indexOf(perm) !== -1;
}
window.can = can;
// canSafe — audit R14: a fail-CLOSED variant for the UI modules. The old
// `!window.can || window.can(x)` idiom fails OPEN if can is ever missing
// (shows privileged buttons). canSafe returns false when can is unavailable.
function canSafe(perm) { return typeof window.can === "function" && window.can(perm); }
window.canSafe = canSafe;

// =====================================================================
// Audit log — immutable record of every data action (esp. deletes).
// Append-only; never edited or cleared from the UI. Owner-only to view.
// =====================================================================
const AUDIT_MAX = 5000;
function logAudit(action, summary, detail) {
  const state = Store.load();
  if (!Array.isArray(state.auditLog)) state.auditLog = [];
  const auth = AuthSession.current(state);
  state.auditLog.unshift({
    id: uuid(),
    at: new Date().toISOString(),
    userId: auth ? auth.id : null,
    userName: auth ? auth.name : "system",
    role: auth ? auth.role : "",
    action: action,                 // create|edit|delete|convert|stage|user|pin
    summary: summary || "",
    detail: detail || null,         // e.g. deleted-record snapshot, old→new stage
  });
  if (state.auditLog.length > AUDIT_MAX) state.auditLog.length = AUDIT_MAX;
  Store.save(state);
}
window.logAudit = logAudit;

const LoginGuard = {
  attempts: 0,
  lockedUntil: 0,
  register(success) {
    if (success) { this.attempts = 0; this.lockedUntil = 0; return; }
    this.attempts++;
    if (this.attempts >= 5) {
      this.lockedUntil = Date.now() + 60 * 1000;
      this.attempts = 0;
    }
  },
  isLocked() { return this.lockedUntil > Date.now(); },
  secondsLeft() { return Math.max(0, Math.ceil((this.lockedUntil - Date.now()) / 1000)); },
};

function stepIsValid(step, d) {
  return missingFields(step, d).length === 0;
}

// Returns the human-readable labels of required fields not yet filled for a
// given wizard step. Drives the "please fill these" popup so the greetor knows
// exactly what's blocking them (instead of a dead, silently-disabled button).
function missingFields(step, d) {
  const miss = [];
  if (step === 1) {
    if (!d.store)     miss.push("Store");
    if (!d.visitDate) miss.push("Visit date");
    if (!d.visitTime) miss.push("Visit time");
  } else if (step === 2) {
    if (!isValidMobile(d.mobile)) miss.push("Mobile number (valid 10 digits)");
  } else if (step === 3) {
    if (!d.category) miss.push("Category");
    if (!d.brand)    miss.push("Brand");
  } else if (step === 4) {
    if (!d.reason) miss.push("Primary reason");
    if (d.followUp === "Yes" && !d.followDate) miss.push("Follow-up date");
  }
  return miss;
}

}

// =====================================================================
// Render — top-level
// =====================================================================

function render() {
  const state = Store.load();

  // Auth gate
  if (state.users.length === 0) {
    showAuthScreen(renderFirstTimeSetup());
    return;
  }
  const auth = AuthSession.current(state);
  if (!auth) {
    showAuthScreen(renderLoginScreen(state));
    return;
  }

  hideAuthScreen();
  $("userInitials").textContent = initials(auth.name);

  // Wizard auto-fills "my store" if set
  if (currentScreen === "capture" && !Wizard.data.store && state.my_store) {
    Wizard.data.store = state.my_store;
  }
  // Wizard auto-fills greetor name with current user
  if (currentScreen === "capture" && !Wizard.data.greetor) {
    Wizard.data.greetor = auth.name;
  }

  const screen = $("screen");
  if (currentScreen === "capture")       screen.innerHTML = renderCapture(state, auth);
  else if (currentScreen === "reports")  screen.innerHTML = window.ReportsUI ? window.ReportsUI.render(state) : "<p class='muted'>Loading…</p>";
  else if (currentScreen === "auditlog") screen.innerHTML = renderAuditLog(state);
  else if (currentScreen === "targets")  screen.innerHTML = renderTargets(state);
  else if (currentScreen === "comms") {
    screen.innerHTML = (window.commsView === "log")
      ? (window.CommsUI ? window.CommsUI.renderLog(state) : "")
      : (window.CommsUI ? window.CommsUI.renderTemplates(state) : "");
  }
  else if (currentScreen === "leads")    screen.innerHTML = renderLeads(state, auth);
  else if (currentScreen === "settings") screen.innerHTML = renderSettings(state, auth);
  else if (currentScreen === "masters") {
    const homeView = (window.mastersView || "home") === "home";
    const backBar = homeView
      ? `<button class="btn btn-ghost" style="padding:10px 0;margin-bottom:4px" data-action="goto-settings">← Settings</button>`
      : "";
    screen.innerHTML = backBar + (window.MastersUI ? window.MastersUI.render(state) : "<p class='muted'>Masters not loaded.</p>");
  }

  // Bottom nav active (masters / audit log / comms are children of settings)
  const navScreen = (currentScreen === "masters" || currentScreen === "auditlog" || currentScreen === "comms" || currentScreen === "targets") ? "settings" : currentScreen;
  document.querySelectorAll(".bnav-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.screen === navScreen)
  );

  // Topbar Back arrow — shown on any drill-down, hidden on the Capture home (step 1).
  const back = $("topbarBack");
  if (back) {
    back.hidden = (currentScreen === "capture" && Wizard.step === 1);
  }
}

function switchScreen(name) {
  currentScreen = name;
  // Switching away from capture mid-wizard keeps the draft (Wizard.data) so the
  // user can return to it. Saving / reset clears it.
  render();
}

// Single source of truth for "go back one level". Used by both the topbar
// Back arrow and the Android hardware back button. Returns true if it handled
// the navigation (false only at the Capture home, so hardware back can exit).
function goBack() {
  if ($("modal-root").innerHTML) { closeModal(); return true; }
  if (currentScreen === "masters") {
    if ((window.mastersView || "home") !== "home") { window.mastersView = "home"; render(); return true; }
    switchScreen("settings"); return true;
  }
  if (currentScreen === "auditlog") { switchScreen("settings"); return true; }
  if (currentScreen === "comms") { switchScreen("settings"); return true; }
  if (currentScreen === "targets") { switchScreen("settings"); return true; }
  if (currentScreen === "leads" && window.leadsView === "customers" && window.leadsCustomerMobile) {
    window.leadsCustomerMobile = ""; render(); return true;
  }
  if (currentScreen === "capture" && Wizard.step > 1) { Wizard.goto(Wizard.step - 1); return true; }
  if (currentScreen !== "capture") { switchScreen("capture"); return true; }
  return false;
}

function renderLoginScreen(state) {

  return `

function renderPinDots() {
  const filled = PinBuf.value.length;
  return `<div class="pin-dots">${[0,1,2,3].map(i => `<div class="pin-dot ${i < filled ? "filled" : ""}"></div>`).join("")}</div>`;
}

function renderPinPad() {
  const keys = [["1","2","3"],["4","5","6"],["7","8","9"],["forgot","0","back"]];
  return `<div class="pin-pad">
    ${keys.flat().map(k => {
      if (k === "back")   return `<button class="pin-key action" data-key="back">⌫</button>`;
      if (k === "forgot") return `<button class="pin-key action" data-key="forgot">Forgot?</button>`;
      return `<button class="pin-key" data-key="${k}">${k}</button>`;
    }).join("")}
  </div>`;
}

async function handlePinKey(k) {
  if (k === "forgot") {
    alert("Forgot PIN?\n\nAsk the Owner to reset it from Settings → Users.\n\nIf you ARE the Owner, you'll need to clear the app's data in Android Settings → Apps → Saagar Greetor → Storage. Restore a JSON backup afterwards to bring entries back.");
    return;
  }
  if (LoginGuard.isLocked() && !document.querySelector("#ownerName")) return;
  if (k === "back") {
    if (PinBuf.value.length > 0) PinBuf.value = PinBuf.value.slice(0, -1);
    render();
    return;
  }
  if (!/^[0-9]$/.test(k)) return;
  if (PinBuf.value.length >= 4) return;
  PinBuf.value += k;
  // Re-render the dots only to keep PIN entry snappy
  const dots = document.querySelector(".pin-dots");
  if (dots) {
    [...dots.querySelectorAll(".pin-dot")].forEach((d, i) =>
      d.classList.toggle("filled", PinBuf.value.length > i));
  }
  if (PinBuf.value.length === 4) setTimeout(onPinComplete, 80);
}

async function onPinComplete() {
  const stage = window._setupStage;
  const pin = PinBuf.value;
  const isSetup = !!document.querySelector("#auth-screen .auth-brand .sub")?.textContent?.includes("FIRST-TIME SETUP");
  if (isSetup) {
    if (stage === "pin") {
      window._setupPin = pin;
      window._setupStage = "confirm";
      PinBuf.reset();
      render();
      return;
    }
    if (stage === "confirm") {
      if (pin !== window._setupPin) {
        PinBuf.value = "";
        const err = $("setupErr");
        if (err) { err.textContent = "PINs don't match. Try again."; err.hidden = false; }
        render();
        setTimeout(() => { window._setupStage = "pin"; PinBuf.reset(); render(); }, 500);
        return;
      }
      const u = await Users.create({ name: window._setupOwnerName, role: "OWNER", pin });
      AuthSession.login(u.id);
      window._setupOwnerName = null;
      window._setupPin = null;
      window._setupStage = null;
      PinBuf.reset();
      toast("Welcome, " + u.name);
      render();
      return;
    }
  }
  // Login
  const select = document.getElementById("loginUser");
  const userId = select ? select.value : window._loginUserId;
  if (!userId) return;
  const state = Store.load();
  const u = Users.byId(state, userId);
  if (!u) return;
  const ok = await verifyPin(pin, u.pin_salt, u.pin_hash);
  LoginGuard.register(ok);
  if (ok) {
    AuthSession.login(u.id);
    PinBuf.reset();
    render();
  } else {
    PinBuf.value = "";
    const err = $("loginErr");
    if (err) {
      err.textContent = LoginGuard.isLocked()
        ? `Locked for ${LoginGuard.secondsLeft()}s.`
        : "Wrong PIN. Try again.";
      err.hidden = false;
    }
    render();
  }
}

function renderWizardHead(step) {
  const titles = ["Visit", "Customer", "Interest", "Reason & follow-up"];
  return `
    <div class="wizard-head">
      <div class="wizard-progress">
        ${[1,2,3,4].map(i => {
          const cls = i < step ? "done" : i === step ? "current" : "";
          return `<div class="wizard-dot ${cls}"></div>`;
        }).join("")}
      </div>
      <div class="wizard-step-label">Step ${step} of 4</div>
      <h1 class="wizard-title">${titles[step-1]}</h1>
    </div>
  `;
}

function renderCapture(state, auth) {
  const step = Wizard.step;
  let body = "";
  if (step === 1) body = renderStep1(state);
  else if (step === 2) body = renderStep2(state);
  else if (step === 3) body = renderStep3(state);
  else if (step === 4) body = renderStep4(state);

  const isLast = step === 4;
  const nextLabel = isLast ? (editingRecordId ? "Update" : "Save") : "Next →";
  const nextAction = isLast ? "save-record" : "wizard-next";

  // Note: the Next/Save button is intentionally NOT disabled. Tapping it with
  // missing fields shows a popup naming them — a dead button confused greetors.
  const saveBar = `
    <div class="savebar">
      ${step > 1
        ? `<button class="btn btn-secondary" data-action="wizard-back">← Back</button>`
        : `<button class="btn btn-ghost" data-action="wizard-reset" style="opacity:0.75">Reset</button>`}
      <button class="btn btn-primary" data-action="${nextAction}">${nextLabel}</button>
    </div>
  `;

  // Quick-capture entry (audit R12): a fast 2-tap log for rush hour / festival
  // days so the captured-walk-in denominator stays honest. Only on step 1 of a
  // fresh capture (not mid-wizard, not editing).
  const quickBtn = (step === 1 && !editingRecordId)
    ? `<button class="btn btn-secondary" data-action="open-quick" style="width:100%;margin-bottom:10px">⚡ Quick log (store + reason only)</button>`
    : "";

  return `<div class="wizard">${quickBtn}${renderWizardHead(step)}${body}</div>${saveBar}`;
}

function quickSave() {
  const state = Store.load();
  const auth = AuthSession.current(state);
  if (!auth) { toast("Sign in first"); return; }

  if (!store || !reason) { showRequiredPopup(["Store", "Reason"].filter(f => (f === "Store" ? !store : !reason))); return; }
  const now = new Date().toISOString();
  const rec = {
    recordId: uid(),
    createdAt: now, updatedAt: now,
    createdByUserId: auth.id, createdByName: auth.name,
    store: store, visitDate: today(), visitTime: nowTime(), source: "Walk-in",
    mobile: "", customerName: "", customerType: "Walk-by",
    category: "", subCategory: "", brand: "", gender: "", occasion: "",
    budget: "", urgency: "", greetor: auth.name, cro: "",
    reason: reason, competitor: "", remarks: "",
    followUp: "No", leadStatus: "Open", followDate: "", followTime: "",

  state.records.unshift(rec);

}

function exportAuditLogCSV() {
  const state = Store.load();
  const log = Array.isArray(state.auditLog) ? state.auditLog : [];
  const esc = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  const header = ["timestamp", "user", "role", "action", "summary"].map(esc).join(",");
  const rows = log.map(e => [e.at, e.userName, e.role, e.action, e.summary].map(esc).join(","));
  const csv = [header].concat(rows).join("\n");
  const filename = `saagar_greetor_audit_${today()}.csv`;
  if (window.SaagarShell && window.SaagarShell.exportFile) {
    window.SaagarShell.exportFile(filename, "text/csv", csv).then(res => {
      if (res && res.ok) toast("Audit log exported.");
      else if (res && !res.cancelled) toast("Export failed.");
    });
    return;
  }
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function dedupMatchesFor(mobile) {
  if (!isValidMobile(mobile)) return [];
  const cutoff = Date.now() - DEDUP_DAYS * 24*60*60*1000;
  const state = Store.load();
  return state.records.filter(r => {
    if (r.mobile !== mobile) return false;
    if (editingRecordId && r.recordId === editingRecordId) return false;
    const t = new Date(r.createdAt || `${r.visitDate}T${r.visitTime || "00:00"}`).getTime();
    return !isNaN(t) && t >= cutoff;
  });
}

function saveRecord() {
  const state = Store.load();
  const auth = AuthSession.current(state);
  if (!auth) { toast("Sign in first"); return; }
  const d = Wizard.data;
  if (!stepIsValid(4, d) || !stepIsValid(3, d) || !stepIsValid(2, d) || !stepIsValid(1, d)) {
    toast("Some required fields are missing.");
    return;
  }
  const now = new Date().toISOString();
  const existing = editingRecordId ? state.records.find(r => r.recordId === editingRecordId) : null;
  const rec = {
    recordId: existing ? existing.recordId : uid(),
    createdAt: existing ? existing.createdAt : now,
    updatedAt: now,
    createdByUserId: existing ? existing.createdByUserId : auth.id,
    createdByName: existing ? existing.createdByName : auth.name,
    store: d.store,
    visitDate: d.visitDate,
    visitTime: d.visitTime,
    source: d.source,
    mobile: d.mobile,
    customerName: d.customerName,
    customerType: d.customerType,
    category: d.category,
    subCategory: d.subCategory,
    brand: d.brand,
    gender: d.gender,
    occasion: d.occasion,
    budget: d.budget,
    urgency: d.urgency,
    greetor: d.greetor || auth.name,
    cro: d.cro,
    reason: d.reason,
    competitor: d.competitor,
    remarks: d.remarks,
    followUp: d.followUp,
    leadStatus: d.leadStatus,
    followDate: d.followUp === "Yes" ? d.followDate : "",
    followTime: d.followUp === "Yes" ? d.followTime : "",
    photos: Array.isArray(d.photos) ? d.photos : [],
    // DPDP: stamp consent timestamp when the user ticked the consent box.
    consent_at: (d.consent === "yes")
      ? ((existing && existing.consent_at) || new Date().toISOString())
      : "",
  };
  if (existing) {
    const i = state.records.findIndex(r => r.recordId === existing.recordId);
    state.records[i] = rec;
  } else {
    state.records.unshift(rec);
  }
  Store.save(state);

  const who = rec.customerName || rec.mobile || "walk-in";
  logAudit(existing ? "edit" : "create",
    (existing ? "Edited entry — " : "Created entry — ") + who + " · " + (rec.store || "") + " · " + (rec.reason || ""),
    { recordId: rec.recordId });

  // Audit R8 (DPDP trail): emit a symmetric consent event when consent state
  // changes, so clearing/ticking the box on edit isn't buried in a generic edit.
  const hadConsent = !!(existing && existing.consent_at);
  const hasConsent = !!rec.consent_at;
  if (hasConsent && !hadConsent) {
    logAudit("consent_granted", "Consent recorded — " + who, { recordId: rec.recordId, at: rec.consent_at });
  } else if (hadConsent && !hasConsent) {
    logAudit("consent_withdrawn", "Consent cleared — " + who, { recordId: rec.recordId });
  }

  if (window.SaagarShell && window.SaagarShell.scheduleFollowupReminder) {
    window.SaagarShell.scheduleFollowupReminder(rec);
  }
  // Audit R17: richer toast around data we own (not OS scheduling we don't);
  // on a NEW capture, drop back to Capture step 1 so the greetor can log the
  // next walk-in immediately. Edits return to Reports (where they came from).
  const fu = (rec.followUp === "Yes" && rec.followDate)
    ? " · follow-up " + rec.followDate + (rec.followTime ? " " + rec.followTime : "")
    : "";
  editingRecordId = null;
  Wizard.reset();
  if (existing) {
    toast("Updated — " + who + fu + ".");
    switchScreen("reports");
  } else {
    toast("Saved — " + who + fu + ".");
    switchScreen("capture");
  }
}

function editRecord(recordId) {
  const state = Store.load();
  const r = state.records.find(x => x.recordId === recordId);
  if (!r) return;
  editingRecordId = recordId;
  Wizard.reset(r);
  // Audit R4: deep-clone the photo refs so removing a photo mid-edit and then
  // backing out without saving doesn't mutate (or delete the files of) the
  // still-saved record. Wizard.reset's Object.assign copied the array by ref.
  Wizard.data.photos = Array.isArray(r.photos) ? r.photos.map(p => Object.assign({}, p)) : [];
  // Map persisted consent_at → wizard's consent checkbox state.
  Wizard.data.consent = r.consent_at ? "yes" : "";
  switchScreen("capture");
}

function deleteRecord(recordId) {
  if (!confirm("Delete this entry?")) return;
  const state = Store.load();
  // Snapshot the record BEFORE deletion so the audit log keeps a full,
  // recoverable copy — nothing silently vanishes.
  const snapshot = state.records.find(r => r.recordId === recordId) || null;
  state.records = state.records.filter(r => r.recordId !== recordId);
  Store.save(state);
  // Audit fix #4 (DPDP): delete the watermarked photo files too — otherwise
  // face/product photos outlive the record and orphan files accumulate in
  // the app's Data dir past the retention window.
  if (snapshot && Array.isArray(snapshot.photos) && window.Photo && window.Photo.remove) {
    snapshot.photos.forEach(function (p) {
      try { window.Photo.remove(p); } catch (_) {}
    });
  }
  if (snapshot) {
    const who = snapshot.customerName || snapshot.mobile || "walk-in";
    logAudit("delete",
      "Deleted entry — " + who + " · " + (snapshot.store || "") + " · " + (snapshot.reason || ""),
      { recordId: recordId, record: snapshot });
  }
  if (window.SaagarShell && window.SaagarShell.cancelFollowupReminder) {
    window.SaagarShell.cancelFollowupReminder(recordId);
  }
  toast("Entry deleted.");
  render();
}

function waCustomer(recordId) {
  const state = Store.load();
  const r = state.records.find(x => x.recordId === recordId);
  if (!r || !/^\d{10}$/.test(r.mobile)) return;
  const storeLabel = r.store || "our store";
  const name = (r.customerName || "").trim();
  const greeting = name ? `Hello ${name}, ` : "Hello, ";
  const fu = r.followDate ? ` We had noted to follow up around ${r.followDate}.` : "";
  const msg = `${greeting}this is from ${storeLabel}.${fu} Thank you for visiting us — do let me know if you'd like help with your selection.`;
  const url = `https://wa.me/91${r.mobile}?text=${encodeURIComponent(msg)}`;
  window.open(url, "_blank", "noopener");
}

async function backupJson() {
  const payload = {
    _format: "saagar_greetor_v2",
    _version: 2,
    _exported_at: new Date().toISOString(),
    app: "Saagar Greetor",
    state: Store.load(),
    staff: loadStaff(),
  };
  const json = JSON.stringify(payload, null, 2);
  const filename = `saagar_greetor_backup_${today()}.json`;
  if (window.SaagarShell && window.SaagarShell.exportFile) {
    const res = await window.SaagarShell.exportFile(filename, "application/json", json);
    if (res && res.ok) toast(res.via === "share" ? "Backup ready — choose Drive to save." : "Backup downloaded.");
    else if (res && !res.cancelled) toast("Backup failed.");
    return;
  }
  // Fallback (older builds without the shell helper)
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function restoreJson() {
  const input = document.createElement("input");
  input.type = "file"; input.accept = "application/json,.json";
  input.addEventListener("change", async () => {
    const file = input.files[0]; if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (parsed && parsed._format === "saagar_greetor_v2" && parsed.state) {
        if (!confirm("Replace current data with this backup?")) return;
        const st = parsed.state;
        // Re-seed all seedable modules so a backup that predates a feature
        // (targets, footfall, comms) still yields a working app immediately —
        // otherwise Reports' targets card silently breaks (audit R7).
        if (window.Masters) window.Masters.ensureSeeded(st);
        if (window.Comms) window.Comms.ensureSeeded(st);
        if (window.Targets) window.Targets.ensureSeeded(st);
        if (window.Footfall) window.Footfall.ensureSeeded(st);
        Store.save(st);
        if (parsed.staff) saveStaff(parsed.staff);
        toast("Backup restored.");
        render();
        return;
      }
      // Legacy bare-array
      if (Array.isArray(parsed)) {
        if (!confirm(`Restore ${parsed.length} legacy records?`)) return;
        const s = Store.load(); s.records = parsed;
        if (window.Masters) window.Masters.ensureSeeded(s);
        if (window.Comms) window.Comms.ensureSeeded(s);
        Store.save(s);
        toast("Legacy records restored.");
        render();
        return;
      }
      toast("Unknown backup format.");
    } catch (e) { toast("Could not read backup."); }
  });
  input.click();
}

document.addEventListener("click", async (e) => {

    await handlePinKey(k.dataset.key);

  }

  if (nav) { switchScreen(nav.dataset.screen); return; }

  // Modal backdrop
  if (e.target.matches("[data-modal-backdrop]")) { closeModal(); return; }

  const a = e.target.closest("[data-action]");
  if (!a) return;
  const action = a.dataset.action;

  // Masters editor actions — delegate to masters-ui.js
  if (action.indexOf("m-") === 0) {
    if (window.MastersUI && window.MastersUI.handleAction(action, a.dataset)) return;
  }
  if (action === "open-masters") {
    window.mastersView = "home";
    switchScreen("masters");
    return;
  }
  if (action === "goto-settings") { switchScreen("settings"); return; }
  if (action === "go-back") { goBack(); return; }
  if (action === "go-home") { switchScreen("capture"); return; }
  if (action === "open-targets") {
    if (!canEditMasters(AuthSession.current())) { toast("Owner/Manager only."); return; }
    switchScreen("targets");
    return;
  }
  if (action === "dpdp-purge-now") {
    if (!window.DPDP || !canManageUsers(AuthSession.current())) return;
    const months = window.DPDP.getRetentionMonths();
    if (!months) { toast("Set a retention window first."); return; }
    if (!confirm("Purge records older than " + months + " months? This cannot be undone (logged to audit).")) return;
    const s = Store.load();
    const res = window.DPDP.runBootPurge(s);
    if (res && res.purged > 0) Store.save(s);
    toast("Purged " + (res ? res.purged : 0) + " record(s).");
    render();
    return;
  }
  if (action === "open-audit-log") {
    if (!canManageUsers(AuthSession.current())) { toast("Owner only."); return; }
    switchScreen("auditlog");
    return;
  }
  if (action === "export-audit-log") { exportAuditLogCSV(); return; }

  // Leads tab — delegate customer/pipeline actions to their UI modules
  if (action.indexOf("c-") === 0) {
    if (window.CustomersUI && window.CustomersUI.handleAction(action, a.dataset)) return;
  }
  if (action.indexOf("p-") === 0) {
    if (window.PipelineUI && window.PipelineUI.handleAction(action, a.dataset)) return;
  }
  if (action.indexOf("r-") === 0) {
    if (window.ReportsUI && window.ReportsUI.handleAction(action, a.dataset)) return;
  }
  // Communication — templates/log screens are host-routed; the rest delegate.
  if (action === "cm-open-templates") {
    if (!canEditMasters(AuthSession.current())) { toast("Owner/Manager only."); return; }
    window.commsView = "templates"; switchScreen("comms"); return;
  }
  if (action === "cm-open-log") { window.commsView = "log"; switchScreen("comms"); return; }
  if (action.indexOf("cm-") === 0) {
    if (window.CommsUI && window.CommsUI.handleAction(action, a.dataset)) return;
  }
  if (action === "leads-view") {
    window.leadsView = a.dataset.view;
    window.leadsCustomerMobile = "";
    render();
    return;
  }
  if (action === "call-customer") {
    const m = (a.dataset.mobile || "").replace(/\D/g, "");
    if (m) window.location.href = "tel:+91" + m;
    return;
  }
  if (action === "open-convert") {
    if (!can("manageLeads")) { toast("Only Owner/Manager can convert a lead."); return; }
    openConvertModal(a.dataset.id);
    return;
  }
  if (action === "save-convert") {
    const val = $("convertValue") ? $("convertValue").value : "";
    const s = Store.load();
    const conv = s.records.find(r => r.recordId === a.dataset.id);
    Customers.convertToSale(s, a.dataset.id, val);
    Store.save(s);
    logAudit("convert",
      "Converted to sale — " + ((conv && (conv.customerName || conv.mobile)) || "walk-in") +
      (Number(val) ? " · " + Customers.formatINR(val) : ""),
      { recordId: a.dataset.id, saleValue: Number(val) || 0 });
    closeModal();
    toast("Marked as converted" + (Number(val) ? " · " + Customers.formatINR(val) : ""));
    if (window.SaagarShell && window.SaagarShell.cancelFollowupReminder) {
      window.SaagarShell.cancelFollowupReminder(a.dataset.id);
    }
    render();
    return;
  }

  // ===== Setup flow =====
  if (action === "setup-name-next") {
    const name = $("ownerName").value.trim();
    const err = $("setupErr");
    if (name.length < 2) { err.textContent = "Enter your name (2+ characters)."; err.hidden = false; return; }
    window._setupOwnerName = name;
    window._setupStage = "pin";
    PinBuf.reset();
    render();
    return;
  }

  // ===== Auth actions =====
  if (action === "logout") {
    if (!confirm("Sign out?")) return;
    AuthSession.logout();
    PinBuf.reset();
    window._loginUserId = null;
    render();
    return;
  }
  if (action === "user-pill") {
    // Quick tap for sign-out from main UI
    if (!confirm("Sign out?")) return;
    AuthSession.logout();
    PinBuf.reset();
    render();
    return;
  }

  // ===== Modal close =====
  if (action === "modal-cancel") { closeModal(); return; }

  // ===== Wizard =====
  if (action === "set-wizard") {
    Wizard.set(a.dataset.field, a.dataset.value);
    render();
    return;
  }
  if (action === "reasons-more") {
    window._reasonsMoreOpen = true;
    render();
    return;
  }
  if (action === "open-quick") { window._quickStore = null; window._quickReason = null; quickCaptureModal(); return; }
  if (action === "quick-pick") {
    if (a.dataset.field === "store") window._quickStore = a.dataset.value;
    else if (a.dataset.field === "reason") window._quickReason = a.dataset.value;
    quickCaptureModal();
    return;
  }
  if (action === "quick-save") { quickSave(); return; }
  if (action === "add-photo") {
    if (!window.Photo) { toast("Camera not available."); return; }
    toast("Opening camera…");
    const ref = await window.Photo.capture({ store: Wizard.data.store, greetor: Wizard.data.greetor });
    if (ref) {
      if (!Array.isArray(Wizard.data.photos)) Wizard.data.photos = [];
      Wizard.data.photos.push(ref);
      render();
    }
    return;
  }
  if (action === "remove-photo") {
    const i = parseInt(a.dataset.i, 10);
    const arr = Wizard.data.photos || [];
    if (i >= 0 && i < arr.length) {
      const ref = arr[i];
      if (window.Photo && window.Photo.remove) { try { window.Photo.remove(ref); } catch (_) {} }
      arr.splice(i, 1);
      render();
    }
    return;
  }
  if (action === "wizard-back") {
    if (Wizard.step > 1) Wizard.goto(Wizard.step - 1);
    return;
  }
  if (action === "wizard-next") {
    const miss = missingFields(Wizard.step, Wizard.data);
    if (miss.length) {
      showRequiredPopup(miss);
      return;
    }
    // Step 2 → check dedup once mobile is entered
    if (Wizard.step === 2) {
      const matches = dedupMatchesFor(Wizard.data.mobile);
      if (matches.length && !window._dedupSeen) {
        window._dedupSeen = Wizard.data.mobile;
        showDedupModal(matches);
        return;
      }
    }
    Wizard.goto(Wizard.step + 1);
    return;
  }
  if (action === "wizard-reset") {
    if (!confirm("Reset the current entry?")) return;
    editingRecordId = null;
    Wizard.reset();
    window._dedupSeen = null;
    window._reasonsMoreOpen = false;
    render();
    return;
  }
  if (action === "save-record") {
    // Validate every step; if anything's missing, jump to the first incomplete
    // step and tell the user exactly what to fill.
    for (let st = 1; st <= 4; st++) {
      const miss = missingFields(st, Wizard.data);
      if (miss.length) {
        if (Wizard.step !== st) Wizard.goto(st);
        showRequiredPopup(miss);
        return;
      }
    }
    // DPDP: block save if mobile + follow-up but no explicit consent.
    if (Wizard.data.mobile && Wizard.data.followUp === "Yes" && Wizard.data.consent !== "yes") {
      if (Wizard.step !== 2) Wizard.goto(2);
      showRequiredPopup(["Customer consent (DPDP) — tick the consent box in step 2"]);
      return;
    }
    saveRecord();
    window._dedupSeen = null;
    window._reasonsMoreOpen = false;
    return;
  }
  if (action === "goto-capture") {
    editingRecordId = null;
    Wizard.reset();
    switchScreen("capture");
    return;
  }
  if (action === "dedup-continue-new") {
    closeModal();
    Wizard.goto(Wizard.step + 1);
    return;
  }
  if (action === "dedup-open-existing") {
    closeModal();
    editRecord(a.dataset.id);
    return;
  }

  // ===== Entry actions (edit/delete gated; greetors can't) =====
  if (action === "edit-entry") {
    if (!can("editAny")) { toast("Only Owner/Manager can edit entries."); return; }
    editRecord(a.dataset.id);
    return;
  }
  if (action === "delete-entry") {
    if (!can("deleteAny")) { toast("Only Owner/Manager can delete entries."); return; }
    deleteRecord(a.dataset.id);
    return;
  }
  if (action === "wa-customer") {
    if (window.CommsUI && window.CommsUI.openSendSheet) window.CommsUI.openSendSheet(a.dataset.id);
    else waCustomer(a.dataset.id);
    return;
  }

  // ===== Settings =====
  if (action === "set-my-store") {
    const state = Store.load();
    state.my_store = a.dataset.value === "(none)" ? null : a.dataset.value;
    Store.save(state);
    toast(state.my_store ? `Default store: ${state.my_store}` : "Default store cleared.");
    render();
    return;
  }
  if (action === "import-staff") {
    const input = document.createElement("input");
    input.type = "file"; input.accept = "application/json,.json";
    input.addEventListener("change", async () => {
      const f = input.files[0]; if (!f) return;
      try {
        const parsed = JSON.parse(await f.text());
        const cros = extractCrosFromBackup(parsed);
        if (!cros.length) { toast("No staff in this backup."); return; }
        if (!confirm(`Import ${cros.length} staff from this backup? Replaces existing list.`)) return;
        saveStaff({ cros, imported_at: new Date().toISOString() });
        toast(`Imported ${cros.length} staff.`);
        render();
      } catch (err) { toast(err.message || "Could not read backup."); }
    });
    input.click();
    return;
  }
  if (action === "clear-staff") {
    if (!confirm("Clear imported staff list?")) return;
    saveStaff({ cros: [], imported_at: null });
    toast("Staff list cleared.");
    render();
    return;
  }
  if (action === "backup-json") { backupJson(); return; }
  if (action === "restore-json") { restoreJson(); return; }
  if (action === "erase-all") {
    if (!confirm("Erase ALL data on this device — users, entries, staff? This cannot be undone.")) return;
    localStorage.removeItem(STATE_KEY);
    localStorage.removeItem(LEGACY_RECORDS_KEY);
    localStorage.removeItem(STAFF_KEY);
    location.reload();
    return;
  }
  if (action === "change-pin") { changePinModal(); return; }
  if (action === "save-pin-change") {
    const cur = $("curPin").value, np = $("newPin").value, npc = $("newPinC").value;
    if (!/^\d{4}$/.test(cur)) { toast("Enter current 4-digit PIN."); return; }
    if (!/^\d{4}$/.test(np)) { toast("New PIN must be 4 digits."); return; }
    if (np !== npc) { toast("PINs don't match."); return; }
    const me = AuthSession.current();
    const ok = await verifyPin(cur, me.pin_salt, me.pin_hash);
    if (!ok) { toast("Current PIN wrong."); return; }
    await Users.changePin(me.id, np);
    closeModal();
    toast("PIN updated.");
    return;
  }

  if (action === "add-user") { addUserModal(); return; }
  if (action === "pick-new-role") {
    document.querySelectorAll('[data-action="pick-new-role"]').forEach(c => c.classList.remove("selected"));
    a.classList.add("selected");
    $("newUserRole").value = a.dataset.role;
    return;
  }
  if (action === "save-new-user") {
    const name = $("newUserName").value.trim();
    const role = $("newUserRole").value;
    const pin = $("newUserPin").value, pinc = $("newUserPinC").value;
    if (name.length < 2) { toast("Name too short."); return; }
    if (!/^\d{4}$/.test(pin)) { toast("PIN must be 4 digits."); return; }
    if (pin !== pinc) { toast("PINs don't match."); return; }
    await Users.create({ name, role, pin });
    logAudit("user", "Added user — " + name + " (" + roleLabel(role) + ")");
    closeModal();
    toast(`${name} added as ${roleLabel(role)}.`);
    render();
    return;
  }

  if (action === "user-menu") { userMenuModal(a.dataset.id); return; }
  if (action === "user-reset-pin") { resetPinModal(a.dataset.id); return; }
  if (action === "save-reset-pin") {
    const np = $("resetPinNew").value, npc = $("resetPinC").value;
    if (!/^\d{4}$/.test(np)) { toast("PIN must be 4 digits."); return; }
    if (np !== npc) { toast("PINs don't match."); return; }
    const _ru = Users.byId(Store.load(), a.dataset.id);
    await Users.changePin(a.dataset.id, np);
    logAudit("pin", "Reset PIN for " + (_ru ? _ru.name : "user"));
    closeModal();
    toast("PIN reset.");
    return;
  }
  if (action === "user-deactivate") {
    const _du = Users.byId(Store.load(), a.dataset.id);
    Users.setActive(a.dataset.id, false);
    logAudit("user", "Deactivated user — " + (_du ? _du.name : "user"));
    closeModal();
    toast("User deactivated.");
    render();
    return;
  }
  if (action === "user-activate") {
    const _au = Users.byId(Store.load(), a.dataset.id);
    Users.setActive(a.dataset.id, true);
    logAudit("user", "Activated user — " + (_au ? _au.name : "user"));
    closeModal();
    toast("User activated.");
    render();
    return;
  }
  if (action === "user-remove") {
    if (!confirm("Remove this user? Their entries stay, but they can't sign in again.")) return;
    const _xu = Users.byId(Store.load(), a.dataset.id);
    Users.remove(a.dataset.id);
    logAudit("user", "Removed user — " + (_xu ? _xu.name : "user"));
    closeModal();
    toast("User removed.");
    render();
    return;
  }
});

async function boot() {
  // 1. Hydrate the in-memory canonical state. PREFER the durable Filesystem
  //    file (uncapped, most complete) over the localStorage cache — so once
  //    the cache hits its ~5MB quota and stops updating, the file still
  //    carries the full, current dataset.
  try {
    let hydrated = false;
    if (window.SaagarShell && window.SaagarShell.durableRead) {
      const fileText = await window.SaagarShell.durableRead();
      if (fileText && Store._hydrate(fileText)) hydrated = true;
    }
    if (!hydrated) {
      const raw = localStorage.getItem(STATE_KEY);
      if (raw) Store._hydrate(raw);
    }
  } catch (e) { console.warn("hydrate skipped", e); }

  // 2. Seed editable masters/comms once (idempotent); also primes the file.
  if (window.Masters || window.Comms || window.Targets || window.Footfall) {
    const _s = Store.load();
    if (window.Masters) window.Masters.ensureSeeded(_s);
    if (window.Comms) window.Comms.ensureSeeded(_s);
    if (window.Targets) window.Targets.ensureSeeded(_s);
    if (window.Footfall) window.Footfall.ensureSeeded(_s);
    Store.save(_s);
  }

  // DPDP retention: prune records past the configured cutoff (no-op if 0).
  if (window.DPDP && window.DPDP.runBootPurge) {
    try {
      const _s = Store.load();
      const res = window.DPDP.runBootPurge(_s);
      if (res && res.purged > 0) {
        Store.save(_s);
        console.log("DPDP: purged " + res.purged + " record(s) older than " + res.cutoff);
      }
    } catch (e) { console.warn("retention purge skipped", e); }
  }

  render();
  applyI18n();
  sweepReminders();

  if (window.SaagarShell && window.SaagarShell.boot) {
    window.SaagarShell.boot({
      // Hardware back shares the exact logic of the topbar Back arrow.
      // Returns false only at the Capture home, letting the shell confirm exit.
      onBack: () => goBack(),
    });
  }
}

boot();
  </script>
</body>
</html>
