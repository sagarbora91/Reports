<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f3a">
  <title>Saagar Greetor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
<style>
:root {
  --navy: #0b1f3a;
  --navy-mid: #132b4c;
  --navy-light: #1c3a66;
  --gold: #c99a2e;
  --gold-light: #e0b85d;
  --white: #ffffff;
  --gray-50: #f9fafb;
  --gray-100: #f3f4f6;
  --gray-200: #e5e7eb;
  --gray-300: #d1d5db;
  --gray-500: #6b7280;
  --gray-700: #374151;
  --gray-800: #1f2937;
  --green: #168a51;
  --green-pale: #eaf8f1;
  --amber: #c77912;
  --amber-pale: #fff8e1;
  --red: #ba2d2d;
  --red-pale: #fff0f0;
  --shadow-sm: 0 1px 3px rgba(11,31,58,0.08);
  --shadow: 0 4px 12px rgba(11,31,58,0.10);
  --shadow-lg: 0 18px 45px rgba(11,31,58,0.18);
  --radius: 14px;
  --radius-sm: 10px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --bnav-height: 64px;
  --topbar-height: 52px;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  color: var(--gray-800);
  background: var(--gray-50);
  overscroll-behavior: none;
}
input, select, textarea, button {
  font-family: inherit;
  font-size: 16px; /* prevents iOS zoom on focus */
}

/* ===================== App shell ===================== */
.topbar {
  position: sticky; top: 0; z-index: 10;
  padding: calc(var(--safe-top) + 8px) 16px 8px;
  background: var(--navy);
  color: var(--white);
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.topbar-left { display: flex; align-items: center; gap: 8px; }
.topbar-back {
  background: rgba(255,255,255,0.14);
  border: 0; color: var(--white);
  width: 36px; height: 36px; border-radius: 9px;
  font-size: 22px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.topbar-back:active { background: rgba(255,255,255,0.26); }
.brand { display: flex; align-items: baseline; gap: 8px; cursor: pointer; }
.brand-serif {
  font-family: 'DM Serif Display', Georgia, serif;
  font-size: 24px;
  color: var(--gold-light);
  letter-spacing: 0.3px;
}
.brand-sans {
  font-size: 10px;
  letter-spacing: 2.5px;
  color: var(--white);
  opacity: 0.85;
  font-weight: 700;
}
.user-pill {
  border: 0;
  background: rgba(255,255,255,0.16);
  color: var(--white);
  width: 38px; height: 38px;
  border-radius: 50%;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.5px;
  cursor: pointer;
}
main#screen {
  padding: 14px 14px calc(var(--bnav-height) + var(--safe-bottom) + 14px);
  min-height: calc(100vh - var(--topbar-height) - var(--bnav-height) - var(--safe-top) - var(--safe-bottom));
}
.bottomnav {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-bottom: var(--safe-bottom);
  background: var(--white);
  border-top: 1px solid var(--gray-200);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  z-index: 9;
  box-shadow: 0 -2px 10px rgba(11,31,58,0.06);
}
.bnav-btn {
  background: transparent; border: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 2px;
  color: var(--gray-500);
  cursor: pointer;
  padding: 10px 4px;
  font-size: 11px; font-weight: 700;
  min-height: var(--bnav-height);
  letter-spacing: 0.3px;
}
.bnav-icon { font-size: 22px; line-height: 1; }
.bnav-btn.active { color: var(--navy); }
/* Bottom nav stays visible during the wizard — the save bar stacks above it. */

/* ===================== Sections / cards ===================== */
.card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
}
.card h2, .card h3 { margin: 0 0 8px; color: var(--navy); }
.card h2 { font-family: 'DM Serif Display', Georgia, serif; font-size: 20px; }
.card h3 { font-size: 15px; }
.card-muted { color: var(--gray-500); font-size: 13px; }

/* ===================== Wizard ===================== */
.wizard {
  /* Clear both the stacked save bar (~66px) and the bottom nav below it. */
  padding-bottom: calc(150px + var(--bnav-height) + var(--safe-bottom));
}
.wizard-head {
  background: var(--white);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}
.wizard-progress {
  display: flex; gap: 4px;
  margin-bottom: 10px;
}
.wizard-dot {
  flex: 1; height: 5px;
  background: var(--gray-200);
  border-radius: 999px;
}
.wizard-dot.done { background: var(--green); }
.wizard-dot.current { background: var(--gold); }
.wizard-step-label {
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--gray-500);
}
.wizard-title {
  font-family: 'DM Serif Display', Georgia, serif;
  font-size: 22px;
  color: var(--navy);
  margin: 4px 0 0;
}

/* ===================== Fields ===================== */
.field {
  background: var(--white);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
}
.field-label {
  display: block;
  font-size: 13px;
  color: var(--gray-700);
  font-weight: 700;
  margin-bottom: 8px;
  letter-spacing: 0.2px;
}
.field-label.required::after { content: ' *'; color: var(--red); }
.field-hint {
  font-size: 12px;
  color: var(--gray-500);
  margin-top: 6px;
}
.field input[type="text"],
.field input[type="tel"],
.field input[type="number"],
.field input[type="date"],
.field input[type="time"],
.field input[type="password"],
.field select,
.field textarea {
  width: 100%;
  border: 1px solid var(--gray-300);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  background: var(--white);
  color: var(--gray-800);
  font-size: 16px;
  outline: none;
  min-height: 44px;
}
.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(201,154,46,0.15);
}
.field textarea { min-height: 90px; resize: vertical; }

.chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  background: var(--gray-100);
  border: 1px solid var(--gray-200);
  color: var(--gray-700);
  padding: 10px 14px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  min-height: 40px;
  min-width: 56px;
  display: inline-flex; align-items: center; justify-content: center;
  user-select: none;
}
.chip.selected {
  background: var(--navy);
  color: var(--white);
  border-color: var(--navy);
}
.chip-more {
  background: transparent;
  border: 1px dashed var(--gray-300);
  color: var(--gray-500);
}

/* ===================== Save bar ===================== */
.savebar {
  position: fixed; left: 0; right: 0;
  /* Sit directly above the bottom nav so both stay reachable. */
  bottom: calc(var(--bnav-height) + var(--safe-bottom));
  padding: 10px 14px;
  background: var(--white);
  border-top: 1px solid var(--gray-200);
  display: grid; gap: 10px;
  grid-template-columns: 1fr 1fr;
  z-index: 8;
  box-shadow: 0 -4px 16px rgba(11,31,58,0.10);
}
.savebar.single-btn { grid-template-columns: 1fr; }

/* ===================== Buttons ===================== */
.btn {
  border: 0;
  border-radius: var(--radius-sm);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.3px;
  cursor: pointer;
  padding: 14px 16px;
  min-height: 48px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-primary {
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  color: #1a1102;
  box-shadow: 0 6px 14px rgba(201,154,46,0.30);
}
.btn-primary:active { transform: translateY(1px); }
.btn-secondary {
  background: var(--white);
  color: var(--navy);
  border: 1px solid var(--gray-300);
}
.btn-ghost {
  background: transparent;
  color: var(--navy);
  border: 0;
}
.btn-danger {
  background: var(--red);
  color: var(--white);
}
.btn-full { width: 100%; }
.btn[disabled] { opacity: 0.45; pointer-events: none; }

/* ===================== Today screen ===================== */
.today-hero {
  background: linear-gradient(135deg, var(--navy), #071529);
  color: var(--white);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  display: flex; align-items: center; justify-content: space-between;
}
.today-count {
  font-family: 'DM Serif Display', Georgia, serif;
  font-size: 48px;
  color: var(--gold-light);
  line-height: 1;
}
.today-label {
  font-size: 11px; letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.7);
  margin-top: 4px;
}
.today-meta { font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 6px; }

.entry-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 8px;
  box-shadow: var(--shadow-sm);
}
.entry-row { display: flex; align-items: center; gap: 10px; }
.entry-name { font-weight: 700; color: var(--navy); flex: 1; font-size: 15px; }
.entry-mobile { font-size: 13px; color: var(--gray-500); font-variant-numeric: tabular-nums; }
.entry-meta {
  margin-top: 6px;
  font-size: 12px;
  color: var(--gray-700);
  display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
}
.entry-actions { display: flex; gap: 6px; margin-top: 10px; }
.entry-action {
  background: var(--gray-100);
  border: 0;
  border-radius: 8px;
  padding: 9px 14px;
  font-size: 13px;
  font-weight: 700;
  color: var(--navy);
  cursor: pointer;
  min-height: 38px;
  flex: 1;
}
.entry-action.wa { background: #25D366; color: var(--white); }
.entry-action.delete { background: var(--red-pale); color: var(--red); flex: 0 0 60px; }

.empty-state {
  text-align: center;
  padding: 40px 16px;
  color: var(--gray-500);
}
.empty-state .icon { font-size: 48px; opacity: 0.4; }
.empty-state h3 { margin: 12px 0 4px; color: var(--navy); }

/* ===================== Pills ===================== */
.pill {
  display: inline-flex; align-items: center;
  border-radius: 999px;
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.3px;
}
.pill-hot { background: var(--red-pale); color: var(--red); }
.pill-warm { background: var(--amber-pale); color: var(--amber); }
.pill-cold, .pill-open { background: var(--gray-100); color: var(--gray-700); }
.pill-converted { background: var(--green-pale); color: var(--green); }
.pill-closed { background: var(--gray-100); color: var(--gray-500); }

/* ===================== Settings ===================== */
.settings-section {
  background: var(--white);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}
.settings-section h3 {
  margin: 0 0 6px;
  font-size: 15px;
  color: var(--navy);
}
.settings-section p { margin: 0 0 12px; font-size: 13px; color: var(--gray-500); }
.settings-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 0;
  border-top: 1px solid var(--gray-100);
}
.settings-row:first-of-type { border-top: 0; }

.role-pill {
  display: inline-block;
  background: var(--navy);
  color: var(--white);
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  margin-left: 6px;
}
.role-pill.OWNER { background: var(--gold); color: #1a1102; }
.role-pill.MANAGER { background: var(--navy); }
.role-pill.GREETOR { background: var(--gray-700); }
.role-pill.inactive { background: var(--gray-300); color: var(--gray-700); }

.user-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0;
  border-top: 1px solid var(--gray-100);
}
.user-row:first-of-type { border-top: 0; }
.user-row .info { flex: 1; }
.user-row .info .name { font-weight: 700; color: var(--navy); }
.user-row .info .meta { font-size: 12px; color: var(--gray-500); margin-top: 2px; }

/* ===================== Modals ===================== */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(11,31,58,0.55);
  backdrop-filter: blur(2px);
  z-index: 1000;
  display: flex; align-items: flex-end;
}
.modal {
  background: var(--white);
  width: 100%;
  border-radius: 20px 20px 0 0;
  padding: 20px 16px calc(16px + var(--safe-bottom));
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: 0 -20px 60px rgba(11,31,58,0.30);
}
.modal-handle {
  width: 40px; height: 4px;
  background: var(--gray-300);
  border-radius: 999px;
  margin: 0 auto 12px;
}
.modal h2 {
  font-family: 'DM Serif Display', Georgia, serif;
  color: var(--navy);
  margin: 0 0 4px;
  font-size: 22px;
}
.modal h3 {
  font-family: 'DM Serif Display', Georgia, serif;
  color: var(--navy);
  margin: 0 0 12px;
  font-size: 18px;
}
.modal-actions {
  display: grid; gap: 10px; grid-template-columns: 1fr 1fr;
  margin-top: 16px;
}
.modal-actions.single { grid-template-columns: 1fr; }

/* ===================== Toast ===================== */
.toast {
  position: fixed;
  left: 50%; transform: translateX(-50%) translateY(80px);
  bottom: calc(var(--bnav-height) + var(--safe-bottom) + 12px);
  background: var(--navy);
  color: var(--white);
  padding: 12px 20px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 8px 24px rgba(11,31,58,0.35);
  opacity: 0;
  transition: all 0.2s ease;
  z-index: 999;
  max-width: 90vw;
  text-align: center;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* ===================== Auth ===================== */
body.locked { overflow: hidden; }
#auth-screen {
  position: fixed; inset: 0;
  background: linear-gradient(180deg, var(--navy), #071529);
  color: var(--white);
  z-index: 5000;
  padding: calc(var(--safe-top) + 24px) 20px calc(var(--safe-bottom) + 20px);
  display: flex; flex-direction: column;
  overflow-y: auto;
}
.auth-brand {
  text-align: center;
  margin-bottom: 24px;
}
.auth-brand .main {
  font-family: 'DM Serif Display', Georgia, serif;
  font-size: 38px;
  color: var(--gold-light);
  line-height: 1;
}
.auth-brand .sub {
  font-size: 11px;
  letter-spacing: 4px;
  opacity: 0.8;
  margin-top: 6px;
  font-weight: 700;
}
.auth-card {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.10);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 12px;
}
.auth-card h2 {
  margin: 0 0 12px;
  font-family: 'DM Serif Display', Georgia, serif;
  font-size: 22px;
  color: var(--white);
}
.auth-card p { font-size: 13px; opacity: 0.8; margin: 0 0 12px; }
.auth-card label {
  display: block;
  font-size: 11px;
  opacity: 0.7;
  margin-bottom: 4px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  font-weight: 700;
}
.auth-card input, .auth-card select {
  width: 100%;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.20);
  color: var(--white);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 16px;
  margin-bottom: 10px;
  outline: none;
  min-height: 44px;
}
.auth-card select option { background: var(--navy); color: var(--white); }
.pin-dots {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin: 18px 0 14px;
}
.pin-dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 2px solid var(--gold-light);
}
.pin-dot.filled { background: var(--gold-light); }
.pin-dots.shake { animation: shake 0.3s; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}
.pin-pad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 12px;
}
.pin-key {
  background: rgba(255,255,255,0.10);
  color: var(--white);
  border: 0;
  border-radius: var(--radius);
  font-size: 24px;
  font-weight: 600;
  padding: 16px;
  cursor: pointer;
  min-height: 58px;
}
.pin-key:active { background: rgba(255,255,255,0.22); transform: translateY(1px); }
.pin-key.action {
  background: rgba(201,154,46,0.18);
  color: var(--gold-light);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.5px;
}
.auth-error {
  background: rgba(186,45,45,0.18);
  border: 1px solid rgba(186,45,45,0.4);
  color: #ffb4b4;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  text-align: center;
  margin-bottom: 10px;
}
.auth-btn-row { display: grid; gap: 10px; margin-top: 12px; }

/* ===================== Dedup ===================== */
.dedup-row {
  background: var(--gray-100);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  margin-bottom: 8px;
  font-size: 13px;
}
.dedup-row strong { color: var(--navy); }
.dedup-row .meta { color: var(--gray-500); font-size: 12px; margin-top: 2px; }

/* ===================== Utility ===================== */
.hidden { display: none !important; }
.muted { color: var(--gray-500); }
.tiny { font-size: 11px; }
.row-spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.spacer-8 { height: 8px; }
.spacer-12 { height: 12px; }
.spacer-24 { height: 24px; }

@media print {
  body { background: white; }
  .topbar, .bottomnav, .savebar, .toast, #modal-root, #auth-screen { display: none !important; }
}
</style>
</head>
<body class="locked">

  <header class="topbar">
    <div class="topbar-left">
      <button class="topbar-back" id="topbarBack" data-action="go-back" aria-label="Back" hidden>←</button>
      <div class="brand" data-action="go-home" role="button" aria-label="Home">
        <span class="brand-serif">Saagar</span>
        <span class="brand-sans">GREETOR</span>
      </div>
    </div>
    <button class="user-pill" id="userPill" data-action="user-pill" aria-label="User menu">
      <span id="userInitials">··</span>
    </button>
  </header>

  <main id="screen"></main>

  <nav class="bottomnav" id="bottomnav">
    <button class="bnav-btn active" data-screen="capture">
      <span class="bnav-icon">＋</span>
      <span data-i18n="nav.capture">CAPTURE</span>
    </button>
    <button class="bnav-btn" data-screen="reports">
      <span class="bnav-icon">📊</span>
      <span data-i18n="nav.reports">REPORTS</span>
    </button>
    <button class="bnav-btn" data-screen="leads">
      <span class="bnav-icon">👥</span>
      <span data-i18n="nav.leads">LEADS</span>
    </button>
    <button class="bnav-btn" data-screen="settings">
      <span class="bnav-icon">⚙</span>
      <span data-i18n="nav.settings">SETTINGS</span>
    </button>
  </nav>

  <div id="auth-screen"></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" hidden></div>

  <script src="shell.js"></script>
  <script src="paginate.js"></script>
  <script src="masters.js"></script>
  <script src="masters-ui.js"></script>
  <script src="customers.js"></script>
  <script src="customers-ui.js"></script>
  <script src="pipeline-ui.js"></script>
  <script src="reports.js"></script>
  <script src="reports-ui.js"></script>
  <script src="comms.js"></script>
  <script src="comms-ui.js"></script>
  <script src="charts.js"></script>
  <script src="targets.js"></script>
  <script src="footfall.js"></script>
  <script src="photo.js"></script>
  <script src="dpdp.js"></script>

// =====================================================================
// Global error safety net — registered FIRST, before any boot/async work.
// The native SQLite plugin rejects its promise on failure; without this a
// fire-and-forget rejection anywhere is an INVISIBLE hang. Now every
// unhandled rejection / error is logged AND shown to the user.
// =====================================================================
window.addEventListener("unhandledrejection", function (ev) {
  var msg = (ev && ev.reason && ev.reason.message) || String(ev && ev.reason);
  console.error("[unhandledrejection]", ev && ev.reason);
  try { if (typeof toast === "function") toast("Unexpected error: " + msg); } catch (_) {}
});
window.addEventListener("error", function (ev) {
  console.error("[window.error]", (ev && (ev.error || ev.message)));
});

  const d = new Date();
  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));

  const t = new Date(iso).getTime();
  if (isNaN(t)) return "";
  const d = Math.round((Date.now() - t) / (24*60*60*1000));

// =====================================================================
// Storage + migration
// =====================================================================
//
// SQLite Phase 3: the DB (window.Repo / window.GreetorDB) is now the source of
// truth for records, users, audit log, comms, targets, footfall and masters.
// The old whole-blob `Store` below is DEMOTED to two jobs only:
//   1. MIGRATION SOURCE — boot() reads Store.load() once to seed the DB on the
//      first SQLite boot (disassemble → bulkInsert), then never reads it again.
//   2. ROLLBACK VALVE — _hydrate/load/bytes stay so a future build can fall back
//      to the durable file if the DB is unavailable.
// App logic NO LONGER reads or writes records/auditLog through Store; it goes
// through Repo + the async data layers. AppState (below) holds the small slice
// the synchronous render auth-gate needs (users + settings), hydrated from the
// DB once at boot.

// In-memory canonical serialized state — the real synchronous working copy.
// The durable Capacitor Filesystem file is the PRIMARY persistence (no ~5MB
// cap; limited only by device storage). localStorage is a best-effort fast
// cache whose write may fail (QuotaExceededError) without breaking the app.
// _stateJson is set at boot from the file (see boot()).
let _stateJson = null;

const Store = {
  load() {
    // Synchronous read from the in-memory canonical copy — fresh parse per call
    // preserves the load→mutate→save isolation the app relies on.
    if (_stateJson != null) {
      try { return JSON.parse(_stateJson); } catch (e) { console.error("state parse", e); }
    }
    // Cold / pre-boot path: try the localStorage cache, then legacy v1, then default.
    try {
      const raw = localStorage.getItem(STATE_KEY);
      if (raw) { _stateJson = raw; return JSON.parse(raw); }
    } catch (e) { console.error("v2 store corrupt", e); }
    let records = [];
    try {
      const legacy = localStorage.getItem(LEGACY_RECORDS_KEY);
      if (legacy) records = JSON.parse(legacy) || [];
    } catch (_) {}
    const def = {
      users: [],
      current_user_id: null,
      my_store: null,
      records: records,
      reminder_enabled: true,
      auditLog: [],
    };
    _stateJson = JSON.stringify(def);
    return def;
  },
  // Adopt a serialized state directly into the in-memory copy (boot hydration).
  _hydrate(json) {
    if (typeof json === "string") {
      try { JSON.parse(json); _stateJson = json; return true; } catch (e) {}
    }
    return false;
  },
  save(s) {
    const json = JSON.stringify(s);
    _stateJson = json;                                 // canonical in-memory truth (uncapped)
    // Durable file = PRIMARY persistence — no ~5MB localStorage ceiling.
    if (window.SaagarShell && window.SaagarShell.durableWrite) window.SaagarShell.durableWrite(json);
    // localStorage = best-effort fast cache. A full cache must never crash a
    // save: the file already has the data and boot prefers the file.
    try { localStorage.setItem(STATE_KEY, json); }
    catch (e) { console.warn("localStorage cache full — relying on durable file", e && e.name); }
  },
  // Serialized byte size of the stored state (Settings storage meter).
  bytes() {
    try { return _stateJson ? new TextEncoder().encode(_stateJson).length : 0; }
    catch (e) { return _stateJson ? _stateJson.length : 0; }
  },
};

// =====================================================================
// AppState — small in-memory mirror of the DB slice the SYNCHRONOUS render
// auth-gate + settings reads need. Hydrated ONCE at boot from the DB
// (Repo.users.all() + Repo.settings.get()) and refreshed after any
// user/login/settings mutation. This is what lets render()'s auth gate run
// synchronously (no await → no flash of the wrong screen) while everything
// heavier is fetched async.
// =====================================================================
const AppState = {
  users: [],
  current_user_id: null,
  my_store: null,
  reminder_enabled: true,
};

// Pull the latest users + settings from the DB into AppState. Call after any
// mutation that changes users or settings, and once at boot. Never throws —
// a failed refresh leaves the prior AppState in place.
async function refreshAppState() {
  try {
    const [users, settings] = await Promise.all([
      Repo.users.all(),
      Repo.settings.get(),
    ]);
    AppState.users = Array.isArray(users) ? users : [];
    const s = settings || {};
    AppState.current_user_id = s.current_user_id != null ? s.current_user_id : null;
    AppState.my_store = s.my_store != null ? s.my_store : null;
    AppState.reminder_enabled = s.reminder_enabled !== false;
  } catch (e) {
    console.warn("refreshAppState failed", e && e.message || e);
  }
}

// Persist the settings slice of AppState back to the DB (meta('settings')).
// Keeps the exact {current_user_id, my_store, reminder_enabled} shape
// DBSchema.disassemble writes so backup/restore round-trips unchanged.
async function saveSettings() {
  await Repo.settings.set({
    current_user_id: AppState.current_user_id,
    my_store: AppState.my_store,
    reminder_enabled: AppState.reminder_enabled !== false,
  });
}

// =====================================================================
// Auth — PBKDF2 PIN, users, roles, lockout
// =====================================================================

async function hashPin(pin, salt) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey("raw", enc.encode(pin), { name: "PBKDF2" }, false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: enc.encode(salt), iterations: 100000, hash: "SHA-256" },
    km, 256
  );
  return Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2,"0")).join("");
}
async function verifyPin(pin, salt, expected) { return (await hashPin(pin, salt)) === expected; }
function randomSalt() {
  const a = new Uint8Array(16);
  crypto.getRandomValues(a);
  return Array.from(a).map(b => b.toString(16).padStart(2,"0")).join("");
}

// Users — READS are SYNC over AppState.users (hydrated from the DB at boot and
// after every mutation). The optional first arg is accepted for backward-compat
// with old call sites that passed a state object, but it is IGNORED: AppState is
// always the source. MUTATIONS are async (Repo.users.*) then refresh AppState.
const Users = {
  listAll()    { return AppState.users.slice(); },
  listActive() { return AppState.users.filter(u => u.is_active); },
  byId(id) {
    // Tolerate the legacy (state, id) call shape: if the first arg is an object
    // (old `state`), the real id is the second arg.
    if (id === undefined && (typeof arguments[0] === "string" || arguments[0] == null)) id = arguments[0];
    else if (typeof arguments[0] === "object" && arguments[0] !== null) id = arguments[1];
    return AppState.users.find(u => u.id === id) || null;
  },
  async create({ name, role, pin }) {
    const salt = randomSalt();
    const u = {
      id: uuid(), name, role,
      pin_salt: salt, pin_hash: await hashPin(pin, salt),
      created_at: new Date().toISOString(),
      is_active: true,
    };
    await Repo.users.insert(u);
    await refreshAppState();
    return u;
  },
  async changePin(userId, newPin) {
    const u = Users.byId(userId);
    if (!u) return false;
    const salt = randomSalt();
    const hash = await hashPin(newPin, salt);
    await Repo.users.update(userId, { pin_salt: salt, pin_hash: hash });
    await refreshAppState();
    return true;
  },
  async setActive(userId, active) {
    await Repo.users.update(userId, { is_active: !!active });
    await refreshAppState();
  },
  async remove(userId) {
    await Repo.users["delete"](userId);
    await refreshAppState();
  },
};

// AuthSession.current() is SYNC (reads AppState) so the render auth-gate never
// awaits. login/logout persist the current_user_id to meta('settings') via
// Repo, then refresh AppState so the gate sees the change immediately.
const AuthSession = {
  current() {
    if (!AppState.current_user_id) return null;
    const u = Users.byId(AppState.current_user_id);
    return (u && u.is_active) ? u : null;
  },
  async login(userId) {
    AppState.current_user_id = userId;
    await saveSettings();
    await refreshAppState();
  },
  async logout() {
    AppState.current_user_id = null;
    await saveSettings();
    await refreshAppState();
  },
};

function roleLabel(r) { return { OWNER: "Owner", MANAGER: "Manager", GREETOR: "Greetor" }[r] || r; }

// Role capability matrix.
//  GREETOR  → create entries + view own + WhatsApp/call only.
//  MANAGER  → + edit/delete any, convert, move stage, view all, edit masters.
//  OWNER    → + manage users.
const ROLE_PERMS = {
  OWNER:   ["create", "editAny", "deleteAny", "manageLeads", "viewAll", "editMasters", "manageUsers"],
  MANAGER: ["create", "editAny", "deleteAny", "manageLeads", "viewAll", "editMasters"],

// can(perm) — reads the signed-in user. Exposed globally so the UI modules
// (reports-ui / customers-ui / pipeline-ui) can hide privileged buttons.
function can(perm) {
  const auth = AuthSession.current();
  if (!auth) return false;
  return (ROLE_PERMS[auth.role] || []).indexOf(perm) !== -1;
}
window.can = can;
// canSafe — audit R14: a fail-CLOSED variant for the UI modules. The old
// `!window.can || window.can(x)` idiom fails OPEN if can is ever missing
// (shows privileged buttons). canSafe returns false when can is unavailable.
function canSafe(perm) { return typeof window.can === "function" && window.can(perm); }
window.canSafe = canSafe;

// =====================================================================
// Audit log — immutable record of every data action (esp. deletes).
// Append-only; never edited or cleared from the UI. Owner-only to view.
// =====================================================================
// logAudit — ASYNC, DB-backed (Repo.auditLog.insert appends a row, ord ascending;
// the viewer reads newest-first). Builds id/at + who from AuthSession.current().
// Wrapped in try/catch so an audit-write failure NEVER breaks the calling handler
// (the data mutation it records has already happened). Callers fire-and-forget it
// (no await needed) inside their async IIFE; awaiting is also safe.
async function logAudit(action, summary, detail) {
  try {
    const auth = AuthSession.current();
    await Repo.auditLog.insert({
      id: uuid(),
      at: new Date().toISOString(),
      userId: auth ? auth.id : null,
      userName: auth ? auth.name : "system",
      role: auth ? auth.role : "",
      action: action,                 // create|edit|delete|convert|stage|user|pin
      summary: summary || "",
      detail: detail || null,         // e.g. deleted-record snapshot, old→new stage
    });
  } catch (e) {
    console.warn("logAudit failed (non-fatal)", e && e.message || e);
  }
}
window.logAudit = logAudit;

// Returns the human-readable labels of required fields not yet filled for a
// given wizard step. Drives the "please fill these" popup so the greetor knows
// exactly what's blocking them (instead of a dead, silently-disabled button).
function missingFields(step, d) {
  const miss = [];
  if (step === 1) {
    if (!d.store)     miss.push("Store");
    if (!d.visitDate) miss.push("Visit date");
    if (!d.visitTime) miss.push("Visit time");
  } else if (step === 2) {
    if (!isValidMobile(d.mobile)) miss.push("Mobile number (valid 10 digits)");
  } else if (step === 3) {
    if (!d.category) miss.push("Category");
    if (!d.brand)    miss.push("Brand");
  } else if (step === 4) {
    if (!d.reason) miss.push("Primary reason");
    if (d.followUp === "Yes" && !d.followDate) miss.push("Follow-up date");
  }
  return miss;
}

// Shows a blocking "required fields" popup listing what's missing.
function showRequiredPopup(miss) {
  openModal(`
    <h2>Please complete these fields</h2>
    <p class="muted">The following are required before you can continue:</p>
    <ul style="margin:8px 0 4px;padding-left:20px;line-height:1.8">
      ${miss.map(f => `<li><strong>${escapeHtml(f)}</strong></li>`).join("")}
    </ul>
    <div class="modal-actions single">
      <button class="btn btn-primary" data-action="modal-cancel">Got it</button>
    </div>
  `);
}

// =====================================================================
// Render — top-level (ASYNC, concurrency-token guarded)
// =====================================================================
//
// SQLite Phase 3: render() is async. The auth gate at the very top stays
// SYNCHRONOUS (reads AppState, no await) so there is never a flash of the wrong
// screen. Everything after the gate fetches data from the DB (Repo / async data
// layers); a monotonically-increasing token (_rt) makes a slower in-flight
// render abandon its paint if a newer render() has started in the meantime
// (rapid screen switches / inline onchange handlers).
let _rt = 0;
// Tracks the screen whose content is currently painted, so the loading skeleton
// only shows on real navigation (currentScreen change), not in-screen re-renders.
let _lastPainted = null;

async function render() {
  const my = ++_rt;

  // ── SYNC auth gate (AppState only — no await, no flash) ──
  if (AppState.users.length === 0) {
    showAuthScreen(renderFirstTimeSetup());
    return;
  }
  const auth = AuthSession.current();
  if (!auth) {
    showAuthScreen(renderLoginScreen());
    return;
  }

  hideAuthScreen();
  $("userInitials").textContent = initials(auth.name);

  // Wizard auto-fills "my store" if set (sync — AppState)
  if (currentScreen === "capture" && !Wizard.data.store && AppState.my_store) {
    Wizard.data.store = AppState.my_store;
  }
  // Wizard auto-fills greetor name with current user
  if (currentScreen === "capture" && !Wizard.data.greetor) {
    Wizard.data.greetor = auth.name;
  }

  const screen = $("screen");

  // Bottom nav active + Back arrow can be set immediately (sync) — do it before
  // the await so the chrome updates without waiting on data.
  const navScreen = (currentScreen === "masters" || currentScreen === "auditlog" || currentScreen === "comms" || currentScreen === "targets") ? "settings" : currentScreen;
  document.querySelectorAll(".bnav-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.screen === navScreen)
  );
  const back = $("topbarBack");
  if (back) back.hidden = (currentScreen === "capture" && Wizard.step === 1);

  // Loading skeleton: only when NAVIGATING to a different screen (not on an
  // in-screen re-render like a chip tap or wizard step), so the common path
  // never flickers. Cleared by the paint below.
  if (currentScreen !== _lastPainted) {
    screen.innerHTML = `<div class="card"><p class="muted">Loading…</p></div>`;
  }

  // ── per-screen async render ──
  // Screens that paint their OWN DOM element (the UI modules + Leads dispatcher)
  // are awaited directly; screens whose HTML we build here await their data,
  // re-check the token, then set screen.innerHTML.
  try {
    if (currentScreen === "capture") {
      const html = await renderCapture(auth);
      if (my !== _rt) return;
      screen.innerHTML = html;
    } else if (currentScreen === "reports") {
      // Contract: XUI.render() is async and self-paints its own target (#screen).
      // Defensively also paint a returned HTML string if the module returns one.
      if (window.ReportsUI) {
        const out = await window.ReportsUI.render();
        if (my !== _rt) return;
        if (typeof out === "string" && out) screen.innerHTML = out;
      } else { screen.innerHTML = "<p class='muted'>Loading…</p>"; }
    } else if (currentScreen === "auditlog") {
      const html = await renderAuditLog();
      if (my !== _rt) return;
      screen.innerHTML = html;
    } else if (currentScreen === "targets") {
      const html = await renderTargets();
      if (my !== _rt) return;
      screen.innerHTML = html;
    } else if (currentScreen === "comms") {
      if (window.CommsUI) {
        const out = (window.commsView === "log")
          ? await window.CommsUI.renderLog()
          : await window.CommsUI.renderTemplates();
        if (my !== _rt) return;
        if (typeof out === "string" && out) screen.innerHTML = out;
      } else { screen.innerHTML = ""; }
    } else if (currentScreen === "leads") {
      await renderLeads(auth);
    } else if (currentScreen === "settings") {
      const html = await renderSettings(auth);
      if (my !== _rt) return;
      screen.innerHTML = html;
    } else if (currentScreen === "masters") {
      const homeView = (window.mastersView || "home") === "home";
      const backBar = homeView
        ? `<button class="btn btn-ghost" style="padding:10px 0;margin-bottom:4px" data-action="goto-settings">← Settings</button>`
        : "";
      if (window.MastersUI) {
        // Contract: MastersUI.render() self-paints #screen (and may return HTML).
        // Handle both, then prepend the back bar.
        const out = await window.MastersUI.render();
        if (my !== _rt) return;
        if (typeof out === "string" && out) screen.innerHTML = out;
        if (backBar) screen.innerHTML = backBar + screen.innerHTML;
      } else {
        screen.innerHTML = backBar + "<p class='muted'>Masters not loaded.</p>";
      }
    }
    if (my !== _rt) return;
    _lastPainted = currentScreen;
  } catch (e) {
    if (my !== _rt) return;
    console.error("render failed", e);
    screen.innerHTML = "<div class='empty-state'><div class='icon'>⚠️</div><h3>Something went wrong</h3><p class='muted'>Please try again.</p></div>";
    _lastPainted = null;   // force a fresh skeleton on the next attempt
  }
}
window.render = render;

async function switchScreen(name) {
  currentScreen = name;
  // Switching away from capture mid-wizard keeps the draft (Wizard.data) so the
  // user can return to it. Saving / reset clears it.
  await render();
}

// Single source of truth for "go back one level". Used by both the topbar
// Back arrow and the Android hardware back button. Returns true if it handled
// the navigation (false only at the Capture home, so hardware back can exit).
function goBack() {
  if ($("modal-root").innerHTML) { closeModal(); return true; }
  if (currentScreen === "masters") {
    if ((window.mastersView || "home") !== "home") { window.mastersView = "home"; render(); return true; }
    switchScreen("settings"); return true;
  }
  if (currentScreen === "auditlog") { switchScreen("settings"); return true; }
  if (currentScreen === "comms") { switchScreen("settings"); return true; }
  if (currentScreen === "targets") { switchScreen("settings"); return true; }
  if (currentScreen === "leads" && window.leadsView === "customers" && window.leadsCustomerMobile) {
    window.leadsCustomerMobile = ""; render(); return true;
  }
  if (currentScreen === "capture" && Wizard.step > 1) { Wizard.goto(Wizard.step - 1); return true; }
  if (currentScreen !== "capture") { switchScreen("capture"); return true; }
  return false;
}

function renderLoginScreen() {

function renderPinDots() {
  const filled = PinBuf.value.length;
  return `<div class="pin-dots">${[0,1,2,3].map(i => `<div class="pin-dot ${i < filled ? "filled" : ""}"></div>`).join("")}</div>`;
}

function renderPinPad() {
  const keys = [["1","2","3"],["4","5","6"],["7","8","9"],["forgot","0","back"]];
  return `<div class="pin-pad">
    ${keys.flat().map(k => {
      if (k === "back")   return `<button class="pin-key action" data-key="back">⌫</button>`;
      if (k === "forgot") return `<button class="pin-key action" data-key="forgot">Forgot?</button>`;
      return `<button class="pin-key" data-key="${k}">${k}</button>`;
    }).join("")}
  </div>`;
}

async function handlePinKey(k) {
  if (k === "forgot") {
    alert("Forgot PIN?\n\nAsk the Owner to reset it from Settings → Users.\n\nIf you ARE the Owner, you'll need to clear the app's data in Android Settings → Apps → Saagar Greetor → Storage. Restore a JSON backup afterwards to bring entries back.");
    return;
  }
  if (LoginGuard.isLocked() && !document.querySelector("#ownerName")) return;
  if (k === "back") {
    if (PinBuf.value.length > 0) PinBuf.value = PinBuf.value.slice(0, -1);
    await render();
    return;
  }
  if (!/^[0-9]$/.test(k)) return;
  if (PinBuf.value.length >= 4) return;
  PinBuf.value += k;
  // Re-render the dots only to keep PIN entry snappy
  const dots = document.querySelector(".pin-dots");
  if (dots) {
    [...dots.querySelectorAll(".pin-dot")].forEach((d, i) =>
      d.classList.toggle("filled", PinBuf.value.length > i));
  }
  if (PinBuf.value.length === 4) setTimeout(function () {
    // onPinComplete is async and awaits native DB writes (Users.create / login).
    // Observe its rejection so a device-only failure becomes a visible toast +
    // a PIN-entry reset to retry, NOT a silently frozen screen.
    Promise.resolve(onPinComplete()).catch(function (e) {
      console.error("[onPinComplete] FATAL", e);
      try { toast("Setup failed: " + (e && e.message || e)); } catch (_) {}
      try {
        if (window._setupStage === "confirm") window._setupStage = "pin";
        PinBuf.reset();
        Promise.resolve(render()).catch(function () {});
      } catch (_) {}
    });
  }, 80);
}

async function onPinComplete() {
  const stage = window._setupStage;
  const pin = PinBuf.value;
  const isSetup = !!document.querySelector("#auth-screen .auth-brand .sub")?.textContent?.includes("FIRST-TIME SETUP");
  if (isSetup) {
    if (stage === "pin") {
      window._setupPin = pin;
      window._setupStage = "confirm";
      PinBuf.reset();
      await render();
      return;
    }
    if (stage === "confirm") {
      if (pin !== window._setupPin) {
        PinBuf.value = "";
        const err = $("setupErr");
        if (err) { err.textContent = "PINs don't match. Try again."; err.hidden = false; }
        await render();
        setTimeout(async () => { window._setupStage = "pin"; PinBuf.reset(); await render(); }, 500);
        return;
      }
      const u = await Users.create({ name: window._setupOwnerName, role: "OWNER", pin });
      await AuthSession.login(u.id);
      window._setupOwnerName = null;
      window._setupPin = null;
      window._setupStage = null;
      PinBuf.reset();
      toast("Welcome, " + u.name);
      await render();
      return;
    }
  }
  // Login
  const select = document.getElementById("loginUser");
  const userId = select ? select.value : window._loginUserId;
  if (!userId) return;
  const u = Users.byId(userId);
  if (!u) return;
  const ok = await verifyPin(pin, u.pin_salt, u.pin_hash);
  LoginGuard.register(ok);
  if (ok) {
    await AuthSession.login(u.id);
    PinBuf.reset();
    await render();
  } else {
    PinBuf.value = "";
    const err = $("loginErr");
    if (err) {
      err.textContent = LoginGuard.isLocked()
        ? `Locked for ${LoginGuard.secondsLeft()}s.`
        : "Wrong PIN. Try again.";
      err.hidden = false;
    }
    await render();
  }
}

function renderWizardHead(step) {
  const titles = ["Visit", "Customer", "Interest", "Reason & follow-up"];
  return `

      <div class="wizard-progress">
        ${[1,2,3,4].map(i => {

          return `<div class="wizard-dot ${cls}"></div>`;
        }).join("")}
      </div>
      <div class="wizard-step-label">Step ${step} of 4</div>
      <h1 class="wizard-title">${titles[step-1]}</h1>
    </div>
  `;
}

async function renderCapture(auth) {
  const step = Wizard.step;
  let body = "";
  if (step === 1) body = await renderStep1();
  else if (step === 2) body = await renderStep2();
  else if (step === 3) body = await renderStep3();
  else if (step === 4) body = await renderStep4();

  const isLast = step === 4;
  const nextLabel = isLast ? (editingRecordId ? "Update" : "Save") : "Next →";
  const nextAction = isLast ? "save-record" : "wizard-next";

  // Note: the Next/Save button is intentionally NOT disabled. Tapping it with
  // missing fields shows a popup naming them — a dead button confused greetors.
  const saveBar = `
    <div class="savebar">
      ${step > 1
        ? `<button class="btn btn-secondary" data-action="wizard-back">← Back</button>`
        : `<button class="btn btn-ghost" data-action="wizard-reset" style="opacity:0.75">Reset</button>`}
      <button class="btn btn-primary" data-action="${nextAction}">${nextLabel}</button>
    </div>
  `;

  // Quick-capture entry (audit R12): a fast 2-tap log for rush hour / festival
  // days so the captured-walk-in denominator stays honest. Only on step 1 of a
  // fresh capture (not mid-wizard, not editing).
  const quickBtn = (step === 1 && !editingRecordId)
    ? `<button class="btn btn-secondary" data-action="open-quick" style="width:100%;margin-bottom:10px">⚡ Quick log (store + reason only)</button>`
    : "";

  return `<div class="wizard">${quickBtn}${renderWizardHead(step)}${body}</div>${saveBar}`;
}

async function renderAuditLog() {
  // Repo.auditLog.all() returns rows ORDER BY ord (oldest-first append order);

  const all = await Repo.auditLog.all();
  const log = (Array.isArray(all) ? all : []).slice().reverse();
  if (window._auditPage === undefined) window._auditPage = 1;
  const aInfo = window.Paginate ? window.Paginate.page(log, window._auditPage) : { items: log.slice(0, 5), page: 1, pages: 1, total: log.length };
  const rows = log.length
    ? aInfo.items.map(e => {

        return `
          <div class="entry-card">

         <p class="muted">Every create, edit, delete and conversion will appear here.</p></div>`;

      ${log.length ? `<button class="btn btn-secondary btn-full" data-action="export-audit-log">Export audit log CSV</button>
      <button class="btn btn-secondary btn-full" data-action="export-audit-log-pdf">Export audit log PDF</button>` : ""}
    </div>
    ${rows}
  `;
}

async function exportAuditLogCSV() {
  const all = await Repo.auditLog.all();
  const log = (Array.isArray(all) ? all : []).slice().reverse();   // newest-first, like the viewer
  const esc = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  const header = ["timestamp", "user", "role", "action", "summary"].map(esc).join(",");
  const rows = log.map(e => [e.at, e.userName, e.role, e.action, e.summary].map(esc).join(","));
  const csv = [header].concat(rows).join("\n");
  const filename = `saagar_greetor_audit_${today()}.csv`;
  if (window.SaagarShell && window.SaagarShell.exportFile) {
    window.SaagarShell.exportFile(filename, "text/csv", csv).then(res => {
      if (res && res.ok) toast("Audit log exported.");
      else if (res && !res.cancelled) toast("Export failed.");
    });
    return;
  }
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

async function dedupMatchesFor(mobile) {
  if (!isValidMobile(mobile)) return [];
  const cutoff = Date.now() - DEDUP_DAYS * 24*60*60*1000;
  const recs = await Repo.records.byMobile(mobile);   // uses idx_records_mobile
  return recs.filter(r => {
    if (editingRecordId && r.recordId === editingRecordId) return false;
    const t = new Date(r.createdAt || `${r.visitDate}T${r.visitTime || "00:00"}`).getTime();
    return !isNaN(t) && t >= cutoff;
  });
}

async function saveRecord() {
  const auth = AuthSession.current();
  if (!auth) { toast("Sign in first"); return; }
  const d = Wizard.data;
  if (!stepIsValid(4, d) || !stepIsValid(3, d) || !stepIsValid(2, d) || !stepIsValid(1, d)) {
    toast("Some required fields are missing.");
    return;
  }
  const now = new Date().toISOString();
  // Fetch the existing record from the DB (preserves createdAt/createdBy/consent
  // and lets upsert keep its original ord so app-order never reshuffles).
  const existing = editingRecordId ? await Repo.records.byId(editingRecordId) : null;
  const rec = {
    recordId: existing ? existing.recordId : uid(),
    createdAt: existing ? existing.createdAt : now,
    updatedAt: now,
    createdByUserId: existing ? existing.createdByUserId : auth.id,
    createdByName: existing ? existing.createdByName : auth.name,
    store: d.store,
    visitDate: d.visitDate,
    visitTime: d.visitTime,
    source: d.source,
    mobile: d.mobile,
    customerName: d.customerName,
    customerType: d.customerType,
    category: d.category,
    subCategory: d.subCategory,
    brand: d.brand,
    gender: d.gender,
    occasion: d.occasion,
    budget: d.budget,
    urgency: d.urgency,
    greetor: d.greetor || auth.name,
    cro: d.cro,
    reason: d.reason,
    competitor: d.competitor,
    remarks: d.remarks,
    followUp: d.followUp,
    leadStatus: d.leadStatus,
    followDate: d.followUp === "Yes" ? d.followDate : "",
    followTime: d.followUp === "Yes" ? d.followTime : "",
    photos: Array.isArray(d.photos) ? d.photos : [],
    // DPDP: stamp consent timestamp when the user ticked the consent box.
    consent_at: (d.consent === "yes")
      ? ((existing && existing.consent_at) || new Date().toISOString())
      : "",
  };
  // Preserve saleValue/convertedAt on an edit (the wizard never touches them;
  // upsert writes the whole row, so carry them over from the existing record).
  if (existing) {
    if (existing.saleValue != null) rec.saleValue = existing.saleValue;
    if (existing.convertedAt) rec.convertedAt = existing.convertedAt;
  }
  // upsert keeps an existing row's ord (no reshuffle) and appends a new one.
  await Repo.records.upsert(rec);

  const who = rec.customerName || rec.mobile || "walk-in";
  logAudit(existing ? "edit" : "create",
    (existing ? "Edited entry — " : "Created entry — ") + who + " · " + (rec.store || "") + " · " + (rec.reason || ""),
    { recordId: rec.recordId });

  // Audit R8 (DPDP trail): emit a symmetric consent event when consent state
  // changes, so clearing/ticking the box on edit isn't buried in a generic edit.
  const hadConsent = !!(existing && existing.consent_at);
  const hasConsent = !!rec.consent_at;
  if (hasConsent && !hadConsent) {
    logAudit("consent_granted", "Consent recorded — " + who, { recordId: rec.recordId, at: rec.consent_at });
  } else if (hadConsent && !hasConsent) {
    logAudit("consent_withdrawn", "Consent cleared — " + who, { recordId: rec.recordId });
  }

  if (window.SaagarShell && window.SaagarShell.scheduleFollowupReminder) {
    window.SaagarShell.scheduleFollowupReminder(rec);
  }
  // Audit R17: richer toast around data we own (not OS scheduling we don't);
  // on a NEW capture, drop back to Capture step 1 so the greetor can log the
  // next walk-in immediately. Edits return to Reports (where they came from).
  const fu = (rec.followUp === "Yes" && rec.followDate)
    ? " · follow-up " + rec.followDate + (rec.followTime ? " " + rec.followTime : "")
    : "";
  editingRecordId = null;
  Wizard.reset();
  if (existing) {
    toast("Updated — " + who + fu + ".");
    await switchScreen("reports");
  } else {
    toast("Saved — " + who + fu + ".");
    await switchScreen("capture");
  }
}

async function editRecord(recordId) {
  const r = await Repo.records.byId(recordId);
  if (!r) return;
  editingRecordId = recordId;
  Wizard.reset(r);
  // Audit R4: deep-clone the photo refs so removing a photo mid-edit and then
  // backing out without saving doesn't mutate (or delete the files of) the
  // still-saved record. Wizard.reset's Object.assign copied the array by ref.
  Wizard.data.photos = Array.isArray(r.photos) ? r.photos.map(p => Object.assign({}, p)) : [];
  // Map persisted consent_at → wizard's consent checkbox state.
  Wizard.data.consent = r.consent_at ? "yes" : "";
  await switchScreen("capture");
}

async function deleteRecord(recordId) {
  if (!confirm("Delete this entry?")) return;
  // Snapshot the record BEFORE deletion so the audit log keeps a full,
  // recoverable copy — nothing silently vanishes.
  const snapshot = await Repo.records.byId(recordId);
  await Repo.records["delete"](recordId);
  // Audit fix #4 (DPDP): delete the watermarked photo files too — otherwise
  // face/product photos outlive the record and orphan files accumulate in
  // the app's Data dir past the retention window.
  if (snapshot && Array.isArray(snapshot.photos) && window.Photo && window.Photo.remove) {
    snapshot.photos.forEach(function (p) {
      try { window.Photo.remove(p); } catch (_) {}
    });
  }
  if (snapshot) {
    const who = snapshot.customerName || snapshot.mobile || "walk-in";
    logAudit("delete",
      "Deleted entry — " + who + " · " + (snapshot.store || "") + " · " + (snapshot.reason || ""),
      { recordId: recordId, record: snapshot });
  }
  if (window.SaagarShell && window.SaagarShell.cancelFollowupReminder) {
    window.SaagarShell.cancelFollowupReminder(recordId);
  }
  toast("Entry deleted.");
  await render();
}

async function waCustomer(recordId) {

// =====================================================================
// Backup / restore (full state) — DB is the source of truth now.
// =====================================================================

// Tables we own, in the shape DBSchema.assemble/disassemble expects. Used by the
// backup (assemble) and restore/migration (disassemble + bulkInsert) paths.
const DB_TABLES = ["records", "users", "audit_log", "comms_log", "comms_templates", "footfall", "meta"];

// Read every table as RAW rows (ORDER BY ord where the table carries it) and run
// DBSchema.assemble to rebuild the whole-state object — the exact shape the old
// Store.load() returned, so the backup JSON (saagar_greetor_v2) is unchanged.
// NOTE: we use raw Repo.query here (NOT the mapped Repo.* accessors) because
// DBSchema.assemble maps rows→domain itself; passing mapped objects would
// double-map and corrupt the encoding.
async function assembleStateFromDB() {
  const [records, users, audit_log, comms_log, comms_templates, footfall, meta] = await Promise.all([
    Repo.query("SELECT * FROM records ORDER BY ord", []),
    Repo.query("SELECT * FROM users ORDER BY ord", []),
    Repo.query("SELECT * FROM audit_log ORDER BY ord", []),
    Repo.query("SELECT * FROM comms_log ORDER BY ord", []),
    Repo.query("SELECT * FROM comms_templates ORDER BY ord", []),
    Repo.query("SELECT * FROM footfall", []),
    Repo.query("SELECT * FROM meta", []),
  ]);
  return DBSchema.assemble({ records, users, audit_log, comms_log, comms_templates, footfall, meta });
}

// Replace the DB contents with `state` (a whole-state object). Runs inside ONE
// transaction: TRUNCATE every owned table, then bulkInsert the disassembled rows.
// Used by restore and (with an empty DB) the first-boot migration.
async function loadStateIntoDB(state) {
  const tables = DBSchema.disassemble(state);
  await GreetorDB.transaction(async function () {
    for (let i = 0; i < DB_TABLES.length; i++) {
      await Repo.run("DELETE FROM " + DB_TABLES[i], []);
    }
    for (let i = 0; i < DB_TABLES.length; i++) {
      const t = DB_TABLES[i];
      const rows = tables[t] || [];
      if (rows.length) await GreetorDB.bulkInsert(t, rows);
    }
  });
}

async function backupJson() {
  const payload = {
    _format: "saagar_greetor_v2",
    _version: 2,
    _exported_at: new Date().toISOString(),
    app: "Saagar Greetor",
    state: await assembleStateFromDB(),
    staff: loadStaff(),
  };
  const json = JSON.stringify(payload, null, 2);
  const filename = `saagar_greetor_backup_${today()}.json`;
  if (window.SaagarShell && window.SaagarShell.exportFile) {
    const res = await window.SaagarShell.exportFile(filename, "application/json", json);
    if (res && res.ok) toast(res.via === "share" ? "Backup ready — choose Drive to save." : "Backup downloaded.");
    else if (res && !res.cancelled) toast("Backup failed.");
    return;
  }
  // Fallback (older builds without the shell helper)
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function restoreJson() {
  const input = document.createElement("input");
  input.type = "file"; input.accept = "application/json,.json";
  input.addEventListener("change", async () => {
    const file = input.files[0]; if (!file) return;
    try {
      const text = await file.text();
      const parsed = JSON.parse(text);
      if (parsed && parsed._format === "saagar_greetor_v2" && parsed.state) {
        if (!confirm("Replace current data with this backup?")) return;
        // Truncate every owned table and bulk-load the backup's rows (one txn).
        await loadStateIntoDB(parsed.state);
        // Re-seed all seedable modules so a backup that predates a feature
        // (targets, footfall, comms) still yields a working app immediately —
        // otherwise Reports' targets card silently breaks (audit R7). These are
        // async + DB-backed now and idempotent (no-op when already present).
        if (window.Masters) await window.Masters.ensureSeeded();
        if (window.Comms) await window.Comms.ensureSeeded();
        if (window.Targets) await window.Targets.ensureSeeded();
        if (window.Footfall) await window.Footfall.ensureSeeded();
        if (parsed.staff) saveStaff(parsed.staff);
        await refreshAppState();           // settings/users came from the backup
        await Repo.meta.set("migrated", "1"); // a restored DB is already migrated
        toast("Backup restored.");
        await render();
        return;
      }
      // Legacy bare-array of records → wrap in a minimal state and load it.
      if (Array.isArray(parsed)) {
        if (!confirm(`Restore ${parsed.length} legacy records?`)) return;
        await loadStateIntoDB({
          users: [], current_user_id: null, my_store: null,
          records: parsed, reminder_enabled: true, auditLog: [],
        });
        if (window.Masters) await window.Masters.ensureSeeded();
        if (window.Comms) await window.Comms.ensureSeeded();
        await refreshAppState();
        await Repo.meta.set("migrated", "1");
        toast("Legacy records restored.");
        await render();
        return;
      }
      toast("Unknown backup format.");
    } catch (e) { console.error(e); toast("Could not read backup."); }
  });
  input.click();
}

document.addEventListener("click", async (e) => {
  // PIN pad (only when locked)
  const k = e.target.closest("[data-key]");
  if (k && document.body.classList.contains("locked")) {
    await handlePinKey(k.dataset.key);
    return;
  }

  // Bottom nav
  const nav = e.target.closest(".bnav-btn");
  if (nav) { await switchScreen(nav.dataset.screen); return; }

  // Modal backdrop
  if (e.target.matches("[data-modal-backdrop]")) { closeModal(); return; }

  const a = e.target.closest("[data-action]");
  if (!a) return;
  const action = a.dataset.action;

  // Masters editor actions — delegate to masters-ui.js
  if (action.indexOf("m-") === 0) {
    if (window.MastersUI && window.MastersUI.handleAction(action, a.dataset)) return;
  }
  if (action === "open-masters") {
    window.mastersView = "home";
    await switchScreen("masters");
    return;
  }
  if (action === "goto-settings") { await switchScreen("settings"); return; }
  if (action === "go-back") { goBack(); return; }
  if (action === "go-home") { await switchScreen("capture"); return; }
  if (action === "open-targets") {
    if (!canEditMasters(AuthSession.current())) { toast("Owner/Manager only."); return; }
    await switchScreen("targets");
    return;
  }
  if (action === "dpdp-purge-now") {
    if (!window.DPDP || !canManageUsers(AuthSession.current())) return;
    const months = window.DPDP.getRetentionMonths();
    if (!months) { toast("Set a retention window first."); return; }
    if (!confirm("Purge records older than " + months + " months? This cannot be undone (logged to audit).")) return;
    try {
      const res = await window.DPDP.runBootPurge();
      toast("Purged " + (res ? res.purged : 0) + " record(s).");
    } catch (err) { console.error(err); toast("Purge failed."); }
    await render();
    return;
  }
  if (action === "open-audit-log") {
    if (!canManageUsers(AuthSession.current())) { toast("Owner only."); return; }
    await switchScreen("auditlog");
    return;
  }
  if (action === "export-audit-log") { await exportAuditLogCSV(); return; }
  if (action === "audit-page") { window._auditPage = parseInt(a.dataset.page, 10) || 1; await render(); return; }
  if (action === "export-audit-log-pdf") { if (window.ReportEngine) window.ReportEngine.run("audit-log", {}); return; }

  // Leads tab — delegate customer/pipeline actions to their UI modules
  if (action.indexOf("c-") === 0) {
    if (window.CustomersUI && window.CustomersUI.handleAction(action, a.dataset)) return;
  }
  if (action.indexOf("p-") === 0) {
    if (window.PipelineUI && window.PipelineUI.handleAction(action, a.dataset)) return;
  }
  if (action.indexOf("r-") === 0) {
    if (window.ReportsUI && window.ReportsUI.handleAction(action, a.dataset)) return;
  }
  // PDF report picker/preview — rep-* actions (note: "rep-" does not match "r-").
  if (action.indexOf("rep-") === 0) {
    if (window.ReportUI && window.ReportUI.handleAction(action, a.dataset)) return;
  }
  // Communication — templates/log screens are host-routed; the rest delegate.
  if (action === "cm-open-templates") {

  if (action === "delete-entry") {

    if (!confirm("Clear imported staff list?")) return;

    return;

  if (action === "backup-json") { await backupJson(); return; }
  if (action === "restore-json") { restoreJson(); return; }
  if (action === "clear-records") {
    if (!can("deleteAny")) { toast("Owner/Manager only."); return; }

    } catch (_) {}
    if (!confirm(`Delete all ${recCount.toLocaleString()} walk-in records, audit log, communications log, and footfall data?\n\nUser accounts, masters, and templates are kept.\n\nThis cannot be undone — back up first.`)) return;
    try {
      // Delete activity data tables but keep users, meta (masters/settings) and comms_templates.
      await GreetorDB.transaction(async () => {

  if (action === "erase-all") {
    if (!confirm("Erase ALL data on this device — users, entries, staff? This cannot be undone.")) return;

    try {
      await loadStateIntoDB({ users: [], current_user_id: null, my_store: null, records: [], reminder_enabled: true, auditLog: [] });
      await Repo.meta.set("migrated", "");

  if (action === "save-new-user") {

  if (action === "user-menu") { userMenuModal(a.dataset.id); return; }
  if (action === "user-reset-pin") { resetPinModal(a.dataset.id); return; }

    const _ru = Users.byId(a.dataset.id);

  if (action === "user-deactivate") {

// =====================================================================
// Boot
// =====================================================================

// Persist the verified pre-migration JSON backup durably so the move is provably
// recoverable. Best-effort over two channels:
//   1. NATIVE durable Filesystem file under a DEDICATED name (so it never
//      clobbers the live state file). Survives localStorage eviction; app-private
//      (cleared only on uninstall, where the user's Drive backup is the valve).
//   2. A stamped + a "latest" localStorage copy under dedicated keys, as a
//      second on-device copy.
// The live durable state file already holds the same source state (it WAS the
// migration source via durableRead at boot), so even if both channels below are
// unavailable the previous data is not lost. Boot only WARNs on failure because
// the migration itself was already verified before we reach here.
async function persistMigrationBackup(backupJson) {
  if (typeof backupJson !== "string" || !backupJson.length) return;
  // Channel 1: dedicated durable file on native (silent; app Data directory).
  try {
    const cap = window.Capacitor;
    const FS = cap && cap.Plugins && cap.Plugins.Filesystem;
    if (cap && typeof cap.isNativePlatform === "function" && cap.isNativePlatform() && FS) {
      await FS.writeFile({
        path: "saagar_greetor_migration_backup.json",
        data: backupJson,
        directory: "DATA",
        encoding: "utf8",
      });
    }
  } catch (e) {
    console.warn("[migrate] durable backup file write failed", e && (e.message || e));
  }
  // Channel 2: dedicated localStorage copies (best-effort; over-quota/eviction
  // must never crash boot, hence the try/catch).
  try {
    const key = "saagar_greetor_migration_backup_" + today();
    localStorage.setItem(key, backupJson);
    localStorage.setItem("saagar_greetor_migration_backup_latest", backupJson);
  } catch (e) {
    console.warn("[migrate] could not cache migration backup in localStorage", e && e.name);
  }
}

// Renders a NON-FATAL "migration failed but your data is safe" card. The DB was
// rolled back to empty and 'migrated' was left unset, so the previous data is
// still intact in the JSON backup (and in the prior build's storage); the next
// boot will retry the migration. We halt boot after showing this so the user
// never starts entering data into the empty, rolled-back DB.
function showMigrationFailedCard(e) {
  try { document.body.classList.remove("locked"); } catch (_) {}
  const auth = $("auth-screen"); if (auth) { auth.style.display = "none"; auth.innerHTML = ""; }
  const screen = $("screen");
  if (screen) {
    screen.innerHTML = `
      <div class="empty-state" style="padding:48px 16px">
        <div class="icon">🛟</div>
        <h3>Migration paused — your data is safe</h3>
        <p class="muted">Importing your existing data into the new storage was rolled back because a safety check did not pass. Nothing was changed or lost.</p>
        <p class="muted" style="margin-top:12px">A JSON backup of your previous data is safe. Please restart the app to retry. If this keeps happening, reinstall the prior build, export a JSON backup, then restore it into this build.</p>
        <p class="muted" style="margin-top:12px;font-size:12px;opacity:.8">Details: ${escapeHtml((e && (e.message || e)) || "Unknown error")}</p>
      </div>`;
  }
}

// Renders a fatal error card into #screen (used when the DB can't open — the
// app is non-functional without it now that the DB is the source of truth).
function showFatalDbError(e) {
  try { document.body.classList.remove("locked"); } catch (_) {}
  const auth = $("auth-screen"); if (auth) { auth.style.display = "none"; auth.innerHTML = ""; }
  const screen = $("screen");
  if (screen) {
    screen.innerHTML = `
      <div class="empty-state" style="padding:48px 16px">
        <div class="icon">⚠️</div>
        <h3>Couldn't open the database</h3>
        <p class="muted">${escapeHtml((e && (e.message || e)) || "Unknown error")}</p>
        <p class="muted" style="margin-top:12px">Please restart the app. If this keeps happening, reinstall the previous build, export a JSON backup, then restore into this build.</p>
      </div>`;
  }
}

async function boot() {
  // 1. Open the DB — FATAL now (the DB is the source of truth). On failure show
  //    an error card and stop; do NOT fall back to the old Store silently.
  try {
    await GreetorDB.open();
    console.log("[GreetorDB] open OK — isNative=" + GreetorDB.isNative + " isEncrypted=" + GreetorDB.isEncrypted);
    if (GreetorDB.isNative && !GreetorDB.isEncrypted) {
      console.warn("[GreetorDB] WARNING: native build is NOT encrypted — investigate.");
    }
  } catch (e) {
    console.error("[GreetorDB] FATAL open failure", e);
    showFatalDbError(e);
    return;
  }

  // 2. Hydrate the OLD Store from the durable file / localStorage cache — this is
  //    the MIGRATION SOURCE only (never written back to in app logic). Prefer the
  //    durable Filesystem file (uncapped, most complete) over the localStorage cache.
  try {
    let hydrated = false;
    if (window.SaagarShell && window.SaagarShell.durableRead) {
      const fileText = await window.SaagarShell.durableRead();
      if (fileText && Store._hydrate(fileText)) hydrated = true;
    }
    if (!hydrated) {
      const raw = localStorage.getItem(STATE_KEY);
      if (raw) Store._hydrate(raw);
    }
  } catch (e) { console.warn("hydrate (migration source) skipped", e); }

  // 3. ONE-TIME migration gate (Phase 4 HARDENED). Migrate the old whole-blob
  //    Store into the DB iff:
  //      (a) we haven't migrated before (meta('migrated') !== '1'), AND
  //      (b) the DB is empty (no records AND no users), AND
  //      (c) the old Store actually has data (records or users).
  //    This makes the first SQLite boot adopt the existing dataset, and is a
  //    no-op on every later boot and on a clean install.
  //
  //    The actual move is delegated to window.Migrate.run (migrate.js), which
  //    is the safety-proofed core: it builds + VERIFIES a JSON backup BEFORE any
  //    DB write, inserts every table in ONE transaction, then READS BACK every
  //    table and asserts per-table COUNT + content-hash === source. It THROWS on
  //    any mismatch. We only mark 'migrated' here AFTER it returns ok:true, and
  //    only AFTER the returned backup is durably persisted. On throw we roll the
  //    DB back to empty, show a non-fatal "your data is safe" card, and leave
  //    'migrated' unset so the next boot retries from the still-intact Store.
  try {
    const migrated = await Repo.meta.get("migrated");
    if (migrated !== "1") {
      const [dbRecRows, dbUserRows] = await Promise.all([
        Repo.query("SELECT COUNT(*) AS c FROM records", []),
        Repo.query("SELECT COUNT(*) AS c FROM users", []),
      ]);
      const dbEmpty = ((dbRecRows[0] && Number(dbRecRows[0].c)) || 0) === 0 &&
                      ((dbUserRows[0] && Number(dbUserRows[0].c)) || 0) === 0;
      const old = Store.load();
      const oldHasData = (Array.isArray(old.records) && old.records.length > 0) ||
                         (Array.isArray(old.users) && old.users.length > 0);
      if (dbEmpty && oldHasData) {
        console.log("[migrate] adopting legacy Store into SQLite (verified-backup + read-back gate)…");
        let result;
        try {
          // Migrate.run defaults to window.GreetorDB; backup gate + one-txn insert
          // + read-back verification all happen inside. Throws on ANY failure.
          result = await Migrate.run(old);
        } catch (mErr) {
          // VERIFIED FAILURE: roll the DB back to empty so the old Store stays the
          // source of truth and the next boot retries. Do NOT set 'migrated'.
          console.error("[migrate] FAILED — rolling back", mErr);
          try { await Migrate.rollback(); }
          catch (rbErr) { console.error("[migrate] rollback ALSO failed", rbErr); }
          showMigrationFailedCard(mErr);
          return;                          // halt boot; never operate on the empty DB
        }
        // SUCCESS: persist the verified backup durably BEFORE flipping the flag,
        // so the recovery valve exists on disk even if the very next step dies.
        try { await persistMigrationBackup(result.backup); }
        catch (bErr) { console.warn("[migrate] backup persist warning", bErr && bErr.message || bErr); }
        const recN = (result.counts && result.counts.records) || 0;
        const userN = (result.counts && result.counts.users) || 0;
        console.log("[migrate] verified OK: " + recN + " records, " + userN + " users (read-back hashes matched).");
      }
      // Only reached when migration either succeeded (ok:true above) or there was
      // nothing to migrate (clean install / DB already populated). Safe to flag.
      await Repo.meta.set("migrated", "1");
    }
  } catch (e) {
    console.error("[migrate] gate FAILED", e);
    showFatalDbError(e);
    return;
  }

  // 4. Seed editable masters/comms/targets/footfall once (async, DB-backed,
  //    idempotent — no-op when already present, e.g. right after a migration).
  try {
    if (window.Masters) await window.Masters.ensureSeeded();
    if (window.Comms) await window.Comms.ensureSeeded();
    if (window.Targets) await window.Targets.ensureSeeded();
    if (window.Footfall) await window.Footfall.ensureSeeded();
  } catch (e) { console.warn("ensureSeeded skipped", e); }

  // 4b. DEMO seed (demo build only): if a demo dataset is bundled (window.DEMO_SEED
  //     from seed-data.js) and the DB has no records yet, load it straight into
  //     SQLite. Direct bulkInsert bypasses the ~5MB localStorage quota the old
  //     localStorage→migration seed path hit at 1-year scale (~11MB). No-op on
  //     production (seed-data.js absent → window.DEMO_SEED undefined).
  try {
    if (window.DEMO_SEED) {
      const _seedCnt = await Repo.query("SELECT COUNT(*) AS n FROM records", []);
      const _seedN = (_seedCnt && _seedCnt[0] && _seedCnt[0].n) || 0;
      if (!_seedN) {
        const _sm = document.createElement("div");
        _sm.id = "demo-seed-msg";
        _sm.setAttribute("style", "position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#0b1f3a;color:#fff;font:600 16px system-ui,sans-serif;text-align:center;padding:24px;line-height:1.5;");
        _sm.textContent = "Preparing demo data — one-time setup, this may take a few seconds…";
        document.body.appendChild(_sm);
        try { await loadStateIntoDB(window.DEMO_SEED); }
        finally { const _m = document.getElementById("demo-seed-msg"); if (_m && _m.parentNode) _m.parentNode.removeChild(_m); }
      }
    }
  } catch (e) { console.warn("demo seed load skipped", e); }

  // 5. Hydrate AppState (users + settings) from the DB so the sync auth gate works.
  try {
    await refreshAppState();
  } catch (e) { console.error("[boot] refreshAppState FATAL", e); showFatalDbError(e); return; }

  // 6. DPDP retention: prune records past the configured cutoff (no-op if 0).
  //    runBootPurge is async + DB-backed now and logs its own audit event.
  try {
    const res = await DPDP.runBootPurge();
    if (res && res.purged > 0) console.log("DPDP: purged " + res.purged + " record(s) older than " + res.cutoff);
  } catch (e) { console.warn("retention purge skipped", e); }

  // 7. First paint + i18n + reminder sweep.
  try {
    await render();
  } catch (e) { console.error("[boot] render FATAL", e); showFatalDbError(e); return; }
  applyI18n();
  try { await sweepReminders(); } catch (e) { console.warn("[boot] sweepReminders skipped", e && e.message || e); }

  if (window.SaagarShell && window.SaagarShell.boot) {
    window.SaagarShell.boot({
      // Hardware back shares the exact logic of the topbar Back arrow.
      // Returns false only at the Capture home, letting the shell confirm exit.
      onBack: () => goBack(),
    });
  }
}

boot();
  </script>
</body>
</html>
