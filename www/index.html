document.addEventListener('click', async (e) => {
  // Auth pin pad — buttons with data-key, only when locked
  const key = e.target.closest('[data-key]');
  if (key && document.body.classList.contains('locked')) {
    await handlePinKey(key.dataset.key);
    return;
  }

  const t = e.target.closest('[data-tab]');
  if (t) { switchTab(t.dataset.tab); return; }

  const a = e.target.closest('[data-action]');
  if (!a) return;
  const action = a.dataset.action;

  // Auth actions
  if (action === 'logout') {
    if (!confirm(tUi('confirm.sign_out'))) return;
    AuthSession.logout();
    PinBuf.reset();
    window._loginUserId = null;
    render();
    return;
  }
  if (action === 'setup-name-next') {
    const name = document.getElementById('ownerName').value.trim();
    const err = document.getElementById('setupErr');
    if (name.length < 2) {
      err.textContent = 'Please enter your name (2+ characters).';
      err.hidden = false;
      return;
    }
    window._setupOwnerName = name;
    window._setupStage = 'pin';
    PinBuf.reset();
    render();
    return;
  }

  if (action === 'modal-cancel' || action === 'modal-backdrop') { closeModal(); return; }
  if (e.target.matches('[data-modal-backdrop]')) {
    // Strict modals trap backdrop taps (Stage A #3) so the user doesn't lose
    // half-entered work. Honoured unless Sagar's toggled it off in Settings.
    const strictModal = document.querySelector('[data-modal-strict]');
    if (strictModal && !strictModalsDisabled()) return;
    closeModal();
    return;
  }

  // ----- User management (Owner-only mostly) -----
  if (action === 'change-my-pin') { changePinModal(); return; }
  if (action === 'modal-save-my-pin') {
    const cur = document.getElementById('pinCurrent').value;
    const np  = document.getElementById('pinNew').value;
    const npc = document.getElementById('pinNewConfirm').value;
    if (!/^\d{4}$/.test(cur)) { toast(tUi('err.enter_current_pin')); return; }
    if (!/^\d{4}$/.test(np))  { toast(tUi('err.new_pin_4digits')); return; }
    if (np !== npc)           { toast(tUi('err.new_pin_mismatch')); return; }
    const me = AuthSession.current();
    const ok = await verifyPin(cur, me.pin_salt, me.pin_hash);
    if (!ok) { toast(tUi('err.current_pin_wrong')); return; }
    await Users.changePin(me.id, np);
    closeModal();
    toast(tUi('ok.pin_updated'));
    render();
    return;
  }

  if (action === 'add-user') { addUserModal(); return; }
  if (action === 'modal-save-user') {
    const name = document.getElementById('newUserName').value.trim();
    const role = document.getElementById('newUserRole').value;
    const phone = document.getElementById('newUserPhone').value.trim();
    const pin  = document.getElementById('newUserPin').value;
    const pinc = document.getElementById('newUserPinConfirm').value;
    if (name.length < 2)        { toast(tUi('err.name_2chars')); return; }
    if (!/^\d{4}$/.test(pin))   { toast(tUi('err.pin_4digits')); return; }
    if (pin !== pinc)           { toast(tUi('err.pin_mismatch')); return; }
    await Users.create({ name, role, pin, phone });
    closeModal();
    toast(`${name} added as ${roleLabel(role)}`);
    render();
    return;
  }

  if (action === 'ref-sub') {
    RefState.sub = a.dataset.id;
    document.getElementById('tab-reference').innerHTML = renderReferenceTab();
    return;
  }

  if (action === 'set-locale') {
    I18n.set(a.dataset.locale);
    toast(a.dataset.locale === 'mr' ? 'भाषा बदलली' : 'Language changed');
    return;
  }

  // ----- Template Builder -----
  if (action === 'builder-open')  { Builder.open(a.dataset.id); return; }
  if (action === 'builder-close') { Builder.close(); return; }
  if (action === 'builder-new')   { builderNewModal(); return; }
  if (action === 'modal-create-tpl') {
    const name = document.getElementById('newTplName').value.trim();
    const frequency = document.getElementById('newTplFreq').value;
    if (name.length < 2) { toast(tUi('err.give_name')); return; }
    const tpl = Templates.create({ name, frequency });
    closeModal();
    Builder.open(tpl.id);
    return;
  }
  if (action === 'builder-add-section') {
    const tpl = Templates.byId(null, a.dataset.tpl);
    if (!tpl) return;
    tpl.sections = tpl.sections || [];
    tpl.sections.push({ id: 's_' + uuid(), name: 'New section', name_mr: '', critical: false });
    Templates.save(tpl);
    render();
    return;
  }
  if (action === 'builder-del-section') {
    const tpl = Templates.byId(null, a.dataset.tpl);
    if (!tpl) return;
    const inSection = tpl.checkpoints.filter(c => c.section_id === a.dataset.section).length;
    if (!confirm(`Delete this section${inSection ? ` and its ${inSection} point(s)` : ''}?`)) return;
    tpl.sections = tpl.sections.filter(s => s.id !== a.dataset.section);
    tpl.checkpoints = tpl.checkpoints.filter(c => c.section_id !== a.dataset.section);
    Templates.save(tpl);
    render();
    return;
  }
  if (action === 'builder-add-cp')  { builderCpModal(a.dataset.tpl, a.dataset.section, null); return; }
  if (action === 'builder-edit-cp') { builderCpModal(a.dataset.tpl, null, a.dataset.cp); return; }
  if (action === 'modal-save-cp') {
    const tpl = Templates.byId(null, a.dataset.tpl);
    if (!tpl) return;
    const text = document.getElementById('cpText').value.trim();
    if (text.length < 3) { toast(tUi('err.cp_text_short')); return; }
    const sectionId = document.getElementById('cpSection').value;
    const allowsNa = document.getElementById('cpNa').checked;
    const photoReq = document.getElementById('cpPhoto').checked;
    const cpId = a.dataset.cp;
    if (cpId) {
      const cp = tpl.checkpoints.find(c => c.id === cpId);
      if (cp) { cp.text = text; cp.section_id = sectionId; cp.allows_na = allowsNa; cp.photo_required_on_fail = photoReq; }
    } else {
      const maxOrder = tpl.checkpoints.reduce((m, c) => Math.max(m, c.order || 0), 0);
      tpl.checkpoints.push({
        id: 'c_' + uuid(), section_id: sectionId, text, text_mr: '', evidence: '',
        weight: 1, critical: false, allows_na: allowsNa, photo_required_on_fail: photoReq,
        order: maxOrder + 1,
      });
    }
    Templates.save(tpl);
    closeModal();
    render();
    return;
  }
  if (action === 'builder-del-cp') {
    if (!confirm(tUi('confirm.delete_point'))) return;
    const tpl = Templates.byId(null, a.dataset.tpl);
    if (!tpl) return;
    tpl.checkpoints = tpl.checkpoints.filter(c => c.id !== a.dataset.cp);
    Templates.save(tpl);
    render();
    return;
  }
  if (action === 'builder-move-cp') {
    const tpl = Templates.byId(null, a.dataset.tpl);
    if (!tpl) return;
    const cp = tpl.checkpoints.find(c => c.id === a.dataset.cp);
    if (!cp) return;
    const sibs = tpl.checkpoints.filter(c => c.section_id === cp.section_id)
      .sort((x, y) => (x.order || 0) - (y.order || 0));
    const i = sibs.indexOf(cp);
    const j = a.dataset.dir === 'up' ? i - 1 : i + 1;
    if (j < 0 || j >= sibs.length) return;
    const o1 = sibs[i].order || 0, o2 = sibs[j].order || 0;
    sibs[i].order = o2; sibs[j].order = o1;
    Templates.save(tpl);
    render();
    return;
  }
  if (action === 'builder-reset') {
    if (!confirm(tUi('confirm.reset_builtin'))) return;
    Templates.resetToDefault(a.dataset.tpl);
    render();
    toast(tUi('ok.reset_original'));
    return;
  }
  if (action === 'builder-delete') {
    if (!confirm(tUi('confirm.delete_template'))) return;
    Templates.remove(a.dataset.tpl);
    Builder.close();
    toast(tUi('ok.template_deleted'));
    return;
  }
  if (action === 'builder-toggle-active') {
    const tpl = Templates.byId(null, a.dataset.tpl);
    if (!tpl) return;
    tpl.active = !tpl.active;
    Templates.save(tpl);
    render();
    return;
  }

  if (action === 'set-my-phone')   { setPhoneModal(null); return; }
  if (action === 'user-set-phone') { setPhoneModal(a.dataset.id); return; }
  if (action === 'modal-save-phone') {
    const newPhone = document.getElementById('phoneInput').value.trim();
    Users.setPhone(a.dataset.id, newPhone);
    closeModal();
    toast(tUi('ok.phone_updated'));
    render();
    return;
  }

  if (action === 'user-menu')      { userMenuModal(a.dataset.id); return; }
  if (action === 'user-reset-pin') { resetPinModal(a.dataset.id); return; }
  if (action === 'modal-save-reset-pin') {
    const np  = document.getElementById('resetPinNew').value;
    const npc = document.getElementById('resetPinConfirm').value;
    if (!/^\d{4}$/.test(np)) { toast(tUi('err.pin_4digits')); return; }
    if (np !== npc)          { toast(tUi('err.pins_mismatch')); return; }
    await Users.changePin(a.dataset.id, np);
    closeModal();
    toast(tUi('ok.pin_reset'));
    render();
    return;
  }
  if (action === 'user-deactivate') {
    const me = AuthSession.current();
    if (a.dataset.id === me.id) { toast(tUi('hint.cant_deactivate_self')); return; }
    if (!confirm(tUi('confirm.deactivate_user'))) return;
    Users.setActive(a.dataset.id, false);
    closeModal();
    render();
    return;
  }
  if (action === 'user-reactivate') {
    Users.setActive(a.dataset.id, true);
    closeModal();
    render();
    return;
  }

  if (action === 'add-cro')     { addCroModal(); return; }
  if (action === 'modal-save-cro') {
    const name = document.getElementById('croName').value.trim();
    const counter = document.getElementById('croCounter').value;
    if (name.length < 2) { toast(tUi('err.name_short')); return; }
    const state = Store.load();
    state.cros.push({ id: uuid(), name, counter });
    Store.save(state);
    closeModal();
    render();
    return;
  }
  if (action === 'remove-cro') {
    if (!confirm(tUi('confirm.remove_cro'))) return;
    const id = a.dataset.id;
    const state = Store.load();
    state.cros = state.cros.filter(c => c.id !== id);
    Store.save(state);
    render();
    return;
  }

  if (action === 'start-audit') {
    const me = AuthSession.current();
    if (!me) { toast(tUi('err.sign_in_first')); return; }
    const date = document.getElementById('auditDate').value;
    const croIds = Array.from(document.querySelectorAll('.cro-check:checked')).map(el => el.value);
    const err = document.getElementById('startError');
    err.hidden = true;
    if (!date)               { err.textContent = 'Pick a date.'; err.hidden = false; return; }
    if (croIds.length === 0) { err.textContent = 'Select at least one CRO on duty.'; err.hidden = false; return; }
    // Date guard: if the user is auditing a past date, require a written reason.
    let backdateReason = '';
    if (date !== today()) {
      const ta = document.getElementById('backdateReason');
      backdateReason = (ta && ta.value || '').trim();
      if (backdateReason.length < 5) {
        err.textContent = 'Backdated audit — please record a reason (5+ characters).';
        err.hidden = false;
        if (ta) ta.focus();
        return;
      }
    }
    startNewAudit({ date, auditorName: me.name, auditorId: me.id, croIds, backdateReason, templateId: a.dataset.tpl || StartState.templateId });
    render();
    return;
  }

  if (action === 'pick-template') {
    StartState.templateId = a.dataset.id;
    render();
    return;
  }

  if (action === 'start-weekly-audit') {
    const me = AuthSession.current();
    if (!me) { toast(tUi('err.sign_in_first')); return; }
    if (me.role !== 'GM' && me.role !== 'OWNER') {
      toast(tUi('info.weekly_gm_owner'));
      return;
    }
    const week = parseInt(a.dataset.week, 10);
    const year = parseInt(a.dataset.year, 10);
    const dailyPcts = dailyPctsForWeek(week, year, Store.load());
    if (dailyPcts.length < 7) {
      if (!confirm(`Only ${dailyPcts.length} of 7 daily audits are in for week ${week}. Missing days count as 0% in the weekly score. Continue?`)) {
        return;
      }
    }
    startWeeklyAudit({ weekNumber: week, year, gmId: me.id, gmName: me.name, templateId: a.dataset.tpl || 'tpl_weekly' });
    render();
    return;
  }

  if (action === 'mark') {
    const verdict = a.dataset.verdict;
    const state = Store.load();
    const audit = currentAudit(state);
    if (!audit) return;
    const cp = activeCpForAction(audit);
    if (!cp) return;

    if (verdict === 'P')  { markCheckpoint(cp.id, 'P'); window._recheckCpId = null; render(); return; }
    if (verdict === 'F')  { failModal(cp, state.cros.filter(c => audit.cros.includes(c.id))); return; }
    if (verdict === 'NA') { naModal(cp); return; }
    if (verdict === 'SKIP') {
      // SKIP records a result row so nextUnmarkedIndex walks past it on the
      // first pass and routes back to it after all other CPs are decided.
      // Photos / findings on the row are preserved.
      markCheckpoint(cp.id, 'SKIP');
      toast(tUi('hint.skip_revisit'));
      render();
      return;
    }
  }

  if (action === 'add-fail-photo') {
    try {
      // The current checkpoint we're FAILing — its CP id goes on the stamp.
      const state = Store.load();
      const audit = currentAudit(state);
      const cp = audit ? activeCpForAction(audit) : null;
      // Wrapper disables the modal's Save button with a "Saving photo…" label
      // while the 6-8s camera + GPS + canvas window runs, so the user can't
      // submit before the photo lands.
      const dataUrl = await captureWithFeedback(
        { cpId: cp ? cp.id : '' },
        '#failSaveBtn'
      );
      if (!dataUrl) { toast(tUi('hint.photo_not_added')); return; }
      FailDraft.add(dataUrl);
      renderFailPhotoGrid();
      photoAddedToast(dataUrl);
    } catch (err) {
      console.error(err);
      toast(tUi('err.no_photo_capture'));
    }
    return;
  }
  if (action === 'remove-fail-photo') {
    const i = parseInt(a.dataset.index, 10);
    FailDraft.removeAt(i);
    renderFailPhotoGrid();
    return;
  }

  // ----- Per-checkpoint photo button (on the audit checkpoint screen) -----
  if (action === 'add-cp-photo') {
    try {
      const dataUrl = await capturePhotoWithStamp({ cpId: a.dataset.cp });
      if (!dataUrl) { toast(tUi('hint.photo_not_added')); return; }
      // Store the photo in IndexedDB; keep only its small ID in the audit state.
      const id = 'ph_' + uuid();
      await PhotoStore.put(id, dataUrl);
      addPhotoToCheckpoint(a.dataset.cp, id);
      photoAddedToast(dataUrl);
      render();
    } catch (err) {
      console.error(err);
      toast(tUi('err.no_photo_capture'));
    }
    return;
  }
  if (action === 'remove-cp-photo') {
    if (!confirm(tUi('confirm.remove_photo'))) return;
    removePhotoFromCheckpoint(a.dataset.cp, parseInt(a.dataset.i, 10));
    render();
    return;
  }

  if (action === 'modal-save-fail') {
    const finding = document.getElementById('failFinding').value.trim();
    if (finding.length < 5) { toast(tUi('hint.describe_finding')); return; }
    const croId = document.getElementById('failCro').value || null;
    const state = Store.load();
    const audit = currentAudit(state);
    const cp = activeCpForAction(audit);
    if (!cp) return;
    if (cp.photo_required_on_fail && FailDraft.photos.length === 0) {
      toast(tUi('hint.photo_evidence_required'));
      return;
    }
    // FailDraft holds a mix of newly-captured data URLs and pre-existing photo
    // IDs. Persist any data URLs to IndexedDB; store only IDs in the audit.
    const photoIds = [];
    for (const entry of FailDraft.photos) {
      if (isPhotoId(entry)) { photoIds.push(entry); }
      else if (isDataUrl(entry)) { const id = 'ph_' + uuid(); await PhotoStore.put(id, entry); photoIds.push(id); }
    }
    markCheckpoint(cp.id, 'F', { finding, croId, photos: photoIds });
    FailDraft.reset();
    window._recheckCpId = null;
    closeModal();
    render();
    return;
  }
  if (action === 'modal-save-na') {
    const reason = document.getElementById('naReason').value.trim();
    if (reason.length < 3) { toast(tUi('err.add_short_reason')); return; }
    const state = Store.load();
    const audit = currentAudit(state);
    const cp = activeCpForAction(audit);
    if (!cp) return;
    markCheckpoint(cp.id, 'NA', { finding: reason });
    window._recheckCpId = null;
    closeModal();
    render();
    return;
  }

  if (action === 'tab-go') {
    if (a.dataset.tab) switchTab(a.dataset.tab);
    return;
  }
  if (action === 'home-batch-verify') {
    batchVerifyModal();
    return;
  }
  if (action === 'batch-verify-one') {
    // Hand off to the existing spot-check modal. The
    // modal-confirm-verify handler will detect _batchVerifyActive and
    // re-open the batch list when it finishes.
    verifyAuditModal(a.dataset.id);
    return;
  }
  if (action === 'batch-verify-close') {
    window._batchVerifyActive = false;
    closeModal();
    render();
    return;
  }
  if (action === 'resume-draft') {
    // The session flag has already been set when the card rendered, so the
    // next render falls through to renderInProgressAudit.
    render();
    return;
  }
  if (action === 'submit-audit') {
    const state = Store.load();
    const au = currentAudit(state);
    const issues = au ? presubmitIssues(au, state) : [];
    if (issues.length > 0) {
      presubmitWarnModal(issues);
      return;
    }
    runSubmitAudit();
    return;
  }
  if (action === 'submit-audit-force') {
    // User saw the warnings and chose Submit anyway. Stamp a note so the
    // bypass is visible on the audit detail forever.
    const state = Store.load();
    const au = currentAudit(state);
    if (au) {
      const issues = presubmitIssues(au, state);
      if (issues.length) {
        const warningNote = '[Submitted with warnings: ' + issues.map(i => i.text).join('; ') + ']';
        const notesEl = document.getElementById('auditNotes');
        if (notesEl) {
          notesEl.value = ((notesEl.value || '').trim() + '\n' + warningNote).trim();
        } else {
          au.notes = ((au.notes || '').trim() + '\n' + warningNote).trim();
          Store.save(state);
        }
      }
    }
    closeModal();
    runSubmitAudit();
    return;
  }
  if (action === 'cancel-audit') {
    if (!confirm(tUi('confirm.discard_draft'))) return;
    const state = Store.load();
    state.audits = state.audits.filter(x => x.id !== state.current_audit_id);
    state.current_audit_id = null;
    Store.save(state);
    window._croReviewMode = false;
    window._recheckCpId = null;
    window._croReviewReturnTo = null;
    render();
    return;
  }
  if (action === 'next-cro') {
    const state = Store.load();
    const aud = currentAudit(state);
    if (!aud) return;
    aud.current_cro_index = (aud.current_cro_index || 0) + 1;
    Store.save(state);
    render();
    return;
  }
  // Stage B #7 — per-CRO escape hatch.
  if (action === 'recheck-cp') {
    window._recheckCpId = a.dataset.cp;
    render();
    return;
  }
  if (action === 'recheck-cancel') {
    // Bail out of editing one checkpoint without changing its verdict.
    window._recheckCpId = null;
    render();
    return;
  }
  if (action === 'cro-review-done') {
    window._croReviewMode = false;
    window._recheckCpId = null;
    if (window._croReviewReturnTo != null) {
      const state = Store.load();
      const aud = currentAudit(state);
      if (aud) { aud.current_cro_index = window._croReviewReturnTo; Store.save(state); }
      window._croReviewReturnTo = null;
    }
    render();
    return;
  }

  if (action === 'history-view') {
    HistoryView.mode = a.dataset.mode === 'trends' ? 'trends' : 'list';
    document.getElementById('tab-history').innerHTML = renderHistoryTab(Store.load(), AuthSession.current());
    return;
  }
  if (action === 'open-history') {
    const state = Store.load();
    const found = audit(a.dataset.id, state);
    if (found) historyDetailModal(found);
    return;
  }

  // ----- Escalations -----
  if (action === 'esc-send') {
    const state = Store.load();
    const e = Escalations.byId(state, a.dataset.id);
    if (!e) return;
    const recipient = findRecipient(state, e.recipient_role);
    if (!recipient || !recipient.phone) {
      toast(tUi('err.recipient_no_phone'));
      return;
    }
    const link = whatsappLink(recipient.phone, e.message);
    if (!link) { toast(tUi('err.cant_build_wa')); return; }
    const me = AuthSession.current(state);
    Escalations.markSent(a.dataset.id, me ? me.id : null, 'whatsapp');
    // Open WhatsApp via system intent. _blank works in both browser preview
    // and Capacitor WebView.
    window.open(link, '_blank', 'noopener');
    render();
    return;
  }
  if (action === 'esc-dismiss') {
    escalationDismissModal(a.dataset.id);
    return;
  }
  if (action === 'esc-dismiss-pick') {
    const me = AuthSession.current();
    Escalations.dismiss(a.dataset.id, me ? me.id : null, a.dataset.reason || '');
    closeModal();
    toast(tUi('ok.dismissed'));
    render();
    return;
  }
  if (action === 'esc-dismiss-other') {
    const noteEl = document.getElementById('dismissOther');
    const reason = noteEl ? noteEl.value.trim() : '';
    if (reason.length < 3) { toast(tUi('err.add_short_reason')); return; }
    const me = AuthSession.current();
    Escalations.dismiss(a.dataset.id, me ? me.id : null, reason);
    closeModal();
    toast(tUi('ok.dismissed'));
    render();
    return;
  }
  if (action === 'esc-preview') {
    escalationPreviewModal(a.dataset.id);
    return;
  }
  if (action === 'esc-copy') {
    const state = Store.load();
    const e = Escalations.byId(state, a.dataset.id);
    if (!e) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(e.message).then(
        () => toast(tUi('ok.message_copied')),
        () => toast(tUi('err.copy_failed'))
      );
    } else {
      toast(tUi('hint.long_press'));
    }
    return;
  }

  // ----- CAPs -----
  if (action === 'cap-filter') {
    window._capsFilter = a.dataset.filter;
    render();
    return;
  }
  if (action === 'open-cap') {
    capDetailModal(a.dataset.id);
    return;
  }
  if (action === 'add-step') {
    const inp = document.getElementById('capNewStep');
    const text = (inp && inp.value || '').trim();
    if (text.length < 3) { toast(tUi('err.action_step_short')); return; }
    const state = Store.load();
    const c = Caps.byId(state, a.dataset.cap);
    if (!c) return;
    c.action_steps.push({ text, done: false, done_at: null });
    Caps.save(c);
    capDetailModal(c.id); // re-render modal
    return;
  }
  if (action === 'toggle-step') {
    const state = Store.load();
    const c = Caps.byId(state, a.dataset.cap);
    if (!c) return;
    const i = parseInt(a.dataset.i, 10);
    const step = c.action_steps[i];
    if (!step) return;
    step.done = !step.done;
    step.done_at = step.done ? new Date().toISOString() : null;
    Caps.save(c);
    capDetailModal(c.id);
    return;
  }
  if (action === 'remove-step') {
    const state = Store.load();
    const c = Caps.byId(state, a.dataset.cap);
    if (!c) return;
    const i = parseInt(a.dataset.i, 10);
    c.action_steps.splice(i, 1);
    Caps.save(c);
    capDetailModal(c.id);
    return;
  }
  if (action === 'cap-save-edits') {
    const state = Store.load();
    const c = Caps.byId(state, a.dataset.id);
    if (!c) return;
    document.querySelectorAll('.cap-why').forEach(el => {
      c['why' + el.dataset.n] = el.value.trim();
    });
    const rc = document.querySelector('.cap-rootcause');
    if (rc) c.root_cause = rc.value.trim();
    const resp = document.querySelector('.cap-responsible');
    if (resp) c.responsible_user_id = resp.value || null;
    const dl = document.querySelector('.cap-deadline-input');
    if (dl) c.deadline = dl.value || null;
    Caps.save(c);
    closeModal();
    toast(tUi('ok.cap_updated'));
    render();
    return;
  }
  if (action === 'cap-mark-done') {
    const state = Store.load();
    const c = Caps.byId(state, a.dataset.id);
    if (!c) return;
    if (c.action_steps.length === 0 || !c.action_steps.every(s => s.done)) {
      toast(tUi('hint.tick_all_actions'));
      return;
    }
    Caps.markDone(a.dataset.id);
    closeModal();
    toast(tUi('ok.cap_done'));
    render();
    return;
  }
  if (action === 'cap-verify') {
    const me = AuthSession.current();
    if (!me || (me.role !== 'OWNER' && me.role !== 'GM')) {
      toast(tUi('err.only_gm_owner_verify')); return;
    }
    const notes = (prompt(tUi('label.verification_notes')) || '').trim();
    Caps.verify(a.dataset.id, me.id, notes);
    closeModal();
    toast(tUi('ok.cap_verified'));
    render();
    return;
  }
  if (action === 'cap-reject') {
    const me = AuthSession.current();
    if (!me || (me.role !== 'OWNER' && me.role !== 'GM')) {
      toast(tUi('err.only_gm_owner_reject')); return;
    }
    const notes = (prompt(tUi('label.reject_reason')) || '').trim();
    if (notes.length < 3) { toast(tUi('err.reject_needs_reason')); return; }
    Caps.reject(a.dataset.id, me.id, notes);
    closeModal();
    toast(tUi('ok.cap_rejected'));
    render();
    return;
  }
  if (action === 'cap-close') {
    const me = AuthSession.current();
    if (!me || (me.role !== 'OWNER' && me.role !== 'GM')) {
      toast(tUi('err.only_gm_owner_close')); return;
    }
    Caps.close(a.dataset.id, me.id);
    closeModal();
    toast(tUi('ok.cap_closed'));
    render();
    return;
  }
  if (action === 'print-audit') {
    printAudit(a.dataset.id);
    return;
  }
  if (action === 'audit-verify') {
    verifyAuditModal(a.dataset.id);
    return;
  }
  if (action === 'modal-confirm-verify') {
    const state = Store.load();
    const au = audit(a.dataset.id, state);
    if (!au) { toast(tUi('err.audit_not_found')); return; }
    const me = AuthSession.current(state);
    if (!me || (me.role !== 'OWNER' && me.role !== 'GM')) { toast(tUi('err.only_gm_owner_verify')); return; }
    if (au.auditor_id && au.auditor_id === me.id) { toast(tUi('err.cant_verify_own')); return; }
    if (au.status === 'verified') { toast(tUi('info.already_verified')); closeModal(); render(); return; }
    const noteEl = document.getElementById('verifyNote');
    au.status = 'verified';
    au.verifier_id = me.id;
    au.verifier_name = me.name;
    au.verified_at = new Date().toISOString();
    au.verify_note = (noteEl ? noteEl.value : '').trim();
    Store.save(state);
    closeModal();
    toast(tUi('ok.audit_verified'));
    // If the verify started from the batch modal, return to it (with the
    // newly-verified row gone). Otherwise just refresh the page as before.
    if (window._batchVerifyActive) {
      batchVerifyModal();
    } else {
      render();
    }
    return;
  }
  if (action === 'share-audit-wa') {
    shareAuditToWhatsApp(a.dataset.id);
    return;
  }
  if (action === 'export-csv')     { exportCsv(); return; }
  if (action === 'backup-drive')   { backupToDrive(); return; }
  if (action === 'restore-backup') { restoreFromBackup(); return; }
  if (action === 'clear-data') {
    if (!confirm(tUi('confirm.erase_all'))) return;
    localStorage.removeItem(STORE_KEY);
    render();
    switchTab('audit');
    toast(tUi('ok.all_erased'));
    return;
  }
});

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + name));
  // Remember the user's last tab so the next launch lands them where they
  // left off (not on Home, if they've opted into another tab).
  try {
    const state = Store.load();
    if (state.last_tab !== name) {
      state.last_tab = name;
      Store.save(state);
    }
  } catch (_) {}
}

// PIN pad keypress dispatch — runs only while body.locked.
async function handlePinKey(k) {
  if (k === 'forgot') {
    alert(
      'Forgot PIN?\n\n' +
      'Ask the Owner to reset it in Settings → Users.\n\n' +
      'If you ARE the Owner, you\'ll need to erase all data in your phone\'s Settings → Apps → Saagar Audit → Storage → Clear data. ' +
      'Restoring a Drive backup afterwards will bring your audits back.'
    );
    return;
  }
  if (LoginGuard.isLocked() && !document.querySelector('#ownerName')) {
    // Locked from login attempts — ignore numeric input.
    return;
  }
  if (k === 'back') {
    if (PinBuf.value.length > 0) PinBuf.value = PinBuf.value.slice(0, -1);
    render();
    return;
  }
  if (!/^[0-9]$/.test(k)) return;
  if (PinBuf.value.length >= 4) return;
  PinBuf.value += k;
  // Re-render dots only — avoid full render mid-input to keep dropdown selection.
  const dotsEl = document.querySelector('.pin-dots');
  if (dotsEl) {
    [...dotsEl.querySelectorAll('.dot')].forEach((d, i) => {
      d.classList.toggle('filled', PinBuf.value.length > i);
    });
  }
  if (PinBuf.value.length === 4) {
    setTimeout(() => onPinComplete(), 80);
  }
}

async function onPinComplete() {
  const stage = window._setupStage;
  const pin = PinBuf.value;
  // First-time setup flow — detected by "no users yet", not by UI text
  // (the heading is localized, so a string compare would break in Marathi).
  if (Store.load().users.length === 0) {
    if (stage === 'pin') {
      window._setupPin = pin;
      window._setupStage = 'confirm';
      PinBuf.reset();
      render();
      return;
    }
    if (stage === 'confirm') {
      if (pin !== window._setupPin) {
        PinBuf.value = ''; PinBuf.shake = true;
        const err = document.getElementById('setupErr');
        if (err) { err.textContent = 'PINs do not match. Try again.'; err.hidden = false; }
        render();
        setTimeout(() => { PinBuf.shake = false; window._setupStage = 'pin'; PinBuf.reset(); render(); }, 400);
        return;
      }
      const u = await Users.create({ name: window._setupOwnerName, role: 'OWNER', pin });
      AuthSession.login(u.id);
      window._setupOwnerName = null;
      window._setupPin = null;
      window._setupStage = null;
      PinBuf.reset();
      toast(tUi('label.welcome') + ' ' + u.name);
      render();
      return;
    }
  }
  // Login flow
  const select = document.getElementById('loginUser');
  const userId = select ? select.value : window._loginUserId;
  if (!userId) return;
  const state = Store.load();
  const u = Users.byId(state, userId);
  if (!u) return;
  const ok = await verifyPin(pin, u.pin_salt, u.pin_hash);
  LoginGuard.register(ok);
  if (ok) {
    AuthSession.login(u.id);
    PinBuf.reset();
    render();
  } else {
    PinBuf.value = ''; PinBuf.shake = true;
    const err = document.getElementById('loginErr');
    if (err) {
      if (LoginGuard.isLocked()) {
        err.textContent = `Locked for ${LoginGuard.secondsLeft()}s.`;
      } else {
        err.textContent = 'Wrong PIN. Try again.';
      }
      err.hidden = false;
    }
    render();
    setTimeout(() => { PinBuf.shake = false; render(); }, 400);
  }
}

// Keep PIN buffer in sync when user changes login dropdown
document.addEventListener('change', (e) => {
  if (e.target.id === 'loginUser') {
    window._loginUserId = e.target.value;
    PinBuf.reset();
    render();
    return;
  }
  // Stage A #3 — Settings toggle for the strict-modals behaviour. checkbox
  // checked = strict ON (default); unchecked = backdrop-tap closes modals
  // as it used to before this change.
  if (e.target.id === 'strictModalsToggle') {
    const st = Store.load();
    st.disable_strict_modals = !e.target.checked;
    Store.save(st);
    return;
  }
  // SQLite storage toggle (Owner, device only). Async — fire and forget.
  if (e.target.id === 'sqliteToggle') {
    onSqliteToggle(e.target.checked);
    return;
  }
  // Stage B #7 — "Jump to CRO" dropdown. Hop (back) to a CRO to fix a verdict.
  if (e.target.id === 'croJump') {
    const idx = parseInt(e.target.value, 10);
    if (isNaN(idx)) return;
    const state = Store.load();
    const aud = currentAudit(state);
    if (!aud) return;
    window._croReviewReturnTo = aud.current_cro_index || 0;
    aud.current_cro_index = idx;
    Store.save(state);
    window._croReviewMode = true;
    window._recheckCpId = null;
    render();
    return;
  }
  // Builder: persist template name / frequency / cro_mode on change.
  if (e.target.id === 'builderName' || e.target.id === 'builderFreq' || e.target.id === 'builderCroMode') {
    const tpl = Templates.byId(null, e.target.dataset.tpl);
    if (!tpl) return;
    if (e.target.id === 'builderName') tpl.name = e.target.value.trim() || tpl.name;
    if (e.target.id === 'builderFreq') tpl.frequency = e.target.value;
    if (e.target.id === 'builderCroMode') tpl.cro_mode = e.target.value;
    Templates.save(tpl);
    return;
  }
  // Builder: persist a section name on change.
  if (e.target.classList && e.target.classList.contains('builder-section-name')) {
    const tpl = Templates.byId(null, Builder.editingId);
    if (!tpl) return;
    const sec = (tpl.sections || []).find(s => s.id === e.target.dataset.section);
    if (sec) { sec.name = e.target.value.trim() || sec.name; Templates.save(tpl); }
    return;
  }
});

// Live filter for the glossary search box.
document.addEventListener('input', (e) => {

// Hardware/keyboard support: numbers + backspace work in PIN entry.
document.addEventListener('keydown', (e) => {
  if (!document.body.classList.contains('locked')) return;
  if (document.activeElement && ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key >= '0' && e.key <= '9') { handlePinKey(e.key); e.preventDefault(); return; }
  if (e.key === 'Backspace') { handlePinKey('back'); e.preventDefault(); return; }
});

// Stage A #13 — when a textarea or input inside a modal gets focus, the
// Android soft keyboard usually appears ~150-250ms later and reduces the
// viewport. Auto-scroll the focused field into view so the user can see
// what they're typing (previously the keyboard hid mid-modal textareas).
document.addEventListener('focusin', (e) => {
  const el = e.target;
  if (!el || (el.tagName !== 'TEXTAREA' && el.tagName !== 'INPUT')) return;
  if (!el.closest || !el.closest('[data-modal]')) return;
  // Wait for the keyboard to settle before scrolling.
  setTimeout(() => {
    try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (_) {}
  }, CONFIG.timing.photoSettleMs);
});

// Deep-link tab via hash, e.g. index.html#history.
function applyHashTab() {
  const h = (location.hash || '').replace('#', '');
  if (h && ['home', 'audit', 'history', 'caps', 'reference', 'settings'].includes(h)) {
    switchTab(h);
  }
}
window.addEventListener('hashchange', applyHashTab);

// Stage A #1 — on boot, restore the last tab the user was on, so power users
// who lived on Audit don't get a surprise Home landing. New users (no
// last_tab yet) land on Home. The hash deep-link still wins if present.
function restoreLastTab() {
  if (location.hash) return; // deep-link wins
  const state = Store.load();
  const last = state.last_tab;
  if (last && ['home', 'audit', 'history', 'caps', 'reference', 'settings'].includes(last)) {
    switchTab(last);
  } else {
    switchTab('home');
  }
}

// Demo seed — if a pre-loaded dataset is bundled (demo build) AND this device
// has no data yet, install it on first launch. Inert on the production build
// (window.DEMO_SEED is undefined there). Runs before ensureSeeded so the
// seeded templates win. Never overwrites real data.
if (typeof window !== 'undefined' && window.DEMO_SEED && !localStorage.getItem(STORE_KEY)) {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(window.DEMO_SEED));
    console.log('Demo dataset seeded (' + (window.DEMO_SEED.audits || []).length + ' audits).');
  } catch (e) {
    console.error('Demo seed failed (likely storage quota):', e);
  }
}

// The synchronous boot sequence — byte-for-byte what the app has always done.
// Sets Persistence ready (it already is on device when this runs after boot()),
// seeds, renders, and starts the Capacitor shell + background photo migration.
function _bootSync() {
  Persistence._ready = true;
  I18n.init();
  Templates.ensureSeeded();
  _selfTestWeeklyScore();
  render();
  renderTabBar();
  applyHashTab();
  restoreLastTab();

  // Storage Phase 2 — move any legacy inline photos into IndexedDB in the
  // background, then re-render so they display from their new home. No-op for
  // fresh installs / the demo (which has no inline photos). Never blocks boot.
  if (typeof PhotoStore !== 'undefined') {
    Promise.resolve().then(migratePhotosToIDB).then(function (n) {
      if (n) { console.log('Migrated ' + n + ' photo(s) to IndexedDB.'); render(); }
    }).catch(function (e) { console.error('photo migration failed', e); });
  }

  // Capacitor boot — status bar, splash, keyboard, hardware back button.
  if (window.SaagarShell) {
    window.SaagarShell.boot({
      closeModal: closeModal,
      onBack: () => {
        // If audit is in progress on the Audit tab, confirm before exit-on-back.
        const onAudit = document.querySelector('#tab-audit.active') !== null;
        const state = Store.load();
        if (onAudit && currentAudit(state)) {
          if (!confirm(tUi('confirm.exit_audit'))) return true;
        }
        return false; // let default handler run (history.back / exit)
      },
    });
  }
}

// SQLite path is ONLY taken on a real device with the Owner toggle on. There,
// we hydrate the SQLite mirror (async) before the first render. Everywhere
// else — browser, the Node harness, or SQLite-off — boot is the exact
// synchronous sequence with no extra microtask (Safety invariant #2).
if (window.SaagarShell && typeof CapacitorSqlDriver !== 'undefined' && sqliteEnabled()) {
  (function () {
    const driver = new CapacitorSqlDriver('saagar_audit');
    Persistence.boot(driver).then(function () {
      _bootSync();
      // Best-effort draft flush when the app is backgrounded (durability for
      // submitted records rests on the synchronous flush-tier enqueue, not on
      // these — see the spec). The native appStateChange hook in shell.js is
      // the more reliable trigger on Android.
      ['pagehide', 'visibilitychange'].forEach(function (ev) {
        try { window.addEventListener(ev, function () { Persistence.flushNow(); }); } catch (_) {}
      });
    });
  })();
} else {
  _bootSync();
}
  </script>
