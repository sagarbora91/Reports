<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d2340">
  <title>Saagar Audit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* Saagar Traders retail design system — same palette + fonts as the
   existing HTML grooming audit tool. */

:root {
  --navy:        #0d2340;
  --navy-mid:    #1a3a5c;
  --navy-light:  #264d7a;
  --gold:        #b8922a;
  --gold-light:  #d4a843;
  --gold-pale:   #fdf6e3;
  --cream:       #faf8f3;
  --white:       #ffffff;

  --red:         #b91c1c;
  --red-pale:    #fef2f2;
  --amber:       #b45309;
  --amber-pale:  #fffbeb;
  --green:       #166534;
  --green-pale:  #f0fdf4;
  --green-mid:   #bbf7d0;

  --gray-100:    #f4f4f5;
  --gray-200:    #e4e4e7;
  --gray-300:    #d4d4d8;
  --gray-400:    #a1a1aa;
  --gray-600:    #52525b;
  --gray-800:    #27272a;

  --shadow:      0 2px 12px rgba(13,35,64,0.08);
  --radius:      10px;

  --safe-top:    env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
  background: var(--cream);
  color: var(--gray-800);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: contain;
}

button { font-family: inherit; }
input, textarea, select {
  font-family: inherit;
  font-size: 16px; /* prevent iOS zoom-on-focus */
}

/* --- top bar --- */
.topbar {
  background: var(--navy);
  color: var(--white);
  padding: calc(var(--safe-top) + 12px) 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand-serif {
  font-family: 'DM Serif Display', serif;
  font-size: 26px;
  color: var(--gold-light);
  letter-spacing: 0.3px;
}
.brand-sans {
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--white);
  opacity: 0.85;
}
.iconbtn {
  background: transparent;
  border: 0;
  color: var(--white);
  font-size: 20px;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 8px;
}
.iconbtn:active { background: rgba(255,255,255,0.1); }

/* --- tabs --- */
.tabs {
  background: var(--navy-mid);
  display: flex;
  border-bottom: 1px solid var(--navy-light);
  position: sticky;
  top: 56px;
  z-index: 9;
}
.tab {
  flex: 1;
  background: transparent;
  border: 0;
  color: rgba(255,255,255,0.7);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 14px 0;
  cursor: pointer;
  border-bottom: 3px solid transparent;
}
.tab.active {
  color: var(--gold-light);
  border-bottom-color: var(--gold-light);
}

/* --- content --- */
main { padding: 16px 16px calc(var(--safe-bottom) + 24px); max-width: 720px; margin: 0 auto; }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* --- cards --- */
.card {
  background: var(--white);
  border: 1px solid var(--gray-200);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  margin-bottom: 12px;
}
.card h2 {
  font-family: 'DM Serif Display', serif;
  font-size: 20px;
  color: var(--navy);
  margin: 0 0 8px;
}
.card p { margin: 4px 0; color: var(--gray-600); }
.muted { color: var(--gray-600); font-size: 14px; }
.tiny  { color: var(--gray-400); font-size: 12px; letter-spacing: 1px; }

/* --- buttons --- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 16px 18px;
  border-radius: var(--radius);
  border: 0;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.05s;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--navy); color: var(--white); }
.btn-secondary { background: var(--gold-pale); color: var(--navy); border: 1px solid var(--gold); }
.btn-ghost { background: transparent; color: var(--navy); border: 1px solid var(--gray-300); }
.btn-pass { background: var(--green); color: var(--white); padding: 22px; font-size: 22px; letter-spacing: 3px; font-family: 'DM Serif Display', serif; }
.btn-fail { background: var(--red);   color: var(--white); padding: 22px; font-size: 22px; letter-spacing: 3px; font-family: 'DM Serif Display', serif; }
.btn-na   { background: var(--white); color: var(--gray-800); border: 1px solid var(--gray-300); padding: 14px; font-weight: 600; letter-spacing: 2px; }
.btn-row { display: grid; gap: 10px; }

/* --- form bits --- */
label.field {
  display: block;
  margin-bottom: 14px;
}
label.field > span {
  display: block;
  font-size: 13px;
  color: var(--gray-600);
  margin-bottom: 6px;
}
input[type=text], input[type=date], textarea, select {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--gray-300);
  border-radius: var(--radius);
  background: var(--white);
  color: var(--gray-800);
}
textarea { resize: vertical; min-height: 80px; }

/* --- checkpoint screen --- */
.progress {
  height: 4px;
  background: var(--gray-200);
  border-radius: 2px;
  overflow: hidden;
  margin: 0 0 12px;
}
.progress > span {
  display: block;
  height: 100%;
  background: var(--gold);
  transition: width 0.2s ease-out;
}
.cp-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  font-size: 12px;
  color: var(--gray-400);
}
.sop-chip {
  background: var(--gray-100);
  color: var(--navy);
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
}
.sop-chip.critical { background: var(--gold-pale); color: var(--gold); }
.sop-chip.critical::before { content: '★ '; }
.cp-text {
  font-family: 'DM Serif Display', serif;
  font-size: 26px;
  line-height: 1.25;
  color: var(--navy);
  margin: 8px 0 12px;
}
.cp-evidence {
  font-size: 13px;
  color: var(--gray-600);
  margin-bottom: 10px;
}
.photo-required-badge {
  display: inline-block;
  background: var(--red-pale);
  color: var(--red);
  border: 1px solid var(--red);
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
}
.minicounts {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 14px;
}
.minicount { text-align: center; }
.minicount .n {
  font-family: 'DM Serif Display', serif;
  font-size: 20px;
  display: block;
}
.minicount.p .n { color: var(--green); }
.minicount.f .n { color: var(--red); }
.minicount.na .n { color: var(--gray-600); }
.minicount .lbl { font-size: 11px; color: var(--gray-600); }

/* --- score display --- */
.score-card {
  text-align: center;
  padding: 28px 16px;
}
.score-pct {
  font-family: 'DM Serif Display', serif;
  font-size: 72px;
  line-height: 1;
  margin: 8px 0;
}
.score-pct.excellent, .score-pct.good { color: var(--green); }
.score-pct.fair { color: var(--amber); }
.score-pct.poor, .score-pct.critical { color: var(--red); }
.score-band {
  font-size: 13px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--gray-600);
}
.score-band.excellent, .score-band.good { color: var(--green); }
.score-band.fair { color: var(--amber); }
.score-band.poor, .score-band.critical { color: var(--red); }

/* --- history rows --- */
.hist-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  background: var(--white);
  border: 1px solid var(--gray-200);
  border-radius: var(--radius);
  margin-bottom: 8px;
}
.hist-row strong { font-family: 'DM Serif Display', serif; font-size: 16px; color: var(--navy); }
.hist-row .pct { font-weight: 700; }
.hist-row .pct.excellent, .hist-row .pct.good { color: var(--green); }
.hist-row .pct.fair { color: var(--amber); }
.hist-row .pct.poor, .hist-row .pct.critical { color: var(--red); }

/* --- modal --- */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(13,35,64,0.5);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 100;
  padding: 0;
}
.modal {
  background: var(--white);
  border-radius: 16px 16px 0 0;
  width: 100%; max-width: 720px;
  padding: 20px 16px calc(var(--safe-bottom) + 20px);
  max-height: 90vh; overflow: auto;
}
.modal h3 { font-family: 'DM Serif Display', serif; margin: 0 0 4px; color: var(--navy); font-size: 20px; }
.modal .row { display: flex; gap: 10px; margin-top: 14px; }
.modal .row > * { flex: 1; }

/* --- toast --- */
.toast {
  position: fixed;
  bottom: calc(var(--safe-bottom) + 24px);
  left: 50%; transform: translateX(-50%);
  background: var(--navy);
  color: var(--white);
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 14px;
  box-shadow: var(--shadow);
  z-index: 200;
}

/* --- CRO list rows --- */
.cro-row {
  display: flex;
  align-items: center;
  padding: 8px 4px;
  border-bottom: 1px solid var(--gray-200);
}
.cro-row label { flex: 1; cursor: pointer; }
.cro-row .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--gray-100); color: var(--gray-600); margin-left: 8px; }

/* helpers */
.row-spread { display: flex; justify-content: space-between; align-items: center; }
.error { color: var(--red); font-size: 13px; margin-top: 6px; }
.spacer-12 { height: 12px; }
.spacer-24 { height: 24px; }
hr.soft { border: 0; border-top: 1px solid var(--gray-200); margin: 16px 0; }

/* --- photo grid (fail modal + audit detail) --- */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 8px;
}
.photo-tile {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: 8px;
  overflow: hidden;
  background: var(--gray-200);
  cursor: pointer;
}
.photo-tile img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.photo-remove {
  position: absolute;
  top: 4px; right: 4px;
  width: 26px; height: 26px;
  border-radius: 50%;
  background: rgba(0,0,0,0.65);
  color: white;
  border: 0;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  padding: 0;
}
.req-pill {
  display: inline-block;
  background: var(--red);
  color: var(--white);
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  margin-left: 4px;
  vertical-align: middle;
}

/* --- audit detail (history modal) --- */
.detail-sop {
  margin: 14px 0;
}
.detail-sop-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--gray-100);
  border-radius: 8px;
  margin-bottom: 8px;
  font-weight: 600;
  font-size: 14px;
  color: var(--navy);
}
.detail-sop-header.critical { background: var(--gold-pale); color: var(--gold); }
.detail-sop-header.critical::before { content: '★ '; }
.detail-sop-header .count {
  margin-left: auto;
  font-weight: 400;
  font-size: 12px;
  color: var(--gray-600);
}
.result-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 8px;
  border-bottom: 1px solid var(--gray-200);
  font-size: 14px;
}
.result-row:last-child { border-bottom: 0; }
.result-row .cp-id { font-weight: 600; color: var(--gray-600); min-width: 36px; font-variant-numeric: tabular-nums; }
.result-row .cp-body { flex: 1; }
.result-row .cp-finding { color: var(--gray-600); font-size: 13px; margin-top: 4px; }
.verdict-pill {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  padding: 2px 8px;
  border-radius: 999px;
  white-space: nowrap;
  min-width: 36px;
  text-align: center;
}
.verdict-pill.P  { background: var(--green-pale); color: var(--green); }
.verdict-pill.F  { background: var(--red-pale);   color: var(--red); }
.verdict-pill.NA { background: var(--gray-100);   color: var(--gray-600); }
.detail-photos {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 6px;
}
.detail-photos img {
  width: 64px; height: 64px;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid var(--gray-200);
}

/* --- CRO performance summary --- */
.cro-summary {
  background: var(--white);
  border: 1px solid var(--gray-200);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
}
.cro-summary h3 {
  margin: 0 0 8px;
  font-family: 'DM Serif Display', serif;
  font-size: 16px;
  color: var(--navy);
}
.cro-rank {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid var(--gray-200);
  font-size: 14px;
}
.cro-rank:last-child { border-bottom: 0; }
.cro-rank .badge {
  background: var(--red-pale);
  color: var(--red);
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
}

/* --- resume banner --- */
.resume-banner {
  background: var(--amber-pale);
  border: 1px solid var(--amber);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 16px;
}
.resume-banner h3 {
  font-family: 'DM Serif Display', serif;
  font-size: 18px;
  color: var(--amber);
  margin: 0 0 4px;
}

/* --- auth screens (locked state) --- */
body.locked .topbar,
body.locked .tabs,
body.locked main,
body.locked #toast,
body.locked #modal-root,
body.locked #print-root {
  display: none !important;
}
#auth-screen {
  min-height: 100vh;
  background: var(--cream);
  display: none;
  padding: calc(var(--safe-top) + 24px) 16px calc(var(--safe-bottom) + 24px);
}
body.locked #auth-screen { display: block; }

.auth-wrap {
  max-width: 480px;
  margin: 0 auto;
}
.auth-brand {
  text-align: center;
  margin-bottom: 28px;
}
.auth-brand .serif {
  font-family: 'DM Serif Display', serif;
  font-size: 38px;
  color: var(--navy);
  line-height: 1;
}
.auth-brand .sub {
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--gold);
  margin-top: 6px;
}
.auth-card {
  background: var(--white);
  border: 1px solid var(--gray-200);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 24px 20px;
}
.auth-card h2 {
  font-family: 'DM Serif Display', serif;
  font-size: 22px;
  color: var(--navy);
  margin: 0 0 4px;
}
.auth-card p { color: var(--gray-600); font-size: 14px; margin: 0 0 16px; }

/* --- PIN input dots + numpad --- */
.pin-dots {
  display: flex;
  gap: 14px;
  justify-content: center;
  margin: 20px 0;
}
.pin-dots .dot {
  width: 16px; height: 16px;
  border-radius: 50%;
  border: 1.5px solid var(--navy);
  background: transparent;
}
.pin-dots .dot.filled { background: var(--navy); }
.pin-dots.shake { animation: shake 0.4s; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}
.numpad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  max-width: 320px;
  margin: 0 auto;
}
.numpad button {
  height: 64px;
  background: var(--white);
  border: 1px solid var(--gray-300);
  border-radius: 12px;
  font-family: 'DM Serif Display', serif;
  font-size: 24px;
  color: var(--navy);
  cursor: pointer;
}
.numpad button:active { background: var(--gray-100); }
.numpad button.muted { color: var(--gray-600); font-size: 14px; font-family: 'DM Sans', sans-serif; }
.numpad button[data-key="back"] { background: var(--gray-100); }

/* --- user badge in topbar --- */
#userBadge {
  display: flex;
  align-items: center;
  gap: 8px;
}
#userBadge .name { color: var(--white); font-size: 14px; font-weight: 500; }
#userBadge .role {
  font-size: 9px;
  letter-spacing: 1.5px;
  color: var(--gold-light);
  background: var(--navy-mid);
  padding: 2px 6px;
  border-radius: 4px;
}
#userBadge button {
  background: transparent;
  border: 0;
  color: var(--white);
  font-size: 18px;
  cursor: pointer;
  padding: 4px 8px;
}

/* --- user list rows in Settings --- */
.user-row {
  display: flex;
  align-items: center;
  padding: 10px 4px;
  border-bottom: 1px solid var(--gray-200);
}
.user-row:last-child { border-bottom: 0; }
.user-row .info { flex: 1; }
.user-row .info .name { font-weight: 600; color: var(--navy); }
.user-row .info .meta { font-size: 12px; color: var(--gray-600); margin-top: 2px; }
.role-pill {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  margin-left: 6px;
}
.role-pill.OWNER { background: var(--gold-pale); color: var(--gold); }
.role-pill.GM    { background: var(--navy);      color: var(--white); }
.role-pill.SM    { background: var(--gray-100);  color: var(--navy); }
.role-pill.inactive { background: var(--gray-200); color: var(--gray-600); }

/* --- print --- */
@media print {
  @page { margin: 16mm 12mm; }
  body { background: white; }
  body.printing > *:not(#print-root) { display: none !important; }
  #print-root { display: block !important; }
  .no-print { display: none !important; }
}
#print-root { display: none; }
.print-page { font-family: 'DM Sans', system-ui, sans-serif; color: #111; }
.print-page h1 { font-family: 'DM Serif Display', serif; color: var(--navy); margin: 0 0 4px; font-size: 26px; }
.print-page h2 { font-family: 'DM Serif Display', serif; color: var(--navy); margin: 18px 0 6px; font-size: 16px; border-bottom: 1px solid #ccc; padding-bottom: 2px; }
.print-page .meta { color: #555; font-size: 12px; margin-bottom: 12px; }
.print-page .pscore { font-size: 36px; font-family: 'DM Serif Display', serif; }
.print-page table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
.print-page th, .print-page td { border: 1px solid #ccc; padding: 4px 6px; vertical-align: top; text-align: left; }
.print-page th { background: #f0f0f0; }
.print-page .photo-row img { max-width: 100px; max-height: 100px; margin: 2px; border: 1px solid #ccc; }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-serif">Saagar</span>
      <span class="brand-sans">AUDIT</span>
    </div>
    <div id="userBadge"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="audit">Audit</button>
    <button class="tab" data-tab="history">History</button>
    <button class="tab" data-tab="settings">Settings</button>
  </nav>

  <main>
    <section id="tab-audit" class="tab-content active"></section>
    <section id="tab-history" class="tab-content"></section>
    <section id="tab-settings" class="tab-content"></section>
  </main>

  <div id="auth-screen" hidden></div>

  <div id="toast" class="toast" hidden></div>
  <div id="modal-root"></div>
  <div id="print-root"></div>

  <script>
// Auto-generated from assets/seed/. Do not edit by hand.
const CHECKPOINTS = [
  {
    "id": "2.1",
    "sop_id": "SOP2",

    "evidence": "Sales Buddy timestamp",
    "weight": 1,
    "allows_na": false,
    "photo_required_on_fail": false,
    "order": 1
  },
  {
    "id": "2.2",
    "sop_id": "SOP2",
    "text": "Closing photo uploaded between 9:00 and 9:30 PM",
    "evidence": "Sales Buddy timestamp",
    "weight": 1,
    "allows_na": false,
    "photo_required_on_fail": false,
    "order": 2
  },
  {

/* Saagar Audit — single-page vanilla JS app.
   No framework, no build step. The whole UI is rendered by string templates
   into the three tab sections. State lives in localStorage under one key. */
'use strict';

// ---------------------------------------------------------------------------
// Storage
// ---------------------------------------------------------------------------

const STORE_KEY = 'saagar_audit_v1';

const Store = {
  load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return Store.empty();
      const s = JSON.parse(raw);
      return Object.assign(Store.empty(), s);
    } catch (e) {
      console.error('localStorage corrupted, resetting', e);
      return Store.empty();
    }
  },
  save(s) { localStorage.setItem(STORE_KEY, JSON.stringify(s)); },
  empty() {
    return {
      audits: [],
      cros: [],
      users: [],
      current_audit_id: null,
      current_user_id: null,
      auditor_name: '',
    };
  },
};

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------

function uuid() {
  return 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function today() { return new Date().toISOString().slice(0, 10); }

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.hidden = true; }, 1800);
}

// ---------------------------------------------------------------------------
// Crypto — PIN hashing via Web Crypto PBKDF2 (no library needed).
// ---------------------------------------------------------------------------

async function hashPin(pin, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(pin), { name: 'PBKDF2' }, false, ['deriveBits']
  );
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: enc.encode(salt), iterations: 100000, hash: 'SHA-256' },
    keyMaterial, 256
  );
  return Array.from(new Uint8Array(bits))
    .map(b => b.toString(16).padStart(2, '0')).join('');
}

async function verifyPin(pin, salt, expected) {
  return (await hashPin(pin, salt)) === expected;
}

function randomSalt() {
  const a = new Uint8Array(16);
  crypto.getRandomValues(a);
  return Array.from(a).map(b => b.toString(16).padStart(2, '0')).join('');
}

// ---------------------------------------------------------------------------
// Users + auth
// ---------------------------------------------------------------------------

const Users = {
  listActive(state) { return state.users.filter(u => u.is_active); },
  listAll(state) { return state.users.slice(); },
  byId(state, id) { return state.users.find(u => u.id === id) || null; },

  async create({ name, role, pin }) {
    const state = Store.load();
    const salt = randomSalt();
    const pin_hash = await hashPin(pin, salt);
    const u = {
      id: uuid(), name, role, pin_salt: salt, pin_hash,
      created_at: new Date().toISOString(), is_active: true,
    };
    state.users.push(u);
    Store.save(state);
    return u;
  },

  async changePin(userId, newPin) {
    const state = Store.load();
    const u = Users.byId(state, userId);
    if (!u) return false;
    u.pin_salt = randomSalt();
    u.pin_hash = await hashPin(newPin, u.pin_salt);
    Store.save(state);
    return true;
  },

  setActive(userId, active) {
    const state = Store.load();
    const u = Users.byId(state, userId);
    if (!u) return;
    u.is_active = !!active;
    Store.save(state);
  },
};

const AuthSession = {
  current(state) {
    state = state || Store.load();
    if (!state.current_user_id) return null;
    const u = Users.byId(state, state.current_user_id);
    if (!u || !u.is_active) return null;
    return u;
  },
  login(userId) {
    const state = Store.load();
    state.current_user_id = userId;
    Store.save(state);
  },
  logout() {
    const state = Store.load();
    state.current_user_id = null;
    Store.save(state);
  },
};

function roleLabel(r) {
  return { OWNER: 'Owner', GM: 'GM', SM: 'Store Manager' }[r] || r;
}

// In-memory lockout — 5 wrong PINs within 60s → 60-second lockout.
const LoginGuard = {
  attempts: 0,
  lockedUntil: 0,
  register(success) {
    if (success) { this.attempts = 0; this.lockedUntil = 0; return; }
    this.attempts++;
    if (this.attempts >= 5) {
      this.lockedUntil = Date.now() + 60 * 1000;
      this.attempts = 0;
    }
  },
  isLocked() { return this.lockedUntil > Date.now(); },
  secondsLeft() { return Math.max(0, Math.ceil((this.lockedUntil - Date.now()) / 1000)); },
};

// ---------------------------------------------------------------------------
// Image compression — keeps localStorage footprint small.
// ---------------------------------------------------------------------------

function compressImage(file, maxDim = 1024, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('FileReader failed'));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error('Image decode failed'));
      img.onload = () => {
        const longest = Math.max(img.width, img.height);
        const scale = longest > maxDim ? maxDim / longest : 1;
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// Approximate size of a base64 data URL in KB.
function dataUrlSizeKb(dataUrl) {
  const b64 = (dataUrl.split(',')[1] || '');
  return Math.round((b64.length * 0.75) / 1024);
}

// ---------------------------------------------------------------------------
// Score (Spec §6.1 – §6.2)
// ---------------------------------------------------------------------------

function scoreAudit(results) {
  let raw = 0, max = 0, p = 0, f = 0, na = 0;
  CHECKPOINTS.forEach(cp => {
    const r = (results[cp.id] || {}).result;
    if (r === 'P') { raw += cp.weight; max += cp.weight; p++; }
    else if (r === 'F') { max += cp.weight; f++; }
    else if (r === 'NA') { na++; }
  });
  const pct = max > 0 ? Math.round((raw / max) * 1000) / 10 : 100;
  let band = 'critical';
  if (pct >= 95)      band = 'excellent';
  else if (pct >= 90) band = 'good';
  else if (pct >= 85) band = 'fair';
  else if (pct >= 80) band = 'poor';
  return { raw, max, pct, band, p, f, na, total: CHECKPOINTS.length };
}

function bandLabel(band) {
  return { excellent: 'Excellent', good: 'Good', fair: 'Fair', poor: 'Poor', critical: 'Critical' }[band];
}

// ---------------------------------------------------------------------------
// Audit lifecycle
// ---------------------------------------------------------------------------

function currentAudit(state) {
  return state.audits.find(a => a.id === state.current_audit_id) || null;
}

function audit(id, state) {
  return state.audits.find(a => a.id === id) || null;
}

function startNewAudit({ date, auditorName, auditorId, croIds }) {
  const state = Store.load();
  // If an unsubmitted draft already exists for today, replace it.
  state.audits = state.audits.filter(a => !(a.date === date && a.status === 'draft'));
  const newAudit = {
    id: uuid(),
    date,
    auditor_id: auditorId || null,
    auditor_name: auditorName,
    cros: croIds.slice(),
    status: 'draft',
    results: {},
    started_at: new Date().toISOString(),
    submitted_at: null,
  };
  state.audits.push(newAudit);
  state.current_audit_id = newAudit.id;
  state.auditor_name = auditorName;
  Store.save(state);
  return newAudit;
}

function markCheckpoint(checkpointId, result, opts = {}) {
  const state = Store.load();
  const a = currentAudit(state);
  if (!a) return;
  a.results[checkpointId] = {
    result,
    finding: opts.finding || '',
    cro_id: opts.croId || null,
    photos: opts.photos || [],
    at: new Date().toISOString(),
  };
  Store.save(state);
}

// Working photo draft, used by the fail modal between opening and saving.
const FailDraft = {
  photos: [],
  reset() { FailDraft.photos = []; },
  add(dataUrl) { FailDraft.photos.push(dataUrl); },
  removeAt(i) { FailDraft.photos.splice(i, 1); },
};

function nextUnmarkedIndex(audit) {
  for (let i = 0; i < CHECKPOINTS.length; i++) {
    if (!audit.results[CHECKPOINTS[i].id]) return i;
  }
  return CHECKPOINTS.length; // all done
}

function submitAudit() {
  const state = Store.load();
  const a = currentAudit(state);
  if (!a) return null;
  const s = scoreAudit(a.results);
  a.status = 'submitted';
  a.submitted_at = new Date().toISOString();
  a.score = s;
  state.current_audit_id = null;
  Store.save(state);
  return a;
}

};

  const state = Store.load();
  const auth = AuthSession.current(state);

  // Gate 1: no users at all → first-time setup
  if (state.users.length === 0) {
    document.body.classList.add('locked');
    document.getElementById('auth-screen').innerHTML = renderFirstTimeSetup();
    return;
  }
  // Gate 2: users exist but no one logged in → login screen
  if (!auth) {
    document.body.classList.add('locked');
    document.getElementById('auth-screen').innerHTML = renderLoginScreen(state);
    return;
  }

  // Authenticated — show normal UI
  document.body.classList.remove('locked');
  renderUserBadge(auth);
  document.getElementById('tab-audit').innerHTML = renderAuditTab(state, auth);
  document.getElementById('tab-history').innerHTML = renderHistoryTab(state, auth);
  document.getElementById('tab-settings').innerHTML = renderSettingsTab(state, auth);
}

function renderInProgressAudit(a) {
  const idx = nextUnmarkedIndex(a);
  if (idx >= CHECKPOINTS.length) return renderReviewAudit(a);

  const cp = CHECKPOINTS[idx];
  const sop = SOPS.find(s => s.id === cp.sop_id);
  const live = scoreAudit(a.results);
  const pct = Math.round(((idx) / CHECKPOINTS.length) * 100);
  const allowsNa = cp.allows_na;
  const isFreshSession = !sessionStorage.getItem('audit_session_' + a.id);
  if (idx > 0 && isFreshSession) sessionStorage.setItem('audit_session_' + a.id, '1');

  return `
    ${idx > 0 && isFreshSession ? `
      <div class="resume-banner">
        <h3>Resuming audit</h3>
        <p class="muted" style="margin:0">Picked up at checkpoint ${idx + 1} of ${CHECKPOINTS.length}. ${live.p} pass, ${live.f} fail, ${live.na} N/A so far.</p>
      </div>` : ''}
    <div class="progress"><span style="width:${pct}%"></span></div>
    <div class="cp-meta">
      <span class="sop-chip ${sop.critical ? 'critical' : ''}">${escapeHtml(sop.name)}</span>
      <span>CP ${escapeHtml(cp.id)}</span>
      <span style="margin-left:auto">${idx + 1} of ${CHECKPOINTS.length}</span>
    </div>
    <div class="card">
      <div class="cp-text">${escapeHtml(cp.text)}</div>
      ${cp.evidence ? `<div class="cp-evidence">Evidence: ${escapeHtml(cp.evidence)}</div>` : ''}
      ${cp.photo_required_on_fail
        ? `<div class="photo-required-badge">Photo required if FAIL</div>`
        : ''}
    </div>
    <div class="btn-row">
      <button class="btn btn-pass" data-action="mark" data-verdict="P">PASS</button>
      <button class="btn btn-fail" data-action="mark" data-verdict="F">FAIL</button>
      ${allowsNa ? `<button class="btn btn-na" data-action="mark" data-verdict="NA">N / A</button>` : ''}
    </div>
    <div class="minicounts">
      <div class="minicount p"><span class="n">${live.p}</span><span class="lbl">PASS</span></div>
      <div class="minicount f"><span class="n">${live.f}</span><span class="lbl">FAIL</span></div>
      <div class="minicount na"><span class="n">${live.na}</span><span class="lbl">N/A</span></div>
    </div>
    <div class="spacer-24"></div>
    <button class="btn btn-ghost" data-action="cancel-audit">Cancel audit</button>
  `;
}

function renderReviewAudit(a) {

  return `

      <div class="score-pct ${s.band}">${s.pct.toFixed(1)}%</div>

      <p class="muted">${s.raw} of ${s.max} weighted points &middot; ${s.p} pass &middot; ${s.f} fail &middot; ${s.na} N/A</p>

function renderHistoryTab(state, auth) {
  // SM sees own audits only; GM and Owner see all.
  const submitted = state.audits
    .filter(a => a.status === 'submitted')
    .filter(a => {
      if (!auth || auth.role !== 'SM') return true;
      return a.auditor_id === auth.id || !a.auditor_id; // legacy audits with no auditor_id are visible too
    })
    .sort((a, b) => b.date.localeCompare(a.date));
  if (submitted.length === 0) {
    return `<div class="card"><h2>No submitted audits yet</h2><p class="muted">Once you submit a daily audit it'll appear here.</p></div>`;
  }

  // CRO performance summary — count FAILs attributed per CRO in last 30 days
  const cutoff = new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10);
  const croById = Object.fromEntries(state.cros.map(c => [c.id, c]));
  const croFailCounts = {};
  submitted.filter(a => a.date >= cutoff).forEach(a => {
    Object.values(a.results).forEach(r => {
      if (r.result === 'F' && r.cro_id) {
        croFailCounts[r.cro_id] = (croFailCounts[r.cro_id] || 0) + 1;
      }
    });
  });
  const ranked = Object.entries(croFailCounts)
    .filter(([id]) => croById[id])
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5);

  const croSummaryHtml = ranked.length > 0 ? `
    <div class="cro-summary">
      <h3>CROs with most fails (last 30 days)</h3>
      ${ranked.map(([id, n]) => `
        <div class="cro-rank">
          <span>${escapeHtml(croById[id].name)} <span class="muted" style="font-size:12px">· ${escapeHtml(croById[id].counter)}</span></span>
          <span class="badge">${n} fail${n > 1 ? 's' : ''}</span>
        </div>`).join('')}
    </div>` : '';

  return croSummaryHtml + submitted.map(a => {
    const s = a.score;
    return `
      <div class="hist-row" data-action="open-history" data-id="${a.id}">
        <div>
          <strong>${escapeHtml(fmtDate(a.date))}</strong>
          <div class="tiny">${s.p} P &middot; ${s.f} F &middot; ${s.na} N/A &middot; by ${escapeHtml(a.auditor_name || '—')}</div>
        </div>
        <div class="pct ${s.band}">${s.pct.toFixed(1)}%</div>
      </div>`;
  }).join('') + `
    <div class="spacer-12"></div>
    <button class="btn btn-ghost" data-action="export-csv">Export all to CSV</button>
  `;
}

function printAudit(auditId) {
  const state = Store.load();
  const a = audit(auditId, state);
  if (!a) return;
  const croById = Object.fromEntries(state.cros.map(c => [c.id, c]));
  const s = a.score;

  const sopSections = SOPS.slice().sort((x, y) => x.number - y.number).map(sop => {
    const cps = CHECKPOINTS.filter(c => c.sop_id === sop.id);
    const rows = cps.map(cp => {
      const r = a.results[cp.id] || {};
      const cro = r.cro_id ? croById[r.cro_id] : null;
      const photos = r.photos || [];
      return `<tr>
        <td>${escapeHtml(cp.id)}</td>
        <td>${escapeHtml(cp.text)}</td>
        <td><strong>${escapeHtml(r.result || '—')}</strong></td>
        <td>${escapeHtml(r.finding || '')}${cro ? `<br><em>${escapeHtml(cro.name)}</em>` : ''}${
          photos.length ? `<div class="photo-row">${photos.map(p => `<img src="${p}" alt="">`).join('')}</div>` : ''
        }</td>
      </tr>`;
    }).join('');
    return `<h2>${sop.critical ? '★ ' : ''}${escapeHtml(sop.name)}</h2>
      <table><thead><tr><th style="width:50px">CP</th><th>Checkpoint</th><th style="width:36px">Result</th><th>Finding / Evidence</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }).join('');

  document.getElementById('print-root').innerHTML = `
    <div class="print-page">
      <h1>Saagar Audit — Daily Compliance Report</h1>
      <div class="meta">
        ${escapeHtml(fmtDate(a.date))} &middot; Auditor: ${escapeHtml(a.auditor_name || '—')} &middot;
        Submitted ${escapeHtml(new Date(a.submitted_at).toLocaleString('en-IN'))}
      </div>
      <div class="pscore" style="color:${
        s.band === 'excellent' || s.band === 'good' ? '#166534'
        : s.band === 'fair' ? '#b45309' : '#b91c1c'
      }">${s.pct.toFixed(1)}% &middot; ${bandLabel(s.band)}</div>
      <div class="meta">${s.raw} of ${s.max} weighted points &middot; ${s.p} Pass &middot; ${s.f} Fail &middot; ${s.na} N/A</div>
      ${sopSections}
    </div>
  `;
  document.body.classList.add('printing');
  const cleanup = () => {
    document.body.classList.remove('printing');
    document.getElementById('print-root').innerHTML = '';
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
  setTimeout(() => window.print(), 100);
}

// ---------------------------------------------------------------------------
// Backup & restore
// ---------------------------------------------------------------------------

function backupFilename() {
  const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  return `saagar_audit_backup_${stamp}.json`;
}

async function backupToDrive() {
  const state = Store.load();
  const payload = {
    _format: 'saagar_audit_v1',
    _exported_at: new Date().toISOString(),
    _app_version: '0.1.0',
    ...state,
  };
  const json = JSON.stringify(payload, null, 2);
  const filename = backupFilename();
  const blob = new Blob([json], { type: 'application/json' });
  const file = new File([blob], filename, { type: 'application/json' });

  // Preferred path on Android: native share sheet — Drive shows up alongside
  // WhatsApp, Gmail, Files, etc. User picks Drive.
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({
        files: [file],
        title: 'Saagar Audit backup',
        text: `${state.audits.length} audit(s), ${state.cros.length} CRO(s)`,
      });
      toast('Backup shared');
      return;
    }
  } catch (e) {
    // User cancelled the share sheet — silent.
    if (e && e.name === 'AbortError') return;
    console.warn('share failed, falling back to download', e);
  }

  // Fallback: trigger a regular download. On Android, downloaded files land
  // in /Download/ and the user can manually upload from the Drive app.
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Backup downloaded — upload to Drive from your file manager');
}

function restoreFromBackup() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.style.display = 'none';
  input.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (data._format && data._format !== 'saagar_audit_v1') {
        toast(`Unknown backup format: ${data._format}`);
        return;
      }
      if (!Array.isArray(data.audits) || !Array.isArray(data.cros)) {
        toast("This file isn't a Saagar Audit backup.");
        return;
      }
      const msg = `Restore ${data.audits.length} audit(s) and ${data.cros.length} CRO(s)?\n\n` +
        `This REPLACES your current data on this phone.`;
      if (!confirm(msg)) return;
      const restored = {
        audits: data.audits,
        cros: data.cros,
        current_audit_id: data.current_audit_id || null,
        auditor_name: data.auditor_name || '',
      };
      Store.save(restored);
      render();
      switchTab('history');
      toast('Backup restored');
    } catch (err) {
      console.error(err);
      toast('Could not read the file. Pick a saagar_audit_backup_*.json file.');
    }
  });
  document.body.appendChild(input);
  input.click();
  // Cleanup after a tick.
  setTimeout(() => { try { document.body.removeChild(input); } catch (_) {} }, 1000);
}

function exportCsv() {
  const state = Store.load();
  const submitted = state.audits.filter(a => a.status === 'submitted');
  if (submitted.length === 0) { toast('No submitted audits yet'); return; }
  const rows = [['date', 'auditor', 'compliance_pct', 'band', 'raw', 'max', 'pass', 'fail', 'na', 'checkpoint_id', 'result', 'finding', 'cro_id']];
  submitted.forEach(a => {
    Object.entries(a.results).forEach(([cpId, r]) => {
      rows.push([
        a.date,
        a.auditor_name || '',
        a.score.pct.toFixed(1),
        a.score.band,
        a.score.raw,
        a.score.max,
        a.score.p,
        a.score.f,
        a.score.na,
        cpId,
        r.result,
        r.finding || '',
        r.cro_id || '',
      ]);
    });
  });
  const csv = rows.map(r => r.map(v => {
    const s = String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `saagar_audit_${today()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ---------------------------------------------------------------------------
// Event handlers
// ---------------------------------------------------------------------------

document.addEventListener('click', async (e) => {
  // Auth pin pad — buttons with data-key, only when locked
  const key = e.target.closest('[data-key]');
  if (key && document.body.classList.contains('locked')) {
    await handlePinKey(key.dataset.key);
    return;
  }

  const t = e.target.closest('[data-tab]');
  if (t) { switchTab(t.dataset.tab); return; }

  const a = e.target.closest('[data-action]');
  if (!a) return;
  const action = a.dataset.action;

  // Auth actions
  if (action === 'logout') {
    if (!confirm('Sign out?')) return;
    AuthSession.logout();
    PinBuf.reset();
    window._loginUserId = null;
    render();
    return;
  }
  if (action === 'setup-name-next') {
    const name = document.getElementById('ownerName').value.trim();
    const err = document.getElementById('setupErr');
    if (name.length < 2) {
      err.textContent = 'Please enter your name (2+ characters).';
      err.hidden = false;
      return;
    }
    window._setupOwnerName = name;
    window._setupStage = 'pin';
    PinBuf.reset();
    render();
    return;
  }

  if (action === 'modal-cancel' || action === 'modal-backdrop') { closeModal(); return; }
  if (e.target.matches('[data-modal-backdrop]')) { closeModal(); return; }

  // ----- User management (Owner-only mostly) -----
  if (action === 'change-my-pin') { changePinModal(); return; }
  if (action === 'modal-save-my-pin') {
    const cur = document.getElementById('pinCurrent').value;
    const np  = document.getElementById('pinNew').value;
    const npc = document.getElementById('pinNewConfirm').value;
    if (!/^\d{4}$/.test(cur)) { toast('Enter your current 4-digit PIN'); return; }
    if (!/^\d{4}$/.test(np))  { toast('New PIN must be 4 digits'); return; }
    if (np !== npc)           { toast('New PIN and confirmation do not match'); return; }
    const me = AuthSession.current();
    const ok = await verifyPin(cur, me.pin_salt, me.pin_hash);
    if (!ok) { toast('Current PIN is wrong'); return; }
    await Users.changePin(me.id, np);
    closeModal();
    toast('PIN updated');
    render();
    return;
  }

  if (action === 'add-user') { addUserModal(); return; }
  if (action === 'modal-save-user') {
    const name = document.getElementById('newUserName').value.trim();
    const role = document.getElementById('newUserRole').value;
    const pin  = document.getElementById('newUserPin').value;
    const pinc = document.getElementById('newUserPinConfirm').value;
    if (name.length < 2)        { toast('Enter a name (2+ characters)'); return; }
    if (!/^\d{4}$/.test(pin))   { toast('PIN must be 4 digits'); return; }
    if (pin !== pinc)           { toast('PIN and confirmation do not match'); return; }
    await Users.create({ name, role, pin });
    closeModal();
    toast(`${name} added as ${roleLabel(role)}`);
    render();
    return;
  }

  if (action === 'user-menu')      { userMenuModal(a.dataset.id); return; }
  if (action === 'user-reset-pin') { resetPinModal(a.dataset.id); return; }
  if (action === 'modal-save-reset-pin') {
    const np  = document.getElementById('resetPinNew').value;
    const npc = document.getElementById('resetPinConfirm').value;
    if (!/^\d{4}$/.test(np)) { toast('PIN must be 4 digits'); return; }
    if (np !== npc)          { toast('PINs do not match'); return; }
    await Users.changePin(a.dataset.id, np);
    closeModal();
    toast('PIN reset');
    render();
    return;
  }
  if (action === 'user-deactivate') {
    const me = AuthSession.current();
    if (a.dataset.id === me.id) { toast("Can't deactivate yourself"); return; }
    if (!confirm('Deactivate this user? They won\'t be able to sign in.')) return;
    Users.setActive(a.dataset.id, false);
    closeModal();
    render();
    return;
  }
  if (action === 'user-reactivate') {
    Users.setActive(a.dataset.id, true);
    closeModal();
    render();
    return;
  }

  if (action === 'add-cro')     { addCroModal(); return; }
  if (action === 'modal-save-cro') {
    const name = document.getElementById('croName').value.trim();
    const counter = document.getElementById('croCounter').value;
    if (name.length < 2) { toast('Name too short'); return; }
    const state = Store.load();
    state.cros.push({ id: uuid(), name, counter });
    Store.save(state);
    closeModal();
    render();
    return;
  }
  if (action === 'remove-cro') {
    if (!confirm('Remove this CRO?')) return;
    const id = a.dataset.id;
    const state = Store.load();
    state.cros = state.cros.filter(c => c.id !== id);
    Store.save(state);
    render();
    return;
  }

  if (action === 'start-audit') {
    const me = AuthSession.current();
    if (!me) { toast('Sign in first'); return; }
    const date = document.getElementById('auditDate').value;
    const croIds = Array.from(document.querySelectorAll('.cro-check:checked')).map(el => el.value);
    const err = document.getElementById('startError');
    err.hidden = true;
    if (!date)               { err.textContent = 'Pick a date.'; err.hidden = false; return; }
    if (croIds.length === 0) { err.textContent = 'Select at least one CRO on duty.'; err.hidden = false; return; }
    startNewAudit({ date, auditorName: me.name, auditorId: me.id, croIds });
    render();
    return;
  }

  if (action === 'mark') {
    const verdict = a.dataset.verdict;
    const state = Store.load();
    const audit = currentAudit(state);
    if (!audit) return;
    const idx = nextUnmarkedIndex(audit);
    const cp = CHECKPOINTS[idx];
    if (!cp) return;

    if (verdict === 'P')  { markCheckpoint(cp.id, 'P'); render(); return; }
    if (verdict === 'F')  { failModal(cp, state.cros.filter(c => audit.cros.includes(c.id))); return; }
    if (verdict === 'NA') { naModal(cp); return; }
  }

  if (action === 'add-fail-photo') {
    const input = document.getElementById('failPhotoInput');
    if (!input) return;
    input.value = ''; // reset so picking the same file twice still triggers change
    input.onchange = async (ev) => {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      try {
        const dataUrl = await compressImage(file);
        FailDraft.add(dataUrl);
        renderFailPhotoGrid();
        toast(`Photo added (${dataUrlSizeKb(dataUrl)} KB)`);
      } catch (err) {
        console.error(err);
        toast('Could not read photo');
      }
    };
    input.click();
    return;
  }
  if (action === 'remove-fail-photo') {
    const i = parseInt(a.dataset.index, 10);
    FailDraft.removeAt(i);
    renderFailPhotoGrid();
    return;
  }

  if (action === 'modal-save-fail') {
    const finding = document.getElementById('failFinding').value.trim();
    if (finding.length < 5) { toast('Describe what you found (5+ characters)'); return; }
    const croId = document.getElementById('failCro').value || null;
    const state = Store.load();
    const audit = currentAudit(state);
    const idx = nextUnmarkedIndex(audit);
    const cp = CHECKPOINTS[idx];
    if (cp.photo_required_on_fail && FailDraft.photos.length === 0) {
      toast('Photo evidence is required for Cash & Inventory fails.');
      return;
    }
    markCheckpoint(cp.id, 'F', { finding, croId, photos: FailDraft.photos.slice() });
    FailDraft.reset();
    closeModal();
    render();
    return;
  }
  if (action === 'modal-save-na') {
    const reason = document.getElementById('naReason').value.trim();
    if (reason.length < 3) { toast('Add a short reason'); return; }
    const state = Store.load();
    const audit = currentAudit(state);
    const idx = nextUnmarkedIndex(audit);
    const cp = CHECKPOINTS[idx];
    markCheckpoint(cp.id, 'NA', { finding: reason });
    closeModal();
    render();
    return;
  }

  if (action === 'submit-audit') {
    const submitted = submitAudit();
    if (submitted) {
      toast(`Audit submitted: ${submitted.score.pct.toFixed(1)}% ${bandLabel(submitted.score.band)}`);
    }
    render();
    return;
  }
  if (action === 'cancel-audit') {
    if (!confirm('Discard this draft? Your marks will be lost.')) return;
    const state = Store.load();
    state.audits = state.audits.filter(x => x.id !== state.current_audit_id);
    state.current_audit_id = null;
    Store.save(state);
    render();
    return;
  }

  if (action === 'open-history') {
    const state = Store.load();
    const found = audit(a.dataset.id, state);
    if (found) historyDetailModal(found);
    return;
  }
  if (action === 'print-audit') {
    printAudit(a.dataset.id);
    return;
  }
  if (action === 'export-csv')     { exportCsv(); return; }
  if (action === 'backup-drive')   { backupToDrive(); return; }
  if (action === 'restore-backup') { restoreFromBackup(); return; }
  if (action === 'clear-data') {
    if (!confirm('Erase all audits and CROs from this device? This cannot be undone.')) return;
    localStorage.removeItem(STORE_KEY);
    render();
    switchTab('audit');
    toast('All data erased');
    return;
  }
});

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + name));
}

// PIN pad keypress dispatch — runs only while body.locked.
async function handlePinKey(k) {
  if (k === 'forgot') {
    alert(
      'Forgot PIN?\n\n' +
      'Ask the Owner to reset it in Settings → Users.\n\n' +
      'If you ARE the Owner, you\'ll need to erase all data in your phone\'s Settings → Apps → Saagar Audit → Storage → Clear data. ' +
      'Restoring a Drive backup afterwards will bring your audits back.'
    );
    return;
  }
  if (LoginGuard.isLocked() && !document.querySelector('#ownerName')) {
    // Locked from login attempts — ignore numeric input.
    return;
  }
  if (k === 'back') {
    if (PinBuf.value.length > 0) PinBuf.value = PinBuf.value.slice(0, -1);
    render();
    return;
  }
  if (!/^[0-9]$/.test(k)) return;
  if (PinBuf.value.length >= 4) return;
  PinBuf.value += k;
  // Re-render dots only — avoid full render mid-input to keep dropdown selection.
  const dotsEl = document.querySelector('.pin-dots');
  if (dotsEl) {
    [...dotsEl.querySelectorAll('.dot')].forEach((d, i) => {
      d.classList.toggle('filled', PinBuf.value.length > i);
    });
  }
  if (PinBuf.value.length === 4) {
    setTimeout(() => onPinComplete(), 80);
  }
}

async function onPinComplete() {
  const stage = window._setupStage;
  const pin = PinBuf.value;
  // First-time setup flow
  if (document.querySelector('#auth-screen .auth-brand .sub')?.textContent === 'FIRST-TIME SETUP') {
    if (stage === 'pin') {
      window._setupPin = pin;
      window._setupStage = 'confirm';
      PinBuf.reset();
      render();
      return;
    }
    if (stage === 'confirm') {
      if (pin !== window._setupPin) {
        PinBuf.value = ''; PinBuf.shake = true;
        const err = document.getElementById('setupErr');
        if (err) { err.textContent = 'PINs do not match. Try again.'; err.hidden = false; }
        render();
        setTimeout(() => { PinBuf.shake = false; window._setupStage = 'pin'; PinBuf.reset(); render(); }, 400);
        return;
      }
      const u = await Users.create({ name: window._setupOwnerName, role: 'OWNER', pin });
      AuthSession.login(u.id);
      window._setupOwnerName = null;
      window._setupPin = null;
      window._setupStage = null;
      PinBuf.reset();
      toast('Welcome, ' + u.name);
      render();
      return;
    }
  }
  // Login flow
  const select = document.getElementById('loginUser');
  const userId = select ? select.value : window._loginUserId;
  if (!userId) return;
  const state = Store.load();
  const u = Users.byId(state, userId);
  if (!u) return;
  const ok = await verifyPin(pin, u.pin_salt, u.pin_hash);
  LoginGuard.register(ok);
  if (ok) {
    AuthSession.login(u.id);
    PinBuf.reset();
    render();
  } else {
    PinBuf.value = ''; PinBuf.shake = true;
    const err = document.getElementById('loginErr');
    if (err) {
      if (LoginGuard.isLocked()) {
        err.textContent = `Locked for ${LoginGuard.secondsLeft()}s.`;
      } else {
        err.textContent = 'Wrong PIN. Try again.';
      }
      err.hidden = false;
    }
    render();
    setTimeout(() => { PinBuf.shake = false; render(); }, 400);
  }
}

// Keep PIN buffer in sync when user changes login dropdown
document.addEventListener('change', (e) => {
  if (e.target.id === 'loginUser') {
    window._loginUserId = e.target.value;
    PinBuf.reset();
    render();
  }
});

// Hardware/keyboard support: numbers + backspace work in PIN entry.
document.addEventListener('keydown', (e) => {
  if (!document.body.classList.contains('locked')) return;
  if (document.activeElement && ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key >= '0' && e.key <= '9') { handlePinKey(e.key); e.preventDefault(); return; }
  if (e.key === 'Backspace') { handlePinKey('back'); e.preventDefault(); return; }
});

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------

render();
  </script>
