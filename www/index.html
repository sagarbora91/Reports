<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d2340">
  <title>Saagar Audit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* Saagar Traders retail design system — same palette + fonts as the
   existing HTML grooming audit tool. */

:root {
  --navy:        #0d2340;
  --navy-mid:    #1a3a5c;
  --navy-light:  #264d7a;
  --gold:        #b8922a;
  --gold-light:  #d4a843;
  --gold-pale:   #fdf6e3;
  --cream:       #faf8f3;
  --white:       #ffffff;

  --red:         #b91c1c;
  --red-pale:    #fef2f2;
  --amber:       #b45309;
  --amber-pale:  #fffbeb;
  --green:       #166534;
  --green-pale:  #f0fdf4;
  --green-mid:   #bbf7d0;

  --gray-100:    #f4f4f5;
  --gray-200:    #e4e4e7;
  --gray-300:    #d4d4d8;
  --gray-400:    #a1a1aa;
  --gray-600:    #52525b;
  --gray-800:    #27272a;

  --shadow:      0 2px 12px rgba(13,35,64,0.08);
  --radius:      10px;

  --safe-top:    env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
  background: var(--cream);
  color: var(--gray-800);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: contain;
}

button { font-family: inherit; }
input, textarea, select {
  font-family: inherit;
  font-size: 16px; /* prevent iOS zoom-on-focus */
}

/* --- top bar --- */
.topbar {
  background: var(--navy);
  color: var(--white);
  padding: calc(var(--safe-top) + 12px) 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 10;
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand-serif {
  font-family: 'DM Serif Display', serif;
  font-size: 26px;
  color: var(--gold-light);
  letter-spacing: 0.3px;
}
.brand-sans {
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--white);
  opacity: 0.85;
}
.iconbtn {
  background: transparent;
  border: 0;
  color: var(--white);
  font-size: 20px;
  cursor: pointer;
  /* 44pt touch target (iOS HIG / Material accessibility floor). The smaller
     pre-Stage-A padding made some controls (+ Add CRO, Edit ›) hard to hit on
     small phones. The builder-cp-actions .iconbtn override at line ~1153
     restores a compact variant for inline edit controls inside the builder. */
  padding: 10px 12px;
  min-width: 44px;
  min-height: 44px;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.iconbtn:active { background: rgba(255,255,255,0.1); }

/* --- tabs --- */
.tabs {
  background: var(--navy-mid);
  display: flex;
  border-bottom: 1px solid var(--navy-light);
  position: sticky;
  top: 56px;
  z-index: 9;
}
.tab {
  flex: 1;
  background: transparent;
  border: 0;
  color: rgba(255,255,255,0.7);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 14px 0;
  cursor: pointer;
  border-bottom: 3px solid transparent;
}
.tab.active {
  color: var(--gold-light);
  border-bottom-color: var(--gold-light);
}
a.tab.tab-link {
  display: block;
  text-align: center;
  text-decoration: none;
  line-height: 1; /* match button intrinsic height */
}

/* --- content --- */
main { padding: 16px 16px calc(var(--safe-bottom) + 24px); max-width: 720px; margin: 0 auto; }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* --- cards --- */
.card {
  background: var(--white);
  border: 1px solid var(--gray-200);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  margin-bottom: 12px;
}
.card h2 {
  font-family: 'DM Serif Display', serif;
  font-size: 20px;
  color: var(--navy);
  margin: 0 0 8px;
}
.card p { margin: 4px 0; color: var(--gray-600); }
.muted { color: var(--gray-600); font-size: 14px; }
.tiny  { color: var(--gray-400); font-size: 12px; letter-spacing: 1px; }

/* --- buttons --- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 16px 18px;
  border-radius: var(--radius);
  border: 0;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.05s;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--navy); color: var(--white); }
.btn-secondary { background: var(--gold-pale); color: var(--navy); border: 1px solid var(--gold); }
.btn-ghost { background: transparent; color: var(--navy); border: 1px solid var(--gray-300); }
.btn-pass { background: var(--green); color: var(--white); padding: 22px; font-size: 22px; letter-spacing: 3px; font-family: 'DM Serif Display', serif; }
.btn-fail { background: var(--red);   color: var(--white); padding: 22px; font-size: 22px; letter-spacing: 3px; font-family: 'DM Serif Display', serif; }
.btn-na   { background: var(--white); color: var(--gray-800); border: 1px solid var(--gray-300); padding: 14px; font-weight: 600; letter-spacing: 2px; }
.btn-row { display: grid; gap: 10px; }

/* --- form bits --- */
label.field {
  display: block;
  margin-bottom: 14px;
}
label.field > span {
  display: block;
  font-size: 13px;
  color: var(--gray-600);
  margin-bottom: 6px;
}
input[type=text], input[type=date], textarea, select {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--gray-300);
  border-radius: var(--radius);
  background: var(--white);
  color: var(--gray-800);
}
textarea { resize: vertical; min-height: 80px; }

/* --- checkpoint screen --- */
.progress {
  height: 4px;
  background: var(--gray-200);
  border-radius: 2px;
  overflow: hidden;
  margin: 0 0 12px;
}
.progress > span {
  display: block;
  height: 100%;
  background: var(--gold);
  transition: width 0.2s ease-out;
}
.cp-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  font-size: 12px;
  color: var(--gray-400);
}
.sop-chip {
  background: var(--gray-100);
  color: var(--navy);
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
}
.sop-chip.critical { background: var(--gold-pale); color: var(--gold); }
.sop-chip.critical::before { content: '★ '; }
.cp-text {
  font-family: 'DM Serif Display', serif;
  font-size: 26px;
  line-height: 1.25;
  color: var(--navy);
  margin: 8px 0 12px;
}
.cp-evidence {
  font-size: 13px;
  color: var(--gray-600);
  margin-bottom: 10px;
}
.photo-required-badge {
  display: inline-block;
  background: var(--red-pale);
  color: var(--red);
  border: 1px solid var(--red);
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
}
.minicounts {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 14px;
}
.minicount { text-align: center; }
.minicount .n {
  font-family: 'DM Serif Display', serif;
  font-size: 20px;
  display: block;
}
.minicount.p .n { color: var(--green); }
.minicount.f .n { color: var(--red); }
.minicount.na .n { color: var(--gray-600); }
.minicount .lbl { font-size: 11px; color: var(--gray-600); }

/* --- score display --- */
.score-card {
  text-align: center;
  padding: 28px 16px;
}
.score-pct {
  font-family: 'DM Serif Display', serif;
  font-size: 72px;
  line-height: 1;
  margin: 8px 0;
}
.score-pct.excellent, .score-pct.good { color: var(--green); }
.score-pct.fair { color: var(--amber); }
.score-pct.poor, .score-pct.critical { color: var(--red); }
.score-band {
  font-size: 13px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--gray-600);
}
.score-band.excellent, .score-band.good { color: var(--green); }
.score-band.fair { color: var(--amber); }
.score-band.poor, .score-band.critical { color: var(--red); }

/* --- history rows --- */
.hist-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  background: var(--white);
  border: 1px solid var(--gray-200);
  border-radius: var(--radius);
  margin-bottom: 8px;
}
.hist-row strong { font-family: 'DM Serif Display', serif; font-size: 16px; color: var(--navy); }
.hist-row .pct { font-weight: 700; }
.hist-row .pct.excellent, .hist-row .pct.good { color: var(--green); }
.hist-row .pct.fair { color: var(--amber); }
.hist-row .pct.poor, .hist-row .pct.critical { color: var(--red); }

/* --- modal --- */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(13,35,64,0.5);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 100;
  padding: 0;
}
.modal {
  background: var(--white);
  border-radius: 16px 16px 0 0;
  width: 100%; max-width: 720px;
  padding: 20px 16px calc(var(--safe-bottom) + 20px);
  max-height: 90vh; overflow: auto;
}
.modal h3 { font-family: 'DM Serif Display', serif; margin: 0 0 4px; color: var(--navy); font-size: 20px; }
.modal .row { display: flex; gap: 10px; margin-top: 14px; }
.modal .row > * { flex: 1; }

/* --- toast --- */
.toast {
  position: fixed;
  bottom: calc(var(--safe-bottom) + 24px);
  left: 50%; transform: translateX(-50%);
  background: var(--navy);
  color: var(--white);
  padding: 10px 16px;
  border-radius: 999px;
  font-size: 14px;
  box-shadow: var(--shadow);
  z-index: 200;
}

/* --- CRO list rows --- */
.cro-row {
  display: flex;
  align-items: center;
  padding: 8px 4px;
  border-bottom: 1px solid var(--gray-200);
}
.cro-row label { flex: 1; cursor: pointer; }
.cro-row .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--gray-100); color: var(--gray-600); margin-left: 8px; }

/* helpers */
.row-spread { display: flex; justify-content: space-between; align-items: center; }
.error { color: var(--red); font-size: 13px; margin-top: 6px; }
.spacer-12 { height: 12px; }
.spacer-24 { height: 24px; }
hr.soft { border: 0; border-top: 1px solid var(--gray-200); margin: 16px 0; }

/* --- photo grid (fail modal + audit detail) --- */
.photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 8px;
}
.photo-tile {
  position: relative;
  aspect-ratio: 1 / 1;
  border-radius: 8px;
  overflow: hidden;
  background: var(--gray-200);
  cursor: pointer;
}
.photo-tile img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.photo-remove {
  position: absolute;
  top: 4px; right: 4px;
  width: 26px; height: 26px;
  border-radius: 50%;
  background: rgba(0,0,0,0.65);
  color: white;
  border: 0;
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  padding: 0;
}
.req-pill {
  display: inline-block;
  background: var(--red);
  color: var(--white);
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  margin-left: 4px;
  vertical-align: middle;
}

/* --- audit detail (history modal) --- */
.detail-sop {
  margin: 14px 0;
}
.detail-sop-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--gray-100);
  border-radius: 8px;
  margin-bottom: 8px;
  font-weight: 600;
  font-size: 14px;
  color: var(--navy);
}
.detail-sop-header.critical { background: var(--gold-pale); color: var(--gold); }
.detail-sop-header.critical::before { content: '★ '; }
.detail-sop-header .count {
  margin-left: auto;
  font-weight: 400;
  font-size: 12px;
  color: var(--gray-600);
}
.result-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 8px;
  border-bottom: 1px solid var(--gray-200);
  font-size: 14px;
}
.result-row:last-child { border-bottom: 0; }
.result-row .cp-id { font-weight: 600; color: var(--gray-600); min-width: 36px; font-variant-numeric: tabular-nums; }
.result-row .cp-body { flex: 1; }
.result-row .cp-finding { color: var(--gray-600); font-size: 13px; margin-top: 4px; }
.verdict-pill {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  padding: 2px 8px;
  border-radius: 999px;
  white-space: nowrap;
  min-width: 36px;
  text-align: center;
}
.verdict-pill.P  { background: var(--green-pale); color: var(--green); }
.verdict-pill.F  { background: var(--red-pale);   color: var(--red); }
.verdict-pill.NA { background: var(--gray-100);   color: var(--gray-600); }
.detail-photos {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 6px;
}
.detail-photos img {
  width: 64px; height: 64px;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid var(--gray-200);
}

/* --- CRO performance summary --- */
.cro-summary {
  background: var(--white);
  border: 1px solid var(--gray-200);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
}
.cro-summary h3 {
  margin: 0 0 8px;
  font-family: 'DM Serif Display', serif;
  font-size: 16px;
  color: var(--navy);
}
.cro-rank {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid var(--gray-200);
  font-size: 14px;
}
.cro-rank:last-child { border-bottom: 0; }
.cro-rank .badge {
  background: var(--red-pale);
  color: var(--red);
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
}

/* --- resume banner --- */
.resume-banner {
  background: var(--amber-pale);
  border: 1px solid var(--amber);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 16px;
}
.resume-banner h3 {
  font-family: 'DM Serif Display', serif;
  font-size: 18px;
  color: var(--amber);
  margin: 0 0 4px;
}

/* --- auth screens (locked state) --- */
body.locked .topbar,
body.locked .tabs,
body.locked main,
body.locked #toast,
body.locked #modal-root,
body.locked #print-root {
  display: none !important;
}
#auth-screen {
  min-height: 100vh;
  background: var(--cream);
  display: none;
  padding: calc(var(--safe-top) + 24px) 16px calc(var(--safe-bottom) + 24px);
}
body.locked #auth-screen { display: block; }

.auth-wrap {
  max-width: 480px;
  margin: 0 auto;
}
.auth-brand {
  text-align: center;
  margin-bottom: 28px;
}
.auth-brand .serif {
  font-family: 'DM Serif Display', serif;
  font-size: 38px;
  color: var(--navy);
  line-height: 1;
}
.auth-brand .sub {
  font-size: 11px;
  letter-spacing: 4px;
  color: var(--gold);
  margin-top: 6px;
}
.auth-card {
  background: var(--white);
  border: 1px solid var(--gray-200);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 24px 20px;
}
.auth-card h2 {
  font-family: 'DM Serif Display', serif;
  font-size: 22px;
  color: var(--navy);
  margin: 0 0 4px;
}
.auth-card p { color: var(--gray-600); font-size: 14px; margin: 0 0 16px; }

/* --- PIN input dots + numpad --- */
.pin-dots {
  display: flex;
  gap: 14px;
  justify-content: center;
  margin: 20px 0;
}
.pin-dots .dot {
  width: 16px; height: 16px;
  border-radius: 50%;
  border: 1.5px solid var(--navy);
  background: transparent;
}
.pin-dots .dot.filled { background: var(--navy); }
.pin-dots.shake { animation: shake 0.4s; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  75% { transform: translateX(8px); }
}
.numpad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  max-width: 320px;
  margin: 0 auto;
}
.numpad button {
  height: 64px;
  background: var(--white);
  border: 1px solid var(--gray-300);
  border-radius: 12px;
  font-family: 'DM Serif Display', serif;
  font-size: 24px;
  color: var(--navy);
  cursor: pointer;
}
.numpad button:active { background: var(--gray-100); }
.numpad button.muted { color: var(--gray-600); font-size: 14px; font-family: 'DM Sans', sans-serif; }
.numpad button[data-key="back"] { background: var(--gray-100); }

/* --- user badge in topbar --- */
#userBadge {
  display: flex;
  align-items: center;
  gap: 8px;
}
#userBadge .name { color: var(--white); font-size: 14px; font-weight: 500; }
#userBadge .role {
  font-size: 9px;
  letter-spacing: 1.5px;
  color: var(--gold-light);
  background: var(--navy-mid);
  padding: 2px 6px;
  border-radius: 4px;
}
#userBadge button {
  background: transparent;
  border: 0;
  color: var(--white);
  font-size: 18px;
  cursor: pointer;
  padding: 4px 8px;
}

/* --- user list rows in Settings --- */
.user-row {
  display: flex;
  align-items: center;
  padding: 10px 4px;
  border-bottom: 1px solid var(--gray-200);
}
.user-row:last-child { border-bottom: 0; }
.user-row .info { flex: 1; }
.user-row .info .name { font-weight: 600; color: var(--navy); }
.user-row .info .meta { font-size: 12px; color: var(--gray-600); margin-top: 2px; }
.role-pill {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  padding: 3px 8px;
  border-radius: 999px;
  margin-left: 6px;
}
.role-pill.OWNER { background: var(--gold-pale); color: var(--gold); }
.role-pill.GM    { background: var(--navy);      color: var(--white); }
.role-pill.SM    { background: var(--gray-100);  color: var(--navy); }
.role-pill.inactive { background: var(--gray-200); color: var(--gray-600); }

/* --- print --- */
@media print {
  @page { margin: 16mm 12mm; }
  body { background: white; }
  body.printing > *:not(#print-root) { display: none !important; }
  #print-root { display: block !important; }
  .no-print { display: none !important; }
}
#print-root { display: none; }
.print-page { font-family: 'DM Sans', system-ui, sans-serif; color: #111; }
.print-page h1 { font-family: 'DM Serif Display', serif; color: var(--navy); margin: 0 0 4px; font-size: 26px; }
.print-page h2 { font-family: 'DM Serif Display', serif; color: var(--navy); margin: 18px 0 6px; font-size: 16px; border-bottom: 1px solid #ccc; padding-bottom: 2px; }
.print-page .meta { color: #555; font-size: 12px; margin-bottom: 12px; }
.print-page .pscore { font-size: 36px; font-family: 'DM Serif Display', serif; }
.print-page table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
.print-page th, .print-page td { border: 1px solid #ccc; padding: 4px 6px; vertical-align: top; text-align: left; }
.print-page th { background: #f0f0f0; }
.print-page .photo-row img { max-width: 100px; max-height: 100px; margin: 2px; border: 1px solid #ccc; }

/* --- CAPs tab --- */
.tab { position: relative; }
.tab-badge {
  display: inline-block;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  margin-left: 6px;
  background: var(--red);
  color: var(--white);
  font-size: 10px;
  font-weight: 700;
  line-height: 18px;
  text-align: center;
  border-radius: 9px;
  vertical-align: 1px;
  font-family: 'DM Sans', sans-serif;
  letter-spacing: 0;
  text-transform: none;
}

.filter-chips {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 8px;
  margin-bottom: 8px;
  -webkit-overflow-scrolling: touch;
}
.filter-chip {
  flex: 0 0 auto;
  background: var(--white);
  border: 1px solid var(--gray-300);
  color: var(--gray-800);
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}
.filter-chip.active {
  background: var(--navy);
  color: var(--white);

// ---------------------------------------------------------------------------
// CapacitorSqlDriver — the SqlDriver the SqliteBackend uses ON DEVICE. Wraps
// the raw @capacitor-community/sqlite plugin (accessed the same no-bundler way
// shell.js reaches its plugins: window.Capacitor.Plugins.CapacitorSQLite).
//
// Device-only: every method runs behind the SqliteBackend, which only activates
// when the Owner opts in on a device. On web/harness this object is defined but
// never instantiated. Validated by the on-device smoke test (Inc.4) — the Node
// suite exercises the SAME SqliteBackend through the sql.js driver instead.
//
// Implements: open / close / exec / run / query / batch (all async).
// ---------------------------------------------------------------------------
function CapacitorSqlDriver(dbName) {
  this.dbName = dbName || 'saagar_audit';
}
CapacitorSqlDriver.prototype._plugin = function () {
  const SQ = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorSQLite;
  if (!SQ) throw new Error('CapacitorSQLite plugin unavailable');
  return SQ;
};
CapacitorSqlDriver.prototype.open = async function () {
  const SQ = this._plugin();
  // Create a no-encryption connection (idempotent — ignore "already exists"),
  // then open it. version 1; readonly false.
  try {
    await SQ.createConnection({ database: this.dbName, encrypted: false, mode: 'no-encryption', version: 1, readonly: false });
  } catch (e) {
    if (!/exist/i.test(String(e && e.message || e))) throw e;   // connection already created — fine
  }
  await SQ.open({ database: this.dbName, readonly: false });
  // WAL journal for crash-safe commits; ignore if the platform rejects it.
  try { await SQ.execute({ database: this.dbName, statements: 'PRAGMA journal_mode=WAL;', transaction: false }); } catch (_) {}
};
CapacitorSqlDriver.prototype.close = async function () {
  const SQ = this._plugin();
  try { await SQ.close({ database: this.dbName, readonly: false }); } catch (_) {}
  try { await SQ.closeConnection({ database: this.dbName, readonly: false }); } catch (_) {}
};
CapacitorSqlDriver.prototype.exec = async function (sql) {
  // Multi-statement DDL/pragma. transaction:false so PRAGMA isn't wrapped.
  await this._plugin().execute({ database: this.dbName, statements: sql, transaction: false });
};
CapacitorSqlDriver.prototype.run = async function (sql, params) {
  const r = await this._plugin().run({ database: this.dbName, statement: sql, values: params || [], transaction: false });
  return { changes: (r && r.changes && r.changes.changes) || 0 };
};
CapacitorSqlDriver.prototype.query = async function (sql, params) {
  const r = await this._plugin().query({ database: this.dbName, statement: sql, values: params || [] });
  return (r && r.values) || [];
};
CapacitorSqlDriver.prototype.batch = async function (stmts) {
  // executeSet runs the whole set atomically (one transaction) — exactly the
  // BEGIN…COMMIT semantics _flushOne relies on. A failure rolls the set back.
  const set = stmts.map(function (s) { return { statement: s.sql, values: s.params || [] }; });
  await this._plugin().executeSet({ database: this.dbName, set: set, transaction: true });
};

if (typeof window !== 'undefined') window.CapacitorSqlDriver = CapacitorSqlDriver;
// ---------------------------------------------------------------------------
// SqliteBackend — a Persistence backend that stores the app state in SQLite
// (device only, OFF BY DEFAULT). Implements the same synchronous read contract
// as LocalStorageBackend so Store.load()/save() and every call site are
// unchanged; durability + scale come from a relational-rows + JSON-column
// schema behind an async write queue.
//
// Built to agent_outputs/sqlite_migration_spec_final.md (9-agent design +
// 3 adversarial data-safety reviews). Tested in Node via sql.js (qa/
// sqlite_tests.js) BEFORE it ever runs on a device.
//
// SqlDriver interface (both the sql.js test driver and the device Capacitor
// driver implement this; all async):
//   open(): Promise<void>
//   close(): Promise<void>
//   exec(sql): Promise<void>                     // DDL/pragma, multi-statement
//   run(sql, params?): Promise<{changes:number}> // single bound write
//   query(sql, params?): Promise<Array<Object>>  // rows as plain objects
//   batch(stmts): Promise<void>                   // [{sql,params}] in ONE txn
// ---------------------------------------------------------------------------

const SQLITE_SCHEMA_DDL = [
  "CREATE TABLE IF NOT EXISTS audits (id TEXT PRIMARY KEY, date TEXT, status TEXT, week TEXT, store_id TEXT, template_id TEXT, data TEXT);",
  "CREATE TABLE IF NOT EXISTS caps (id TEXT PRIMARY KEY, status TEXT, store_id TEXT, data TEXT);",
  "CREATE TABLE IF NOT EXISTS escalations (id TEXT PRIMARY KEY, store_id TEXT, data TEXT);",
  "CREATE TABLE IF NOT EXISTS users (id TEXT PRIMARY KEY, data TEXT);",
  "CREATE TABLE IF NOT EXISTS cros (id TEXT PRIMARY KEY, store_id TEXT, data TEXT);",
  "CREATE TABLE IF NOT EXISTS templates (id TEXT PRIMARY KEY, data TEXT);",
  "CREATE TABLE IF NOT EXISTS template_snapshots (key TEXT PRIMARY KEY, data TEXT);",
  "CREATE TABLE IF NOT EXISTS meta (k TEXT PRIMARY KEY, v TEXT);",
  "CREATE INDEX IF NOT EXISTS ix_audits_date ON audits(date);",
  "CREATE INDEX IF NOT EXISTS ix_audits_status ON audits(status);",
  "CREATE INDEX IF NOT EXISTS ix_audits_week ON audits(week);",
  "CREATE INDEX IF NOT EXISTS ix_caps_status ON caps(status);",
].join("\n");

// entity collection -> table + indexed columns. Everything else on `state`
// (scalars like schema_version / current_audit_id / last_backup_at / last_tab /
// disable_strict_modals / _demo / future keys) is round-tripped via `meta`.
const SQLITE_TABLES = [
  { key: 'audits', table: 'audits', idCol: 'id',
    cols: ['id', 'date', 'status', 'week', 'store_id', 'template_id'],
    colVals: o => [o.id, o.date || null, o.status || null,
      (o.year != null && o.week_number != null) ? (o.year + '-' + o.week_number) : null,
      o.store_id || null, o.template_id || null] },
  { key: 'caps', table: 'caps', idCol: 'id', cols: ['id', 'status', 'store_id'],
    colVals: o => [o.id, o.status || null, o.store_id || null] },
  { key: 'escalations', table: 'escalations', idCol: 'id', cols: ['id', 'store_id'],
    colVals: o => [o.id, o.store_id || null] },
  { key: 'users', table: 'users', idCol: 'id', cols: ['id'], colVals: o => [o.id] },
  { key: 'cros', table: 'cros', idCol: 'id', cols: ['id', 'store_id'],
    colVals: o => [o.id, o.store_id || null] },
  { key: 'templates', table: 'templates', idCol: 'id', cols: ['id'], colVals: o => [o.id] },
  { key: 'template_snapshots', table: 'template_snapshots', idCol: 'key', dict: true,

// for objects, order-SENSITIVE for arrays (audits/photos are ordered). Strict
// on primitives. Treats NaN as unequal so a silently-coerced number is caught.
// Compares the LIVE object vs the SQLite read-back (not two JSON copies), so
// JSON-only artifacts (NaN/Infinity/undefined/-0) surface as diffs.
function sqliteDeepEqual(a, b, path) {
  path = path || '$';
  if (a === b) return { ok: true };
  if (typeof a === 'number' && typeof b === 'number') {
    if (a === b) return { ok: true };
    return { ok: false, path: path + ' (number ' + a + ' vs ' + b + ')' };
  }
  if (a === null || b === null || typeof a !== 'object' || typeof b !== 'object') {
    return { ok: false, path: path + ' (' + JSON.stringify(a) + ' vs ' + JSON.stringify(b) + ')' };
  }
  const aArr = Array.isArray(a), bArr = Array.isArray(b);
  if (aArr !== bArr) return { ok: false, path: path + ' (array/object mismatch)' };
  if (aArr) {
    if (a.length !== b.length) return { ok: false, path: path + ' (length ' + a.length + ' vs ' + b.length + ')' };
    for (let i = 0; i < a.length; i++) {
      const r = sqliteDeepEqual(a[i], b[i], path + '[' + i + ']');
      if (!r.ok) return r;
    }
    return { ok: true };
  }
  const ak = Object.keys(a), bk = Object.keys(b);
  if (ak.length !== bk.length) return { ok: false, path: path + ' (keys ' + ak.length + ' vs ' + bk.length + ')' };
  for (const k of ak) {
    if (!Object.prototype.hasOwnProperty.call(b, k)) return { ok: false, path: path + '.' + k + ' (missing)' };
    const r = sqliteDeepEqual(a[k], b[k], path + '.' + k);
    if (!r.ok) return r;
  }
  return { ok: true };
}

const SqliteBackend = {
  _driver: null,
  _mirrorJson: null,      // canonical state as a JSON string (localStorage-identical read semantics)
  _lastSnapshot: null,    // the state most recently COMMITTED to SQLite (diff base)

  _timer: null,
  _writeFailed: false,
  _suspectEmpty: false,

  // ---- reads (synchronous, never null/undefined) ----
  readPersisted() {

  // ---- writes ----
  writePersisted(state) {

  },
  writePersistedFlush(state) {
    if (Persistence._migrating) { this._pendingJson = JSON.stringify(state); return Promise.resolve(); }

  },
  _flushTier() {

    // can never overwrite a newer flush.

  // Serialize all writes through a single promise chain; snapshot is captured
  // immutably (the JSON string), the diff is computed INSIDE _flushOne.

  // ---- the diff-upsert: one atomic transaction, fail-safe ----
  async _flushOne(state) {

'use strict';

// ---------------------------------------------------------------------------
// Storage
// ---------------------------------------------------------------------------

const STORE_KEY = 'saagar_audit_v1';

// SQLite opt-in flag — DEVICE-LOCAL, deliberately NOT part of the synced state

// Current persisted-state schema version. Bump when the SHAPE of stored data
// changes, and add a MIGRATIONS[oldVersion] step. Old data with no
// schema_version is treated as v0 (the pre-versioning shape, which already
// matches v1) and normalized on first load.
const SCHEMA_VERSION = 2;

// migrations[N] transforms a state AT version N into version N+1.
const MIGRATIONS = [
  // index 0: v0 (pre-versioning) → v1. Pre-versioning data already matches the
  // v1 shape; the defensive normalize below does the backfill. Identity here.
  function (s) { return s; },
  // index 1: v1 → v2. De-duplicate per-audit `template_snapshot` copies into a
  // shared `template_snapshots` dictionary keyed by template-id + content hash,
  // replacing each audit's full copy with a small `snapshot_ref`. 6 months of
  // daily audits used to duplicate the full 68-checkpoint snapshot ~180×,
  // blowing the ~5 MB localStorage quota; sharing collapses that to one copy
  // per distinct template version. Immunity is preserved: a later template edit
  // hashes to a NEW key, so past audits keep pointing at their original snapshot.
  function (s) {
    s.template_snapshots = s.template_snapshots || {};
    (s.audits || []).forEach(a => {
      if (a.template_snapshot && !a.snapshot_ref) {
        const snap = a.template_snapshot;
        const baseId = a.template_id || (a.audit_type === 'weekly' ? 'tpl_weekly' : 'tpl_daily');
        const key = baseId + '@' + snapHashOf(snap);
        if (!s.template_snapshots[key]) s.template_snapshots[key] = snap;
        a.snapshot_ref = key;
        delete a.template_snapshot;
      }

    return s;
  },

// Bring a freshly-parsed state up to SCHEMA_VERSION. `fromVersion` is read from
// the RAW parsed object (before merging with empty(), which would mask it).
// For already-current data this is a zero-cost early return — load() runs on
// every render, so it must stay cheap.
function migrateState(s, fromVersion) {
  if (fromVersion >= SCHEMA_VERSION) return s;
  let v = fromVersion;
  while (v < SCHEMA_VERSION && MIGRATIONS[v]) { s = MIGRATIONS[v](s) || s; v++; }
  // Defensive normalize — backfill required nested fields that an old or
  // hand-edited backup might be missing. NEVER overwrites present data.
  (s.audits || []).forEach(a => {
    if (a.results == null) a.results = {};
    if (a.cro_mode && a.cro_mode !== 'store' && a.cro_results == null) a.cro_results = {};
  });

// ---------------------------------------------------------------------------
// Persistence layer (SQLite migration — Increment 1)
//
// Store.load()/save() are the app's ONLY persistence chokepoint. They delegate
// to a swappable BACKEND, so a later increment can add a SQLite backend on the
// device while the browser + the Node test harness keep using localStorage,
// unchanged. A backend exposes two SYNCHRONOUS methods:
//   readPersisted()   -> the stored state object, or null if none
//   writePersisted(s) -> persist the state object

// ---------------------------------------------------------------------------

// localStorage backend = today's exact behaviour (plain JSON, LZString rescue

// The active backend. SQLite (device-only, OFF BY DEFAULT) is selected in a
// later increment; for now everything uses localStorage exactly as before.
const Persistence = {

  _ready: false,        // true once boot() resolves; gates the SQLite async path
  _migrating: false,    // latch: buffers live writes during a one-time migration

  // ASYNC. On device with SQLite opted-in, hydrate the SqliteBackend from the
  // device DB and ADOPT it; on any failure stay on localStorage. With no driver

  boot(driver) {
    const self = this;
    if (!driver) { this._ready = true; return Promise.resolve(); }
    return SqliteBackend.boot(driver)
      .then(function () { self.backend = SqliteBackend; })
      .catch(function (e) {

// Content hash of a template/snapshot's scoring-and-display-relevant shape.

      frequency: tpl.frequency, cro_mode: tpl.cro_mode,

const PhotoStore = {
  _db: null, _mem: {}, _ready: null, _useMem: false,
  init() {
    if (this._ready) return this._ready;
    const self = this;
    this._ready = new Promise(function (resolve) {
      try {
        if (typeof indexedDB === 'undefined') { self._useMem = true; resolve(); return; }
        const req = indexedDB.open(PHOTO_DB, 1);
        req.onupgradeneeded = function (e) { e.target.result.createObjectStore(PHOTO_STORE_NAME); };
        req.onsuccess = function (e) { self._db = e.target.result; resolve(); };
        req.onerror = function () { self._useMem = true; resolve(); };
      } catch (_) { self._useMem = true; resolve(); }
    });
    return this._ready;
  },
  _os(mode) { return this._db.transaction(PHOTO_STORE_NAME, mode).objectStore(PHOTO_STORE_NAME); },
  put(id, dataUrl) {
    const self = this;
    return this.init().then(function () {
      if (self._useMem || !self._db) { self._mem[id] = dataUrl; return id; }
      return new Promise(function (resolve, reject) {
        const r = self._os('readwrite').put(dataUrl, id);
        r.onsuccess = function () { resolve(id); };
        r.onerror = function () { reject(r.error); };
      });
    });
  },
  get(id) {
    const self = this;
    return this.init().then(function () {
      if (self._useMem || !self._db) return self._mem[id] != null ? self._mem[id] : null;
      return new Promise(function (resolve) {
        const r = self._os('readonly').get(id);
        r.onsuccess = function () { resolve(r.result != null ? r.result : null); };
        r.onerror = function () { resolve(null); };
      });
    });
  },
  remove(id) {
    const self = this;
    return this.init().then(function () {
      if (self._useMem || !self._db) { delete self._mem[id]; return; }
      return new Promise(function (resolve) {
        const r = self._os('readwrite').delete(id);
        r.onsuccess = function () { resolve(); };
        r.onerror = function () { resolve(); };
      });
    });
  },
};

function isPhotoId(s) { return typeof s === 'string' && s.indexOf('ph_') === 0; }
function isDataUrl(s) { return typeof s === 'string' && s.indexOf('data:') === 0; }

// Visit every photo array in a state (daily results, per-CRO results, CAPs).
// The visitor may mutate the array in place.
function forEachPhotoArray(state, visitor) {
  (state.audits || []).forEach(function (a) {
    Object.values(a.results || {}).forEach(function (r) { if (r && Array.isArray(r.photos)) visitor(r.photos); });
    Object.values(a.cro_results || {}).forEach(function (b) { Object.values(b || {}).forEach(function (r) { if (r && Array.isArray(r.photos)) visitor(r.photos); }); });
  });
  (state.caps || []).forEach(function (c) { if (c && Array.isArray(c.photos)) visitor(c.photos); });
}

// Move any inline data-URL photos in the live store into IndexedDB, replacing
// them with IDs. Runs at boot; no-op once everything is an ID.
function migratePhotosToIDB() {
  return PhotoStore.init().then(function () {
    const state = Store.load();
    const puts = [];
    forEachPhotoArray(state, function (arr) {
      for (let i = 0; i < arr.length; i++) {
        if (isDataUrl(arr[i])) {
          const id = 'ph_' + uuid();
          puts.push(PhotoStore.put(id, arr[i]));
          arr[i] = id;
        }
      }
    });
    if (!puts.length) return 0;
    return Promise.all(puts).then(function () { Store.save(state); return puts.length; });
  });
}

// Deep copy of a state with photo IDs rehydrated to inline data URLs, for a
// self-contained backup that restores on any device.
function inlinePhotosForBackup(state) {
  return PhotoStore.init().then(function () {
    const copy = JSON.parse(JSON.stringify(state));
    const jobs = [];
    forEachPhotoArray(copy, function (arr) {
      arr.forEach(function (v, idx) {
        if (isPhotoId(v)) {
          jobs.push(PhotoStore.get(v).then(function (url) { if (url) arr[idx] = url; }));
        }
      });
    });
    return Promise.all(jobs).then(function () { return copy; });
  });
}

// Hydrate <img data-photo> elements: data: URLs set directly; ph_ IDs fetched
// from IndexedDB. Returns a promise that resolves once all srcs are set (used
// by the print path, which must wait before window.print()).
function hydratePhotos(root) {
  if (!root || !root.querySelectorAll) return Promise.resolve();
  const jobs = [];
  root.querySelectorAll('img[data-photo]').forEach(function (img) {
    const v = img.getAttribute('data-photo');
    img.removeAttribute('data-photo');
    if (!v) return;
    if (isDataUrl(v)) { img.src = v; return; }
    jobs.push(PhotoStore.get(v).then(function (url) { if (url) img.src = url; }));
  });
  return Promise.all(jobs);
}

// Emit an <img> that hydratePhotos() will fill — accepts a photo ID or a
// legacy inline data URL.
function photoImg(entry, alt) {
  return '<img data-photo="' + escapeHtml(entry) + '" alt="' + escapeHtml(alt || '') + '">';
}

// ---------------------------------------------------------------------------
// Audit templates — checklists are DATA now, not code. Built-ins (daily,
// weekly) are seeded from the factory constants below; the user can edit them
// and create new daily/weekly/monthly/custom templates in the builder UI.
//
// Template shape:
//   { id, name, name_mr, frequency, cro_mode, built_in, active,
//     sections: [ {id, name, name_mr, critical} ],
//     checkpoints: [ {id, section_id, text, text_mr, evidence, weight,
//                     critical, allows_na, photo_required_on_fail, order} ],
//     created_at, updated_at, version }
//
//   frequency : 'daily' | 'weekly' | 'monthly' | 'custom'
//   cro_mode  : 'store'  (one score)
//             | 'per_cro' (run the whole checklist once per CRO)
//             | 'matrix'  (mark every checkpoint P/F/NA per CRO; per-CRO score)
// ---------------------------------------------------------------------------

// Factory default DAILY template — rebuilt from the code constants so
// "reset to default" always has a clean source of truth.
function factoryDailyTemplate() {
  const sections = SOPS.slice().sort((a, b) => a.display_order - b.display_order)
    .map(s => ({ id: s.id, name: s.name, name_mr: tSop(s.id, s.name), critical: !!s.critical }));
  const checkpoints = CHECKPOINTS.slice()
    .sort((a, b) => a.order - b.order)
    .map(c => ({
      id: c.id, section_id: c.sop_id,
      text: c.text, text_mr: tCheckpoint(c.id, c.text),
      evidence: c.evidence || '',
      weight: c.weight, critical: !!c.critical,
      allows_na: !!c.allows_na,
      photo_required_on_fail: !!c.photo_required_on_fail,
      order: c.order,
    }));
  return {
    id: 'tpl_daily', name: 'Daily Audit', name_mr: 'दैनिक ऑडिट',
    frequency: 'daily', cro_mode: 'store', built_in: true, active: true,
    sections, checkpoints,
    created_at: new Date().toISOString(), updated_at: new Date().toISOString(), version: 1,
  };
}

// Factory default WEEKLY template — from WEEKLY_CHECKPOINTS (grouped).
function factoryWeeklyTemplate() {
  const groupOrder = ['operations', 'cash_weekly', 'reporting_service', 'inventory_weekly'];
  const seen = {};
  const sections = [];
  WEEKLY_CHECKPOINTS.forEach(c => {
    if (!seen[c.group]) {
      seen[c.group] = true;
      sections.push({ id: c.group, name: c.group_en, name_mr: c.group_mr || c.group_en, critical: !!c.critical });
    }
  });
  sections.sort((a, b) => groupOrder.indexOf(a.id) - groupOrder.indexOf(b.id));
  const checkpoints = WEEKLY_CHECKPOINTS.slice()
    .sort((a, b) => a.sequence - b.sequence)
    .map((c, i) => ({
      id: c.id, section_id: c.group,
      text: c.text, text_mr: c.text_mr || '',
      evidence: c.evidence || '',
      weight: c.weight, critical: !!c.critical,
      allows_na: !!c.allows_na,
      photo_required_on_fail: !!c.photo_required_on_fail,
      order: i + 1,
    }));
  return {
    id: 'tpl_weekly', name: 'Weekly Audit', name_mr: 'साप्ताहिक ऑडिट',
    frequency: 'weekly', cro_mode: 'store', built_in: true, active: true,
    sections, checkpoints,
    created_at: new Date().toISOString(), updated_at: new Date().toISOString(), version: 1,
  };
}

const Templates = {
  all(state) { return (state || Store.load()).templates || []; },
  active(state) { return Templates.all(state).filter(t => t.active); },
  byId(state, id) { return Templates.all(state).find(t => t.id === id) || null; },

  // Seed built-ins on first run (or restore a deleted built-in).
  ensureSeeded() {
    const state = Store.load();
    state.templates = state.templates || [];
    let changed = false;
    if (!state.templates.some(t => t.id === 'tpl_daily')) {
      state.templates.push(factoryDailyTemplate()); changed = true;
    }
    if (!state.templates.some(t => t.id === 'tpl_weekly')) {
      state.templates.push(factoryWeeklyTemplate()); changed = true;
    }
    if (changed) Store.save(state);
  },

  save(tpl) {
    const state = Store.load();
    tpl.updated_at = new Date().toISOString();
    const i = state.templates.findIndex(t => t.id === tpl.id);
    if (i >= 0) state.templates[i] = tpl; else state.templates.push(tpl);
    Store.save(state);
  },

  create({ name, frequency, cro_mode }) {
    const state = Store.load();
    const tpl = {
      id: 'tpl_' + uuid(),
      name: name || 'New audit',
      name_mr: '',
      frequency: frequency || 'daily',
      cro_mode: cro_mode || 'store',
      built_in: false, active: true,
      sections: [{ id: 's_' + uuid(), name: 'Section 1', name_mr: '', critical: false }],
      checkpoints: [],
      created_at: new Date().toISOString(), updated_at: new Date().toISOString(), version: 1,
    };
    state.templates.push(tpl);
    Store.save(state);
    return tpl;
  },

  remove(id) {
    const state = Store.load();
    state.templates = state.templates.filter(t => t.id !== id);
    Store.save(state);
  },

  resetToDefault(id) {
    if (id === 'tpl_daily') Templates.save(factoryDailyTemplate());
    else if (id === 'tpl_weekly') Templates.save(factoryWeeklyTemplate());
  },
};

function uuid() {
  return 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function today() { return new Date().toISOString().slice(0, 10); }

// Daily-reminder toggle in Settings. Delegates to SaagarShell so the
// scheduling logic stays in one place.
window.onDailyReminderToggle = async function (on) {
  if (!window.SaagarShell) return;
  window.SaagarShell.setDailyReminderEnabled(on);
  try {
    if (on) {
      const ok = await window.SaagarShell.scheduleDailyReminder();
      if (ok) {
        toast(tUi('ok.reminder_set'));
      } else {
        toast(tUi('err.schedule_failed'));
        // Roll the checkbox back so the UI matches the real state.
        window.SaagarShell.setDailyReminderEnabled(false);
        const cb = document.getElementById('dailyReminderToggle');
        if (cb) cb.checked = false;
      }
    } else {
      await window.SaagarShell.cancelDailyReminder();
      toast(tUi('ok.reminder_off'));
    }
  } catch (e) {
    console.error(e);
    toast(tUi('err.reminder_failed'));
  }
};

// SQLite storage toggle (Owner, device only). ENABLE: back up (must complete)
// → verified migration → set the device flag only on success. DISABLE: back up
// → write the live SQLite mirror BACK to localStorage (so it's current, not a
// stale copy) → revert. Either way the original data is never lost.
window.onSqliteToggle = async function (on) {
  if (!window.SaagarShell || typeof CapacitorSqlDriver === 'undefined') { render(); return; }
  if (on) {
    if (!confirm(tUi('sqlite.enable_confirm'))) { render(); return; }
    // 1. A real backup must complete first (invariant: no migration without
    //    a verified backup). A cancelled share aborts.
    let backup = null;
    try { backup = await window.SaagarShell.backup(); } catch (_) { backup = null; }
    if (!backup || backup.cancelled || !backup.ok) { toast(tUi('sqlite.need_backup')); render(); return; }
    // 2. Verified migration (imports, reads back, deep-equals the live object).
    toast(tUi('sqlite.migrating'));
    try {
      const driver = new CapacitorSqlDriver('saagar_audit');
      const res = await SqliteBackend.migrateFromLocalStorage(driver, { backupVerified: true });
      if (res && res.ok) {
        setSqliteEnabled(true);
        alert(tUi('sqlite.enabled_restart'));
      } else {
        toast(tUi('sqlite.migrate_failed') + (res && res.reason ? ' (' + res.reason + ')' : ''));
      }
    } catch (e) {
      console.error('SQLite enable failed', e);
      toast(tUi('sqlite.migrate_failed'));
    }
    render();
  } else {
    if (!confirm(tUi('sqlite.disable_confirm'))) { render(); return; }
    try { await window.SaagarShell.backup(); } catch (_) {}
    try {
      // Write the CURRENT live state back to localStorage so reverting is not a
      // stale copy (data written under SQLite is preserved).
      const live = Persistence.backend.readPersisted();
      LocalStorageBackend.writePersisted(live);
    } catch (e) {
      console.error('SQLite disable write-back failed', e);
      toast(tUi('sqlite.disable_failed'));
      render();
      return;
    }
    setSqliteEnabled(false);
    Persistence.backend = LocalStorageBackend;
    alert(tUi('sqlite.disabled_restart'));
    render();
  }
};

// Show/hide the backdate reason field whenever the audit date != today.
// Inlined onchange so it survives renderAuditTab re-renders.
window.toggleBackdateField = function () {
  const dateEl = document.getElementById('auditDate');
  const field  = document.getElementById('backdateField');
  if (!dateEl || !field) return;
  const isBackdated = dateEl.value && dateEl.value !== today();
  field.hidden = !isBackdated;
  if (isBackdated) {
    const ta = document.getElementById('backdateReason');
    if (ta && document.activeElement !== ta) ta.focus();
  }
};

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}

// "Last backup: 3 days ago" etc. — used in the Settings backup card and the
// Home tab card so the Owner can see if they've gone stale.
function daysSince(iso) {
  if (!iso) return null;
  const ms = Date.now() - new Date(iso).getTime();
  return Math.floor(ms / 86400000);
}

// Conservative storage usage estimate against the typical ~5 MB localStorage
// quota. We measure only OUR key — the photos in audit results dominate the
// payload. Returns { bytes, limit, pct } or null on any failure.
function storageHealth() {
  try {
    const raw = localStorage.getItem(STORE_KEY) || '';
    // localStorage stores UTF-16 internally — 2 bytes per JS character.
    const bytes = raw.length * 2;
    const pct = Math.min(100, Math.round((bytes / CONFIG.storage.limitBytes) * 100));
    return { bytes, limit: CONFIG.storage.limitBytes, pct };
  } catch (_) { return null; }
}

// Visible warning banner rendered above the active tab when usage > 70%.
// Returns '' when storage is healthy so the banner doesn't take up space.
function storageWarnBanner() {
  const h = storageHealth();
  if (!h || h.pct < CONFIG.storage.warnPct) return '';
  const mb = (h.bytes / (1024 * 1024)).toFixed(1);
  return `<div class="card" style="background:#fff4e5;border-color:#f4c674;color:#6a4a00;margin-bottom:10px">
    <strong>${tUi('label.storage_full_warn')}</strong>
    <p style="margin:4px 0 0;font-size:13px;line-height:1.45">${escapeHtml(tUi('hint.storage_full_warn_fmt').replace('{pct}', h.pct).replace('{mb}', mb))}</p>
  </div>`;
}

// Demo banner — shown only when the store was seeded from a demo dataset
// (state._demo). Makes it unmistakable this is a test build with dummy data,
// and tells the user how to wipe it for real use.
function demoBanner(state) {
  if (!state || !state._demo) return '';
  return `<div class="card" style="background:#eef3ff;border-color:#9bb8e8;color:#1a3a6b;margin-bottom:10px">
    <strong>${tUi('demo.title')}</strong>
    <p style="margin:4px 0 0;font-size:13px;line-height:1.45">${tUi('demo.intro')}</p>
  </div>`;
}

// "Last backup" status string for the Backup & restore card.
function lastBackupLine(state) {
  const days = daysSince(state && state.last_backup_at);
  if (days == null) return tUi('hint.last_backup_never');
  if (days === 0) return tUi('hint.last_backup_today');
  return tUi('hint.last_backup_days_fmt').replace('{n}', days);
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.hidden = true; }, CONFIG.timing.toastMs);
}

// ---------------------------------------------------------------------------
// CAPs — Corrective Action Plans (spec §9)
//
// Every audit FAIL spawns a CAP. CAP lifecycle:
//   open → done → verified → closed
//   open → aged (auto, when deadline < today)
//   done → open (GM rejects verification)
//
// Roles: anyone can mark Done. Only GM / Owner verify, reject or close.
// ---------------------------------------------------------------------------

const CAP_STATUSES = ['open', 'done', 'verified', 'closed', 'aged'];
// Backwards-compat: callers that read CAP_STATUS_LABEL[s] will keep working
// in English. New callers should use tCapStatus(s) for the localized label.
const CAP_STATUS_LABEL = new Proxy(
  { open: 'Open', done: 'Done', verified: 'Verified', closed: 'Closed', aged: 'Aged' },
  { get(target, prop) { return typeof I18n !== 'undefined' ? tCapStatus(prop) : target[prop]; } }
);

function isoWeekOf(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

function nextCapId(existingCaps, dateStr) {
  const d = new Date(dateStr);
  const year = d.getFullYear();
  const week = isoWeekOf(d);
  const prefix = `CAP-${year}-W${String(week).padStart(2, '0')}-`;
  const used = existingCaps
    .map(c => c.id || '')
    .filter(id => id.startsWith(prefix))
    .map(id => parseInt(id.slice(prefix.length), 10))
    .filter(n => !isNaN(n));
  const next = (used.length ? Math.max(...used) : 0) + 1;
  return prefix + String(next).padStart(2, '0');
}

function addDays(dateStr, days) {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

// Walks an audit's results and creates one CAP per FAIL.
function autoCreateCapsForAudit(audit) {
  const state = Store.load();
  const existing = state.caps || [];
  // Skip if CAPs for this audit already exist (replay-safe).
  if (existing.some(c => c.audit_id === audit.id)) return [];

  const deadline = addDays(audit.date, 7);
  const newCaps = [];
  const cps = checkpointsFor(audit);
  const cpById = {};
  cps.forEach(c => { cpById[c.id] = c; });

  // Collect FAILs from whichever results shape this audit uses.
  const fails = []; // { cpId, r }
  if (auditIsPerCro(audit)) {
    Object.keys(audit.cro_results || {}).forEach(croId => {
      Object.entries(audit.cro_results[croId]).forEach(([cpId, r]) => {
        if (r.result === 'F') fails.push({ cpId, r: Object.assign({}, r, { cro_id: croId }) });
      });
    });
  } else {
    Object.entries(audit.results || {}).forEach(([cpId, r]) => {
      if (r.result === 'F') fails.push({ cpId, r });
    });
  }

  fails.forEach(({ cpId, r }) => {
    const cp = cpById[cpId]
      || CHECKPOINTS.find(c => c.id === cpId)
      || WEEKLY_CHECKPOINTS.find(c => c.id === cpId);
    if (!cp) return;
    newCaps.push({
      id: nextCapId(existing.concat(newCaps), audit.date),
      audit_id: audit.id,
      audit_date: audit.date,
      checkpoint_id: cpId,
      sop_id: cp.section_id || cp.sop_id || cp.group || null,
      finding: r.finding || '',
      cro_id: r.cro_id || null,
      photos: r.photos || [],
      why1: '', why2: '', why3: '', why4: '', why5: '',
      root_cause: '',
      action_steps: [],
      responsible_user_id: audit.auditor_id || null,
      deadline,
      status: 'open',
      created_at: new Date().toISOString(),
      done_at: null,
      verified_at: null, verified_by: null, verify_notes: null,
      closed_at: null, closed_by: null,
    });
  });
  state.caps = existing.concat(newCaps);
  Store.save(state);
  return newCaps;
}

// Age open CAPs whose deadline has passed. Idempotent — call on every render.
function ageOverdueCaps() {
  const state = Store.load();
  const t = today();
  let changed = false;
  (state.caps || []).forEach(c => {
    if (c.status === 'open' && c.deadline && c.deadline < t) {
      c.status = 'aged';
      changed = true;
    }
  });
  if (changed) Store.save(state);
}

const Caps = {
  list(state) { return state.caps || []; },
  byId(state, id) { return (state.caps || []).find(c => c.id === id) || null; },
  byAudit(state, auditId) { return (state.caps || []).filter(c => c.audit_id === auditId); },

  save(cap) {
    const state = Store.load();
    state.caps = state.caps || [];
    const i = state.caps.findIndex(c => c.id === cap.id);
    if (i >= 0) state.caps[i] = cap; else state.caps.push(cap);
    Store.save(state);
  },

  // Status transitions
  markDone(id) {
    const state = Store.load();
    const c = Caps.byId(state, id);
    if (!c) return;
    c.status = 'done';
    c.done_at = new Date().toISOString();
    Caps.save(c);
  },
  verify(id, verifiedBy, notes) {
    const state = Store.load();
    const c = Caps.byId(state, id);
    if (!c) return;
    c.status = 'verified';
    c.verified_at = new Date().toISOString();
    c.verified_by = verifiedBy;
    c.verify_notes = notes || '';
    Caps.save(c);
  },
  reject(id, rejectedBy, notes) {
    const state = Store.load();
    const c = Caps.byId(state, id);
    if (!c) return;
    c.status = 'open';
    c.done_at = null;
    c.verify_notes = notes || '';
    c.last_rejected_by = rejectedBy;
    Caps.save(c);
  },
  close(id, closedBy) {
    const state = Store.load();
    const c = Caps.byId(state, id);
    if (!c) return;
    c.status = 'closed';
    c.closed_at = new Date().toISOString();
    c.closed_by = closedBy;
    Caps.save(c);
  },
};

// ---------------------------------------------------------------------------
// Escalation engine (spec §7)
//
// Seven triggers checked at audit-submit time. Each fires a pre-composed
// 4-part English WhatsApp message (what happened / evidence / impact /
// requested action) and points at the GM or Owner phone number.
// ---------------------------------------------------------------------------

const ESC_TRIGGERS = {
  1: 'Daily Critical band',
  2: 'Recurring checkpoint failure',
  3: 'Cash variance',
  4: 'Inventory variance',
  5: 'Theft / security / legal',
  6: 'Customer complaint',
  7: 'Declining trend',
};

// Keyword sniffing — finding text gets compared to these (case-insensitive).
const T5_KEYWORDS = [
  'theft', 'thief', 'steal', 'stole', 'stolen', 'missing cash',
  'missing stock', 'missing inventory', 'police', 'lawyer', 'legal notice',
  'lawsuit', 'fraud', 'fraudulent', 'suspicious', 'tampered',
];
const T6_KEYWORDS = [
  'complaint', 'complained', 'angry customer', 'irate customer',
  'dissatisfied', 'refund denied', 'manager called', 'social media',
  'twitter', 'facebook post', 'review', 'demand',
];

function findKeyword(text, keywords) {
  if (!text) return null;
  const lower = text.toLowerCase();
  return keywords.find(k => lower.includes(k)) || null;
}

// Build a 4-part English message per Spec §7.
function composeMessage({ what, evidence, impact, action }) {
  return [
    `What happened: ${what}`,
    `Evidence: ${evidence}`,
    `Impact: ${impact}`,
    `Requested action: ${action}`,
  ].join('\n\n');
}

function fmtDateShort(d) {
  return new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}

// Pure: returns a list of *new* escalation drafts for this audit. Drafts have
// no id / raised_at yet — saveEscalations stamps them.
function evaluateEscalationsForAudit(audit, state) {
  const out = [];
  const score = audit.score;
  const fails = Object.entries(audit.results || {})
    .filter(([_, r]) => r.result === 'F')
    .map(([cpId, r]) => ({ cpId, ...r }));

  // -- T1: Daily Critical band (<80%) -----------------------------------
  if (score && score.pct < 80) {
    const cashOrInvFail = fails.some(f =>
      f.cpId.startsWith('6.') || f.cpId.startsWith('7.'));
    const failBySop = {};
    fails.forEach(f => {
      const cp = CHECKPOINTS.find(c => c.id === f.cpId);
      const sop = cp && SOPS.find(s => s.id === cp.sop_id);
      const key = sop ? sop.name : 'Other';
      failBySop[key] = (failBySop[key] || 0) + 1;
    });
    const sopBreakdown = Object.entries(failBySop)
      .map(([k, n]) => `${k} (${n})`).join(', ');
    out.push({
      trigger_number: 1,
      trigger_label: ESC_TRIGGERS[1],
      severity: 'critical',
      recipient_role: cashOrInvFail ? 'OWNER' : 'GM',
      message: composeMessage({
        what: `Daily audit on ${fmtDateShort(audit.date)} scored ${score.pct.toFixed(1)}% (Critical, target ${CONFIG.targets.daily}%+).`,
        evidence: `${fails.length} FAILs across ${sopBreakdown || 'multiple SOPs'}. Auditor: ${audit.auditor_name || '—'}.`,
        impact: cashOrInvFail
          ? 'Compliance band breached AND a Cash or Inventory critical FAILed — direct loss risk.'
          : 'Compliance band breached. Today\'s operations do not meet store standards.',
        action: `Review the audit in the app and call ${audit.auditor_name || 'the SM'} before tomorrow's opening.`,
      }),
    });
  }

  // -- T2: Recurring checkpoint failure (5+ days in last 7) -------------
  const auditDate = new Date(audit.date);
  const cutoff = new Date(auditDate); cutoff.setDate(cutoff.getDate() - 6);
  const cutoffStr = cutoff.toISOString().slice(0, 10);
  const recent = (state.audits || []).filter(a =>
    isFinalized(a) && a.date >= cutoffStr && a.date <= audit.date);
  const failCounts = {};
  const failDates = {};
  recent.forEach(a => {
    Object.entries(a.results || {}).forEach(([cpId, r]) => {
      if (r.result !== 'F') return;
      failCounts[cpId] = (failCounts[cpId] || 0) + 1;
      (failDates[cpId] = failDates[cpId] || []).push(a.date);
    });
  });
  Object.entries(failCounts).forEach(([cpId, count]) => {
    if (count >= 5) {
      const cp = CHECKPOINTS.find(c => c.id === cpId);
      out.push({
        trigger_number: 2,
        trigger_label: ESC_TRIGGERS[2],
        severity: 'high',
        recipient_role: 'GM',
        message: composeMessage({
          what: `Checkpoint ${cpId} "${cp ? cp.text : 'unknown'}" failed ${count} times in the last 7 days.`,
          evidence: `Failure dates: ${failDates[cpId].map(fmtDateShort).join(', ')}.`,
          impact: 'Recurring failure on the same point — process or training gap, not a one-off mistake.',
          action: 'Open a Pattern CAP in the app, run a 5 Whys with the responsible staff, set a 7-day deadline.',
        }),
      });
    }
  });

  // -- T3: Cash variance > ₹500 (proxy: any Cash SOP FAIL today) --------
  const cashFails = fails.filter(f => f.cpId.startsWith('6.'));
  if (cashFails.length > 0) {
    const findings = cashFails
      .filter(f => f.finding)
      .map(f => `${f.cpId}: ${f.finding}`)
      .join(' | ') || `${cashFails.length} cash checkpoint FAIL(s) without text`;
    // Check yesterday too — if cash failed yesterday too, escalate to Owner.
    const yest = new Date(auditDate); yest.setDate(yest.getDate() - 1);
    const yestStr = yest.toISOString().slice(0, 10);
    const yesterdayAudit = (state.audits || []).find(a =>
      isFinalized(a) && a.date === yestStr);
    const yesterdayCash = yesterdayAudit && Object.entries(yesterdayAudit.results || {})
      .some(([cpId, r]) => r.result === 'F' && cpId.startsWith('6.'));
    out.push({
      trigger_number: 3,
      trigger_label: ESC_TRIGGERS[3],
      severity: yesterdayCash ? 'critical' : 'high',
      recipient_role: yesterdayCash ? 'OWNER' : 'GM',
      message: composeMessage({
        what: `Cash SOP FAILed on ${fmtDateShort(audit.date)}${yesterdayCash ? ' — and also yesterday.' : '.'}`,
        evidence: findings,
        impact: yesterdayCash
          ? 'Cash control failure on consecutive days — direct money risk, possible theft or systemic gap.'
          : 'Direct cash risk. Could mask process error, undercounting or worse.',
        action: 'Re-count EOD cash, review the cash sheet, and call the auditor today.',
      }),
    });
  }

  // -- T4 (inventory variance) & T7 (declining trend) are weekly-only and
  //    live in evaluateWeeklyEscalations(), run when a weekly audit submits.

  // -- T5: Theft / security / legal keywords — one escalation per audit -
  const t5Hits = fails
    .map(f => ({ f, hit: findKeyword(f.finding, T5_KEYWORDS) }))
    .filter(x => x.hit);
  if (t5Hits.length > 0) {
    const evidence = t5Hits
      .map(x => `CP ${x.f.cpId}: "${x.f.finding}"`)
      .join('  |  ');
    const hitWords = Array.from(new Set(t5Hits.map(x => x.hit))).join(', ');
    out.push({
      trigger_number: 5,
      trigger_label: ESC_TRIGGERS[5],
      severity: 'critical',
      recipient_role: 'OWNER',
      message: composeMessage({
        what: `Audit finding flags a security or legal red flag (keywords: ${hitWords}).`,
        evidence,
        impact: 'Possible theft, security breach, or legal exposure. Could be loss-of-licence territory.',
        action: 'Investigate immediately. Preserve evidence — CCTV, registers, cash count. Don\'t let staff close the store before you arrive.',
      }),
    });
  }

  // -- T6: Customer complaint — one escalation per audit ----------------
  const t6Hits = fails
    .map(f => ({ f, hit: findKeyword(f.finding, T6_KEYWORDS) }))
    .filter(x => x.hit);
  if (t6Hits.length > 0) {
    const evidence = t6Hits
      .map(x => `CP ${x.f.cpId}: "${x.f.finding}"`)
      .join('  |  ');
    const hitWords = Array.from(new Set(t6Hits.map(x => x.hit))).join(', ');
    out.push({
      trigger_number: 6,
      trigger_label: ESC_TRIGGERS[6],
      severity: 'high',
      recipient_role: 'OWNER',
      message: composeMessage({
        what: `Audit finding flags a customer complaint that needs management (keywords: ${hitWords}).`,
        evidence,
        impact: 'Brand reputation. Customer may escalate publicly (social media, regulator, Titan corporate).',
        action: 'Call the customer today. Brief the Owner. Document the resolution.',
      }),
    });
  }

  // -- T7: Declining trend — weekly-only (see evaluateWeeklyEscalations).

  return out;
}

// Weekly-only escalations, run when a weekly audit is submitted.
//  T4 — Inventory variance: any weekly Inventory checkpoint FAILed (proxy for
//       a > ~1% variance; the engine has no live stock count, the GM's FAIL is
//       the signal). Routed to the Owner — stock loss is direct money risk.
//  T7 — Declining trend: this week's pct is lower than each of the prior two
//       weekly audits (a three-week slide), routed to the Owner.
function evaluateWeeklyEscalations(audit, state) {
  const out = [];
  const score = audit.score;
  const set = checkpointsFor(audit);
  const isInv = cp => cp.group === 'inventory_weekly' || /^IW\./.test(cp.id);
  const fails = Object.entries(audit.results || {})
    .filter(([, r]) => r.result === 'F')
    .map(([cpId, r]) => ({ cpId, ...r }));

  // -- T4: Inventory variance (weekly) ---------------------------------
  const invIds = new Set(set.filter(isInv).map(c => c.id));
  const invFails = fails.filter(f => invIds.has(f.cpId));
  if (invFails.length > 0) {
    const evidence = invFails
      .map(f => f.finding ? `${f.cpId}: ${f.finding}` : `${f.cpId}: inventory checkpoint FAIL`)
      .join('  |  ');
    out.push({
      trigger_number: 4,
      trigger_label: ESC_TRIGGERS[4],
      severity: 'critical',
      recipient_role: 'OWNER',
      message: composeMessage({
        what: `Weekly inventory control FAILed in Week ${audit.week_number}, ${audit.year} (${invFails.length} checkpoint${invFails.length > 1 ? 's' : ''}).`,
        evidence,
        impact: 'Inventory variance/shrinkage is direct stock loss and can mask theft. Titan stock is high value.',
        action: 'Order a physical re-count of the flagged lines, reconcile against the system, and review who handled stock this week.',
      }),
    });
  }

  // -- T7: Declining trend across three weekly audits ------------------
  if (score) {
    const prior = (state.audits || [])
      .filter(a => a.id !== audit.id && frequencyOf(a) === 'weekly' && isFinalized(a) && a.score)
      .filter(a => a.year < audit.year || (a.year === audit.year && a.week_number < audit.week_number))
      .sort((a, b) => (b.year - a.year) || (b.week_number - a.week_number));
    if (prior.length >= 2) {
      const w0 = score.pct;            // this week
      const w1 = prior[0].score.pct;   // last week
      const w2 = prior[1].score.pct;   // two weeks ago
      if (w0 < w1 && w1 < w2) {
        out.push({
          trigger_number: 7,
          trigger_label: ESC_TRIGGERS[7],
          severity: 'high',
          recipient_role: 'OWNER',
          message: composeMessage({
            what: `Weekly compliance has fallen three weeks running: ${w2.toFixed(1)}% → ${w1.toFixed(1)}% → ${w0.toFixed(1)}%.`,
            evidence: `Weeks ${prior[1].week_number}, ${prior[0].week_number} and ${audit.week_number} of ${audit.year}.`,
            impact: 'A sustained slide is a systemic problem, not a bad day — left alone it compounds.',
            action: 'Sit in on the next weekly review, pick the top recurring failure, and own a CAP personally until the trend reverses.',
          }),
        });
      }
    }
  }

  return out;
}

const Escalations = {
  list(state) { return state.escalations || []; },
  byId(state, id) { return (state.escalations || []).find(e => e.id === id) || null; },
  unsent(state) { return (state.escalations || []).filter(e => !e.sent_at); },

  // Save a batch of new escalations from evaluateEscalationsForAudit.
  saveDrafts(drafts, audit) {
    const state = Store.load();
    state.escalations = state.escalations || [];
    // Idempotent: skip if this trigger # for this audit already exists.
    // Stage A #4 shadow-log: when an evaluator re-fires the SAME trigger for
    // the SAME audit, we suppress the duplicate (correct), but log it so we
    // can confirm — before flipping the audit's recommended "keep sent
    // escalations visible same-day" default — that no real re-fires happen
    // in the field. Grep device logs for "[esc-rfire-shadow]" over 1 week.
    const newOnes = [];
    drafts.forEach(d => {
      const dup = state.escalations.find(e =>
        e.audit_id === audit.id && e.trigger_number === d.trigger_number);
      if (dup) {
        console.log('[esc-rfire-shadow]', 'audit=' + audit.id, 'trigger=T' + d.trigger_number, 'existing-id=' + dup.id);
        return;
      }
      newOnes.push(Object.assign({}, d, {
        id: 'esc-' + uuid(),
        audit_id: audit.id,
        raised_at: new Date().toISOString(),
        sent_at: null,
        sent_via: null,
        sent_by: null,
      }));
    });
    state.escalations = state.escalations.concat(newOnes);
    Store.save(state);
    return newOnes;
  },

  markSent(id, sentBy, via) {
    const state = Store.load();
    const e = Escalations.byId(state, id);
    if (!e) return;
    e.sent_at = new Date().toISOString();
    e.sent_via = via || 'whatsapp';
    e.sent_by = sentBy || null;
    Store.save(state);
  },

  dismiss(id, dismissedBy, reason) {
    const state = Store.load();
    const e = Escalations.byId(state, id);
    if (!e) return;
    e.sent_at = new Date().toISOString();
    e.sent_via = 'dismissed';
    e.sent_by = dismissedBy || null;
    e.dismiss_reason = (reason || '').trim();
    Store.save(state);
  },
};

// Run on audit submit. Returns the count of new escalations.
function processEscalationsForAudit(audit) {
  const state = Store.load();
  const drafts = evaluateEscalationsForAudit(audit, state);
  const saved = Escalations.saveDrafts(drafts, audit);
  return saved.length;
}

// Run on weekly audit submit (T4 inventory + T7 declining trend).
function processWeeklyEscalations(audit) {
  const state = Store.load();
  const drafts = evaluateWeeklyEscalations(audit, state);
  const saved = Escalations.saveDrafts(drafts, audit);
  return saved.length;
}

// Render the unsent escalation cards that show on top of the Audit tab.
function renderEscalationCards(state, auth) {
  const unsent = Escalations.unsent(state).sort((a, b) =>
    (b.raised_at || '').localeCompare(a.raised_at || ''));
  if (unsent.length === 0) return '';

  return unsent.map(e => {
    const recipient = findRecipient(state, e.recipient_role);
    const hasPhone = recipient && recipient.phone;
    const audit = (state.audits || []).find(a => a.id === e.audit_id);
    const preview = (e.message || '').split('\n').slice(0, 2).join(' · ').slice(0, 180);
    const sevClass = e.severity === 'critical' ? 'crit' : (e.severity === 'high' ? 'high' : 'norm');

    return `
      <div class="alert-card ${sevClass}">
        <div class="alert-head">
          <span class="alert-sev ${sevClass}">${escapeHtml(e.severity.toUpperCase())}</span>
          <span class="alert-trigger">T${e.trigger_number} · ${escapeHtml(e.trigger_label)}</span>
        </div>
        <div class="alert-body">
          ${escapeHtml(preview)}${(e.message && e.message.length > 180) ? '…' : ''}
        </div>
        <div class="alert-recip">
          For <strong>${escapeHtml(recipient ? recipient.name : e.recipient_role)}</strong>
          ${recipient ? `(${escapeHtml(roleLabel(recipient.role))})` : ''}
          ${hasPhone
            ? `· ${escapeHtml(displayPhone(recipient.phone))}`
            : `<span style="color:var(--red)">· no phone on file</span>`}
        </div>
        <div class="alert-actions">
          ${hasPhone
            ? `<button class="btn btn-whatsapp" data-action="esc-send" data-id="${escapeHtml(e.id)}">${tUi('share.send_whatsapp_emoji')}</button>`
            : `<button class="btn btn-ghost" data-action="esc-preview" data-id="${escapeHtml(e.id)}">${tUi('btn.view_message')}</button>`}
          <button class="btn btn-ghost" data-action="esc-dismiss" data-id="${escapeHtml(e.id)}">${tUi('btn.dismiss')}</button>
        </div>
      </div>`;
  }).join('');
}

// ---------------------------------------------------------------------------
// Crypto — PIN hashing via Web Crypto PBKDF2 (no library needed).
// ---------------------------------------------------------------------------

async function hashPin(pin, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(pin), { name: 'PBKDF2' }, false, ['deriveBits']
  );
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: enc.encode(salt), iterations: CONFIG.auth.pbkdf2Iterations, hash: 'SHA-256' },
    keyMaterial, 256
  );
  return Array.from(new Uint8Array(bits))
    .map(b => b.toString(16).padStart(2, '0')).join('');
}

async function verifyPin(pin, salt, expected) {
  return (await hashPin(pin, salt)) === expected;
}

function randomSalt() {
  const a = new Uint8Array(16);
  crypto.getRandomValues(a);
  return Array.from(a).map(b => b.toString(16).padStart(2, '0')).join('');
}

const Users = {
  listActive(state) { return state.users.filter(u => u.is_active); },
  listAll(state) { return state.users.slice(); },
  byId(state, id) { return state.users.find(u => u.id === id) || null; },

  async create({ name, role, pin, phone }) {
    const state = Store.load();
    const salt = randomSalt();
    const pin_hash = await hashPin(pin, salt);
    const u = {
      id: uuid(), name, role, pin_salt: salt, pin_hash,
      phone: normalizePhone(phone || ''),
      created_at: new Date().toISOString(), is_active: true,
    };
    state.users.push(u);
    Store.save(state);
    return u;
  },

  setPhone(userId, phone) {
    const state = Store.load();
    const u = Users.byId(state, userId);
    if (!u) return;
    u.phone = normalizePhone(phone || '');
    Store.save(state);
  },

  async changePin(userId, newPin) {
    const state = Store.load();
    const u = Users.byId(state, userId);
    if (!u) return false;
    u.pin_salt = randomSalt();
    u.pin_hash = await hashPin(newPin, u.pin_salt);
    Store.save(state);
    return true;
  },

  setActive(userId, active) {
    const state = Store.load();
    const u = Users.byId(state, userId);
    if (!u) return;
    u.is_active = !!active;
    Store.save(state);
  },
};

const AuthSession = {
  current(state) {
    state = state || Store.load();
    if (!state.current_user_id) return null;
    const u = Users.byId(state, state.current_user_id);
    if (!u || !u.is_active) return null;
    return u;
  },
  login(userId) {
    const state = Store.load();
    state.current_user_id = userId;
    Store.save(state);
  },
  logout() {
    const state = Store.load();
    state.current_user_id = null;
    Store.save(state);
    // Clear transient view state so the next user starts clean (Stage B #11).
    UiState.reset();
  },
};

function roleLabel(r) {
  return { OWNER: tUi('role.owner'), GM: tUi('role.gm'), SM: tUi('role.store_manager') }[r] || r;
}

// Phone helpers. India default: if 10 digits, prepend '91'.
function normalizePhone(input) {
  if (!input) return '';
  const digits = String(input).replace(/[^\d]/g, '');
  if (digits.length === 0) return '';
  if (digits.length === 10) return '91' + digits;
  return digits;
}

function displayPhone(p) {
  if (!p) return '';
  if (p.length === 12 && p.startsWith('91')) {
    return '+91 ' + p.slice(2, 7) + ' ' + p.slice(7);
  }
  return '+' + p;
}

function whatsappLink(phone, message) {
  const p = normalizePhone(phone || '');
  if (!p) return null;
  return `https://wa.me/${p}?text=${encodeURIComponent(message)}`;
}

// Build a plain-text summary of one submitted audit, ready to paste into
// WhatsApp / Telegram / email. Includes date, score band, top FAILs with
// CRO attribution, audit notes if any. Kept short enough that the chat
// preview reads cleanly.
function buildAuditWhatsappText(a, state) {
  const s = a.score || scoreAudit(a.results);
  const croById = Object.fromEntries(state.cros.map(c => [c.id, c]));
  const fails = CHECKPOINTS
    .map(cp => ({ cp, r: a.results[cp.id] || {} }))
    .filter(x => x.r.result === 'F')
    .slice(0, 6);
  const failLines = fails.length
    ? fails.map(({ cp, r }) => {
        const who = r.cro_id && croById[r.cro_id] ? ` — ${croById[r.cro_id].name}` : '';
        const find = r.finding ? `: ${r.finding}` : '';
        return `• CP ${cp.id}${find}${who}`;
      }).join('\n')
    : '(no fails)';

  const lines = [
    `📋 Saagar Audit — ${fmtDate(a.date)}`,
    `Score: ${s.pct.toFixed(1)}% ${bandLabel(s.band)} (${s.raw}/${s.max})`,
    `By: ${a.auditor_name || 'unknown'} · ${s.p}P · ${s.f}F · ${s.na}NA`,
  ];
  if (a.backdate_reason) lines.push(`⚠ Backdated: ${a.backdate_reason}`);
  if (a.notes)           lines.push(`📝 Notes: ${a.notes}`);
  lines.push('');
  lines.push(`Fails (${s.f}):`);
  lines.push(failLines);
  lines.push('');
  lines.push('— from Saagar Audit');
  return lines.join('\n');
}

// In-memory lockout — 5 wrong PINs within 60s → 60-second lockout.
const LoginGuard = {
  attempts: 0,
  lockedUntil: 0,
  register(success) {
    if (success) { this.attempts = 0; this.lockedUntil = 0; return; }
    this.attempts++;
    if (this.attempts >= CONFIG.auth.lockoutAttempts) {
      this.lockedUntil = Date.now() + CONFIG.auth.lockoutMs;
      this.attempts = 0;
    }
  },
  isLocked() { return this.lockedUntil > Date.now(); },
  secondsLeft() { return Math.max(0, Math.ceil((this.lockedUntil - Date.now()) / 1000)); },
};

// Approximate size of a base64 data URL in KB.
function dataUrlSizeKb(dataUrl) {
  const b64 = (dataUrl.split(',')[1] || '');
  return Math.round((b64.length * 0.75) / 1024);
